    * {

      box-sizing: border-box;

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #EBF0F2;
      color: #0F172A;
      margin: 0;
      padding: 0;
      overscroll-behavior-y: contain;

    /* Mobile-First App Shell */
    #app-shell {
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      background-color: #F4F7F8;
      position: relative;
      box-shadow: 0 0 40px rgba(15, 23, 42, 0.08);
      padding-bottom: 92px;
      overflow-x: hidden;
    }

    /* Curved Hero Header */
    .hero-gradient {
      background: linear-gradient(155deg, var(--brand) 0%, var(--brand-dark) 58%, var(--brand-darker) 100%);
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
    }

    /* Custom Scrollbar Hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Bottom Sheet & Modal Transitions */
    .modal-backdrop {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      animation: fadeIn 0.2s ease-out;
    }

    .bottom-sheet {
      animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Voice Pulse Animation */
    @keyframes pulseRing {
      0% { transform: scale(0.92); opacity: 0.8; }
      70% { transform: scale(1.35); opacity: 0; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    .voice-pulse::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 9999px;
      background: var(--brand);
      animation: pulseRing 1.5s infinite;
      z-index: 0;
    }

    /* Laser Scan Animation */
    @keyframes laserScan {
      0%, 100% { top: 8%; }
      50% { top: 88%; }
    }
    .scan-laser {
      position: absolute;
      left: 6%;
      right: 6%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #10B981, #FFFFFF, #10B981, transparent);
      box-shadow: 0 0 12px #10B981;
      animation: laserScan 2s ease-in-out infinite;
    }

    /* Long-Press FAB Feedback */
    .fab-btn {
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .fab-btn.pressing {
      transform: scale(0.91);

    const MONTH_NAMES_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const MONTH_NAMES_FULL = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const DAY_NAMES = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

    function formatRupiah(num) {
      const n = Math.round(Number(num) || 0);
      const prefix = n < 0 ? '-Rp ' : 'Rp ';
      return prefix + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function parseRupiahInput(str) {
      return Number(String(str || '').replace(/[^\d]/g, '')) || 0;
    }

    function formatTodayHeader() {
      const now = new Date();
      return `${DAY_NAMES[now.getDay()]}, ${now.getDate()} ${MONTH_NAMES_SHORT[now.getMonth()]} ${now.getFullYear()}`;
    }

    function toISODate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseISODate(isoStr) {
      const [y, m, d] = (isoStr || toISODate(new Date())).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function getDaysInMonth(year, monthIndex0) {
      return new Date(year, monthIndex0 + 1, 0).getDate();
    }

    function getPaydayForYearMonth(year, monthIndex0) {
      const ym = `${year}-${String(monthIndex0 + 1).padStart(2, '0')}`;
      const rawDay = appState.monthlyPaydays && appState.monthlyPaydays[ym]
        ? Number(appState.monthlyPaydays[ym])
        : Number(appState.defaultPayday || 30);
      const maxDays = getDaysInMonth(year, monthIndex0);
      return Math.min(Math.max(1, rawDay), maxDays);
    }

    function getCycleRange(cycleKey) {
      const [y, m] = cycleKey.split('-').map(Number);
      const m0 = m - 1;
      const startDay = getPaydayForYearMonth(y, m0);
      const startDate = new Date(y, m0, startDay);

      const nextDateObj = new Date(y, m0 + 1, 1);
      const ny = nextDateObj.getFullYear();
      const nm0 = nextDateObj.getMonth();
      const nextPayday = getPaydayForYearMonth(ny, nm0);
      const endDate = new Date(ny, nm0, nextPayday - 1);

      const label = `${startDate.getDate()} ${MONTH_NAMES_SHORT[startDate.getMonth()]} – ${endDate.getDate()} ${MONTH_NAMES_SHORT[endDate.getMonth()]}`;
      const fullLabel = `${startDate.getDate()} ${MONTH_NAMES_SHORT[startDate.getMonth()]} ${startDate.getFullYear()} – ${endDate.getDate()} ${MONTH_NAMES_SHORT[endDate.getMonth()]} ${endDate.getFullYear()}`;

      return {
        key: cycleKey,
        startDate,
        endDate,
        startISO: toISODate(startDate),
        endISO: toISODate(endDate),
        label,
        fullLabel
      };
    }

    function findCycleKeyForDate(dateObj) {
      const iso = toISODate(dateObj);
      const y = dateObj.getFullYear();
      const m0 = dateObj.getMonth();

      const currentMonthKey = `${y}-${String(m0 + 1).padStart(2, '0')}`;
      const currentCycle = getCycleRange(currentMonthKey);
      if (iso >= currentCycle.startISO && iso <= currentCycle.endISO) {
        return currentMonthKey;
      }

      if (iso < currentCycle.startISO) {
        const prev = new Date(y, m0 - 1, 1);
        return `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;
      } else {
        const next = new Date(y, m0 + 1, 1);
        return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}`;
      }
    }

    function getAvailableCycles() {
      const todayCycleKey = findCycleKeyForDate(new Date());
      const keysSet = new Set([todayCycleKey]);

      (appState.transactions || []).forEach((tx) => {
        if (tx.date) {
          const ck = findCycleKeyForDate(parseISODate(tx.date));
          keysSet.add(ck);
        }
      });

      const sortedKeys = Array.from(keysSet).sort((a, b) => b.localeCompare(a));
      return sortedKeys.map((k) => {
        const range = getCycleRange(k);
        return {
          ...range,
          isActiveToday: k === todayCycleKey
        };
      });
    }

      const prev = new Date(y, m - 2, 1);
      return `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;
    }

    function applyTheme(themeId) {
      const theme = ACCENT_THEMES.find((t) => t.id === themeId) || ACCENT_THEMES[0];
      appState.themeId = theme.id;
      document.documentElement.style.setProperty('--brand', theme.brand);
      document.documentElement.style.setProperty('--brand-dark', theme.dark);
      document.documentElement.style.setProperty('--brand-darker', theme.darker);
      document.documentElement.style.setProperty('--brand-tint', theme.tint);
      const metaTheme = document.getElementById('meta-theme-color');
      if (metaTheme) metaTheme.setAttribute('content', theme.brand);
      updateDynamicFavicon(theme.brand, theme.darker);
    }

    function buildCuanIconCanvas(size, colorTop = '#147D93', colorBottom = '#083D49') {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const s = size / 512;

      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, colorTop);
      grad.addColorStop(1, colorBottom);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 14 * s;
      ctx.beginPath();
      ctx.arc(256 * s, 256 * s, 176 * s, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 42 * s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      const startAngle = Math.atan2(184 - 256, 322 - 256);
      const endAngle = Math.atan2(328 - 256, 322 - 256);
      ctx.arc(256 * s, 256 * s, 98 * s, startAngle, endAngle, true);
      ctx.stroke();

      ctx.lineWidth = 24 * s;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(244 * s, 274 * s);
      ctx.lineTo(292 * s, 226 * s);
      ctx.lineTo(324 * s, 246 * s);
      ctx.lineTo(368 * s, 196 * s);
      ctx.stroke();

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.moveTo(376 * s, 144 * s);
      ctx.quadraticCurveTo(376 * s, 170 * s, 402 * s, 170 * s);
      ctx.quadraticCurveTo(376 * s, 170 * s, 376 * s, 196 * s);
      ctx.quadraticCurveTo(376 * s, 170 * s, 350 * s, 170 * s);
      ctx.quadraticCurveTo(376 * s, 170 * s, 376 * s, 144 * s);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.78)';
      ctx.beginPath();
      ctx.arc(332 * s, 146 * s, 6 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      return canvas;
    }

    function updateDynamicFavicon(colorTop, colorBottom) {
      try {
        const png192 = buildCuanIconCanvas(192, colorTop, colorBottom).toDataURL('image/png');
        const iconLink = document.querySelector('link[rel="icon"]');
        if (iconLink) {
          iconLink.setAttribute('type', 'image/png');
          iconLink.setAttribute('href', png192);
        }
        const appleLink = document.querySelector('link[rel="apple-touch-icon"]');
        if (appleLink) {
          appleLink.setAttribute('href', png192);
        }
      } catch (_) {}
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appState = {
            ...appState,
            ...parsed,
            categories: Array.isArray(parsed.categories) && parsed.categories.length
              ? parsed.categories
              : JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
            transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
            notifications: Array.isArray(parsed.notifications) ? parsed.notifications : [],
            monthlyPaydays: parsed.monthlyPaydays && typeof parsed.monthlyPaydays === 'object' ? parsed.monthlyPaydays : {}
          };
        }
      } catch (err) {
        console.warn('Gagal memuat state lokal:', err);
      }

      mergeDeveloperAnnouncements();
      applyTheme(appState.themeId);

      if (!uiState.selectedCycleKey) {
        uiState.selectedCycleKey = findCycleKeyForDate(new Date());
      }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.warn('Gagal menyimpan state lokal:', err);
      }
      if (currentUser && supabaseClient) {
        scheduleCloudSync();
      }

    function mergeDeveloperAnnouncements() {
      const existingIds = new Set((appState.notifications || []).map((n) => n.id));
      DEVELOPER_ANNOUNCEMENTS.forEach((ann) => {
        if (!existingIds.has(ann.id)) {
          appState.notifications.unshift({
            id: ann.id,
            title: ann.title,
            message: ann.message,
            time: ann.time || 'Pengumuman',
            read: false
          });
        }
      });
    }

    function translateAuthError(message) {
      const msg = String(message || '').toLowerCase();
      if (msg.includes('invalid login credentials')) return 'Email atau kata sandi salah. Coba periksa kembali.';
      if (msg.includes('user already registered')) return 'Email ini sudah terdaftar. Silakan masuk (Login).';
      if (msg.includes('password should be at least')) return 'Kata sandi minimal 6 karakter.';
      if (msg.includes('email not confirmed')) return 'Email belum terkonfirmasi. Matikan "Confirm email" di Supabase Auth.';
      if (msg.includes('security purposes') || msg.includes('rate limit') || msg.includes('seconds')) {
        const secMatch = msg.match(/(\d+)\s*second/);
        const sec = secMatch ? secMatch[1] : '60';
        return `Demi keamanan, tunggu ${sec} detik sebelum mengirim ulang email reset.`;
      }
      if (msg.includes('unable to validate email')) return 'Format alamat email tidak valid.';
      return message || 'Terjadi kesalahan autentikasi.';
    }

    async function initSupabase() {
      if (!window.supabase || !SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey) return;
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        if (window.location.hash && window.location.hash.includes('type=recovery')) {
          uiState.isPasswordRecovery = true;
        }

        supabaseClient.auth.onAuthStateChange(async (event, session) => {
          if (event === 'PASSWORD_RECOVERY') {
            uiState.isPasswordRecovery = true;
            openNewPasswordModal();
            return;
          }

          if (session && session.user) {
            currentUser = session.user;
            const metaName = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name;
            if (metaName && (!appState.userName || appState.userName === 'Sobat Cuan')) {
              appState.userName = metaName;
            }
            await loadCloudUserData();
            if (uiState.isPasswordRecovery) {
              openNewPasswordModal();
            }
          } else {
            currentUser = null;
            uiState.syncStatus = 'local';
            renderApp();
          }
        });

        const { data } = await supabaseClient.auth.getSession();
        if (data?.session?.user) {
          currentUser = data.session.user;
          await loadCloudUserData();
          if (uiState.isPasswordRecovery) {
            openNewPasswordModal();
          }
        }
      } catch (err) {
        console.warn('Supabase init error:', err);
      }
    }

    async function loadCloudUserData() {
      if (!currentUser || !supabaseClient) return;
      uiState.syncStatus = 'syncing';
      renderApp();

      try {
        const { data, error } = await supabaseClient
          .from('cuan_user_data')
          .select('payload')
          .eq('user_id', currentUser.id)
          .maybeSingle();

        if (error) throw error;

        if (data && data.payload && Object.keys(data.payload).length > 0) {
          appState = {
            ...appState,
            ...data.payload,
            categories: Array.isArray(data.payload.categories) && data.payload.categories.length
              ? data.payload.categories
              : appState.categories,
            transactions: Array.isArray(data.payload.transactions) ? data.payload.transactions : appState.transactions,
            notifications: Array.isArray(data.payload.notifications) ? data.payload.notifications : appState.notifications
          };
          mergeDeveloperAnnouncements();
          applyTheme(appState.themeId);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        } else {
          await syncCloudUserDataNow();
        }

        uiState.syncStatus = 'synced';
      } catch (err) {
        console.warn('Cloud load error:', err);
        uiState.syncStatus = 'error';
      }
      renderApp();
    }

    function scheduleCloudSync() {
      uiState.syncStatus = 'syncing';
      clearTimeout(syncTimeout);
      syncTimeout = setTimeout(() => {
        syncCloudUserDataNow();
      }, 800);
    }

    async function syncCloudUserDataNow() {
      if (!currentUser || !supabaseClient) return;
      try {
        const { error } = await supabaseClient
          .from('cuan_user_data')
          .upsert({
            user_id: currentUser.id,
            payload: appState,
            updated_at: new Date().toISOString()
          });

        if (error) throw error;
        uiState.syncStatus = 'synced';
      } catch (err) {
        console.warn('Cloud sync error:', err);
        uiState.syncStatus = 'error';
      }
      renderApp();
    }

    /**
     * ============================================================================
     * 6. KALKULASI METRIK SIKLUS, LIMIT POS & NOTIFIKASI
     * ============================================================================
     */
    function getCycleMetrics(cycleKey) {
      const range = getCycleRange(cycleKey || findCycleKeyForDate(new Date()));
      const txs = (appState.transactions || [])
        .filter((tx) => tx.date >= range.startISO && tx.date <= range.endISO)
        .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

      let totalIncome = 0;
      let totalExpense = 0;
      const expenseByCat = {};

      txs.forEach((tx) => {
        const amt = Number(tx.amount) || 0;
        if (tx.type === 'income') {
          totalIncome += amt;
        } else {
          totalExpense += amt;
          expenseByCat[tx.categoryId] = (expenseByCat[tx.categoryId] || 0) + amt;
        }
      });

      const netBalance = totalIncome - totalExpense;
      return {
        range,
        txs,
        totalIncome,
        totalExpense,
        netBalance,
        expenseByCat
      };
    }

    function addAppNotification(title, message) {
      appState.notifications.unshift({
        id: 'notif_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        title,
        message,
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
        read: false
      });
      if (appState.notifications.length > 35) {
        appState.notifications = appState.notifications.slice(0, 35);
      }
    }

    function checkCategoryBudgetAlert(categoryId, dateISO) {
      const cat = appState.categories.find((c) => c.id === categoryId);
      if (!cat || cat.type !== 'expense' || !cat.budgetLimit || cat.budgetLimit <= 0) return;

      const cycleKey = findCycleKeyForDate(parseISODate(dateISO));
      const metrics = getCycleMetrics(cycleKey);
      const spent = metrics.expenseByCat[categoryId] || 0;
      const ratio = spent / cat.budgetLimit;

      if (ratio >= 1) {
        const msg = `Pengeluaran "${cat.name}" sudah tembus ${formatRupiah(spent)} dari batas ${formatRupiah(cat.budgetLimit)}!`;
        showToast(`🚨 Limit Jebol: ${cat.name}!`, 'danger');
        addAppNotification(`Limit Jebol: ${cat.name}`, msg);
      } else if (ratio >= 0.8) {
        const rem = Math.max(0, cat.budgetLimit - spent);
        const msg = `Pos "${cat.name}" sudah terpakai ${Math.round(ratio * 100)}%. Sisa jatah aman: ${formatRupiah(rem)}.`;
        showToast(`⚠️ Lampu Kuning (${Math.round(ratio * 100)}%): ${cat.name}`, 'warning');
        addAppNotification(`Lampu Kuning: ${cat.name}`, msg);
      }
    }

    function startReminderScheduler() {
      setInterval(() => {
        if (!appState.reminderEnabled || !appState.reminderTime) return;
        const now = new Date();
        const todayISO = toISODate(now);
        if (appState.lastReminderDate === todayISO) return;

        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        if (`${hh}:${mm}` === appState.reminderTime) {
          appState.lastReminderDate = todayISO;
          const title = 'Waktunya Cek Cuan Harian ⏰';
          const msg = 'Jangan lupa catat semua jajan & pemasukan hari ini biar arus kas siklusmu tetap akurat!';
          addAppNotification(title, msg);
          showToast(title, 'info');
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(title, { body: msg, icon: '/icon.svg' });
          }
          saveState();
          renderApp();
        }
      }, 25000);
    }

    /**
     * ============================================================================
     * 7. NATURAL LANGUAGE PARSER (SUARA & CATAT AI)
     * ============================================================================
     */
    function parseIndonesianAmountTokens(segment) {
      let text = segment.toLowerCase().replace(/rp\.?/g, ' ').replace(/,/g, '.');

      // Slang nominal
      const slangMap = [
        { regex: /(\d+(?:\.\d+)?)\s*jt\b|(\d+(?:\.\d+)?)\s*juta\b/g, mult: 1000000 },
        { regex: /(\d+(?:\.\d+)?)\s*rb\b|(\d+(?:\.\d+)?)\s*ribu\b|(\d+(?:\.\d+)?)\s*k\b/g, mult: 1000 },
        { regex: /\bsetengah\s*juta\b/g, fixed: 500000 },
        { regex: /\bseceng\b/g, fixed: 1000 },
        { regex: /\bgoceng\b/g, fixed: 5000 },
        { regex: /\bceban\b/g, fixed: 10000 },
        { regex: /\bgoban\b/g, fixed: 50000 },
        { regex: /\bcepek\b/g, fixed: 100000 },
        { regex: /\bgopek\b/g, fixed: 500000 }
      ];

      for (const item of slangMap) {
        const m = item.regex.exec(text);
        if (m) {
          if (item.fixed) return item.fixed;
          const numStr = m[1] || m[2] || m[3];
          return Math.round(parseFloat(numStr) * item.mult);
        }
      }

      // Word numbers (e.g. "dua puluh lima ribu")
      const wordNums = {
        satu: 1, dua: 2, tiga: 3, empat: 4, lima: 5,
        enam: 6, tujuh: 7, delapan: 8, sembilan: 9, sepuluh: 10,
        sebelas: 11, seratus: 100, seribu: 1000, sejuta: 1000000
      };
      if (text.includes('ribu') || text.includes('juta')) {
        let total = 0;
        let current = 0;
        const words = text.split(/\s+/);
        let foundWord = false;
        words.forEach((w) => {
          if (wordNums[w] !== undefined) {
            foundWord = true;
            if (w === 'seratus') current += 100;
            else if (w === 'seribu') { total += 1000; }
            else if (w === 'sejuta') { total += 1000000; }
            else current += wordNums[w];
          } else if (w === 'belas') {
            current += 10;
          } else if (w === 'puluh') {
            current = (current || 1) * 10;
          } else if (w === 'ratus') {
            current = (current || 1) * 100;
          } else if (w === 'ribu') {
            total += (current || 1) * 1000;
            current = 0;
          } else if (w === 'juta') {
            total += (current || 1) * 1000000;
            current = 0;
          }
        });
        if (foundWord && total + current > 0) return total + current;
      }

      // Plain digits with dots (e.g. "25.000" or "25000")
      const plainMatch = text.match(/\b(\d{1,3}(?:\.\d{3})+|\d{4,9})\b/);
      if (plainMatch) {
        return Number(plainMatch[1].replace(/\./g, '')) || 0;
      }

      return 0;
    }

    function guessCategoryFromText(text, type) {
      const t = text.toLowerCase();
      if (type === 'income') {
        if (t.includes('gaji') || t.includes('thr') || t.includes('bonus')) {
          return appState.categories.find((c) => c.id === 'cat_gaji') || appState.categories.find((c) => c.type === 'income');
        }
        return appState.categories.find((c) => c.id === 'cat_freelance') || appState.categories.find((c) => c.type === 'income');
      }

      if (/makan|kopi|nasi|ayam|bakso|mie|jajan|sarapan|minum|boba|teh|warteg|cafe|resto/.test(t)) {
        return appState.categories.find((c) => c.id === 'cat_makan');
      }
      if (/ojol|gojek|grab|bensin|pertamax|parkir|tol|kereta|krl|mrt|transjakarta|bus/.test(t)) {
        return appState.categories.find((c) => c.id === 'cat_transport');
      }
      if (/kos|listrik|token|air|wifi|internet|pulsa|kuota|tagihan|cicilan/.test(t)) {
        return appState.categories.find((c) => c.id === 'cat_tagihan');
      }
      if (/beli|belanja|baju|sepatu|skincare|shopee|tokped|tokopedia|lazada|sabun/.test(t)) {
        return appState.categories.find((c) => c.id === 'cat_belanja');
      }
      if (/nonton|bioskop|game|topup|spotify|netflix|nongkrong|karaoke/.test(t)) {
        return appState.categories.find((c) => c.id === 'cat_hiburan');
      }
      return appState.categories.find((c) => c.type === 'expense') || appState.categories[0];
    }

    function parseSmartTransactions(rawText) {
      const parts = String(rawText || '')
        .split(/\b(?:dan|sama|terus|lalu|serta)\b|,|\n|;/i)
        .map((s) => s.trim())
        .filter(Boolean);

      const drafts = [];
      parts.forEach((part) => {
        const amount = parseIndonesianAmountTokens(part);
        if (amount <= 0) return;

        const isIncome = /\b(?:gaji|dapat|dapet|terima|masuk|bonus|cuan|transferan|freelance|fee)\b/i.test(part);
        const type = isIncome ? 'income' : 'expense';
        const cat = guessCategoryFromText(part, type) || appState.categories[0];

        let cleanNote = part
          .replace(/rp\.?\s*[\d.,]+\s*(?:rb|ribu|jt|juta|k)?/gi, '')
          .replace(/\b(?:seceng|goceng|ceban|goban|cepek|gopek|setengah\s*juta)\b/gi, '')
          .replace(/\b\d+(?:[.,]\d+)?\s*(?:rb|ribu|jt|juta|k)\b/gi, '')
          .replace(/\b\d{4,9}\b/g, '')
          .replace(/\s+/g, ' ')
          .trim();

        if (!cleanNote) cleanNote = cat?.name || 'Transaksi';
        cleanNote = cleanNote.charAt(0).toUpperCase() + cleanNote.slice(1);

        drafts.push({
          type,
          amount,
          categoryId: cat?.id || 'cat_makan',
          note: cleanNote,
          date: toISODate(new Date())
        });
      });

      return drafts;
    }

      if (uiState.activeTab === 'beranda') {

      } else if (uiState.activeTab === 'laporan') {

      let diffPct = 0;

      if (prevMetrics.totalExpense > 0) {

    function initLaporanChart() {
      const canvas = document.getElementById('cuan-flow-chart');
      if (!canvas || !window.Chart) return;
      if (activeChart) {
        activeChart.destroy();
        activeChart = null;
      }

      const metrics = getCycleMetrics(uiState.selectedCycleKey);
      const brandColor = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#127084';

      const labels = [];
      const incomeSeries = [];
      const expenseSeries = [];

      if (uiState.chartMode === 'weekly') {
        for (let w = 1; w <= 5; w++) {
          labels.push(`Minggu ${w}`);
          incomeSeries.push(0);
          expenseSeries.push(0);
        }
        metrics.txs.forEach((tx) => {
          const d = parseISODate(tx.date);
          const diffDays = Math.max(0, Math.floor((d - metrics.range.startDate) / 86400000));
          const wIdx = Math.min(4, Math.floor(diffDays / 7));
          if (tx.type === 'income') incomeSeries[wIdx] += Number(tx.amount) || 0;
          else expenseSeries[wIdx] += Number(tx.amount) || 0;
        });
      } else {
        const recentDays = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const iso = toISODate(d);
          recentDays.push(iso);
          labels.push(`${d.getDate()} ${MONTH_NAMES_SHORT[d.getMonth()]}`);
          incomeSeries.push(0);
          expenseSeries.push(0);
        }
        metrics.txs.forEach((tx) => {
          const idx = recentDays.indexOf(tx.date);
          if (idx !== -1) {
            if (tx.type === 'income') incomeSeries[idx] += Number(tx.amount) || 0;
            else expenseSeries[idx] += Number(tx.amount) || 0;
          }
        });
      }

      activeChart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Cuan Masuk', data: incomeSeries, backgroundColor: '#10B981', borderRadius: 6 },
            { label: 'Cuan Keluar', data: expenseSeries, backgroundColor: brandColor, borderRadius: 6 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { boxWidth: 10, font: { size: 11, family: 'Plus Jakarta Sans' } } } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 } } },
            y: { ticks: { font: { size: 10 }, callback: (v) => (v >= 1000 ? `${v / 1000}rb` : v) } }
          }
        }
      });
    }

    function submitManualTransaction(event) {
      event.preventDefault();
      const amount = parseRupiahInput(txModalState.amount);
      if (amount <= 0) {
        showToast('Masukkan nominal transaksi terlebih dahulu.', 'warning');
        return;
      }

      const cat = appState.categories.find((c) => c.id === txModalState.categoryId);
      const finalNote = (txModalState.note || '').trim() || cat?.name || 'Transaksi';

      if (txModalState.isEdit && txModalState.editId) {
        const idx = appState.transactions.findIndex((t) => t.id === txModalState.editId);
        if (idx !== -1) {
          appState.transactions[idx] = {
            ...appState.transactions[idx],
            type: txModalState.type,
            amount,
            categoryId: txModalState.categoryId,
            date: txModalState.date,
            note: finalNote,
            receiptImage: txModalState.receiptImage
          };
        }
        showToast('✅ Transaksi berhasil diperbarui!', 'success');
      } else {
        const newTx = {
          id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          type: txModalState.type,
          amount,
          categoryId: txModalState.categoryId,
          date: txModalState.date,
          note: finalNote,
          receiptImage: txModalState.receiptImage || ''
        };
        appState.transactions.unshift(newTx);
        if (newTx.type === 'expense') {
          checkCategoryBudgetAlert(newTx.categoryId, newTx.date);
        }
        showToast('✅ Transaksi berhasil dicatat!', 'success');
      }

      uiState.selectedCycleKey = findCycleKeyForDate(parseISODate(txModalState.date));
      saveState();
      closeModal();
      renderApp();
    }

    function startVoiceCapture() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('Browser ini belum mendukung rekaman suara langsung. Gunakan tab Catat AI.', 'warning');
        return;
      }
      if (activeVoiceRecognition) {
        try { activeVoiceRecognition.stop(); } catch (_) {}
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'id-ID';
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      txModalState.voiceListening = true;
      renderTransactionModal();

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        txModalState.voiceTranscript = transcript;
        renderTransactionModal();
      };

      recognition.onerror = () => {
        txModalState.voiceListening = false;
        renderTransactionModal();
      };

      recognition.onend = () => {
        txModalState.voiceListening = false;
        renderTransactionModal();
      };

      activeVoiceRecognition = recognition;
      try {
        recognition.start();
      } catch (_) {
        txModalState.voiceListening = false;
      }
    }

    function handleReceiptImageUpload(event, isScanMode) {
      const file = event.target.files?.[0];
      if (!file) return;

      if (isScanMode) {
        txModalState.scanLoading = true;
        renderTransactionModal();
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 720;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          txModalState.receiptImage = canvas.toDataURL('image/jpeg', 0.72);

          if (isScanMode) {
            setTimeout(() => {
              txModalState.scanLoading = false;
              if (!txModalState.note) txModalState.note = 'Pembayaran Struk / QRIS';
              renderTransactionModal();
            }, 800);
          } else {
            renderTransactionModal();
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function submitEmailAuthForm(event) {
      event.preventDefault();
      if (!supabaseClient) {
        showToast('Koneksi layanan cloud belum siap.', 'danger');
        return;
      }

      const email = (document.getElementById('auth-email')?.value || '').trim();
      const password = document.getElementById('auth-password')?.value || '';
      const name = (document.getElementById('auth-name')?.value || '').trim();

      try {
        if (authModalMode === 'forgot') {
          const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin
          });
          if (error) throw error;
          uiState.resetCooldownUntil = Date.now() + 60000;
          showToast('📩 Link reset sandi terkirim! Cek kotak masuk atau spam emailmu.', 'success');
          openAuthOrProfileModal();
          return;
        }

        if (authModalMode === 'signup') {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { full_name: name || 'Sobat Cuan' } }
          });
          if (error) throw error;
          if (name) appState.userName = name;
          saveState();
          if (data?.session) {
            closeModal();
            showToast('🎉 Akun berhasil dibuat & terhubung ke Cloud!', 'success');
          } else {
            showToast('Akun dibuat! Silakan masuk dengan email & sandimu.', 'info');
            authModalMode = 'login';
            openAuthOrProfileModal();
          }
          return;
        }

        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        closeModal();
        showToast('✅ Berhasil masuk! Data disinkronkan.', 'success');
      } catch (err) {
        const msg = String(err?.message || '');
        const secMatch = msg.match(/(\d+)\s*second/i);
        if (secMatch) {
          uiState.resetCooldownUntil = Date.now() + Number(secMatch[1]) * 1000;
          if (authModalMode === 'forgot') openAuthOrProfileModal();
        }
        showToast(translateAuthError(msg), 'danger');
      }
    }

    function stepSpotlightTour(delta) {
      const next = uiState.tourStep + delta;
      if (next >= TOUR_STEPS.length) {
        endSpotlightTour();
        return;
      }
      if (next < 0) return;
      uiState.tourStep = next;
      positionTourStep(next);
    }

    function positionTourStep(stepIndex) {
      const step = TOUR_STEPS[stepIndex];
      const target = document.getElementById(step.targetId);
      const highlight = document.getElementById('tour-highlight');
      const card = document.getElementById('tour-popup-card');
      if (!target || !highlight || !card) return;

      document.getElementById('tour-step-badge').textContent = `Langkah ${stepIndex + 1} dari ${TOUR_STEPS.length}`;
      document.getElementById('tour-step-title').textContent = step.title;
      document.getElementById('tour-step-desc').textContent = step.desc;
      document.getElementById('tour-prev-btn').style.visibility = stepIndex === 0 ? 'hidden' : 'visible';
      document.getElementById('tour-next-btn').textContent = stepIndex === TOUR_STEPS.length - 1 ? 'Selesai' : 'Lanjut';

      const rect = target.getBoundingClientRect();
      const pad = 6;
      const top = Math.max(8, rect.top - pad);
      const left = Math.max(8, rect.left - pad);
      const width = Math.min(window.innerWidth - 16, rect.width + pad * 2);
      const height = rect.height + pad * 2;

      highlight.style.top = `${top}px`;
      highlight.style.left = `${left}px`;
      highlight.style.width = `${width}px`;
      highlight.style.height = `${height}px`;

      const shell = document.getElementById('app-shell')?.getBoundingClientRect() || { left: 0, width: window.innerWidth };
      const cardWidth = Math.min(310, shell.width - 32);
      card.style.width = `${cardWidth}px`;
      const cardLeft = Math.round(shell.left + (shell.width - cardWidth) / 2);
      card.style.left = `${cardLeft}px`;

      const spaceBelow = window.innerHeight - (top + height);
      const cardHeightEst = 175;
      if (spaceBelow >= cardHeightEst + 16) {
        card.style.top = `${Math.min(window.innerHeight - cardHeightEst - 12, top + height + 12)}px`;
      } else {
        card.style.top = `${Math.max(12, top - cardHeightEst - 12)}px`;
      }
    }

      window.location.reload();
    }

    function showToast(message, variant = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success: 'bg-slate-900 text-white border-emerald-500/40',
        warning: 'bg-amber-950 text-amber-50 border-amber-400/40',
        danger: 'bg-rose-950 text-rose-50 border-rose-400/40',
        info: 'bg-slate-900 text-white border-slate-700'
      };

      const toast = document.createElement('div');
      toast.className = `${styles[variant] || styles.info} border px-4 py-3 rounded-2xl text-xs font-bold shadow-xl transition-all duration-300 opacity-0 -translate-y-2`;
      toast.textContent = message;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', '-translate-y-2');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function loadSampleDemoData() {

      const activeRange = getCycleRange(activeCycleKey);
      const prevCycleKey = getPreviousCycleKey(activeCycleKey);
      const prevRange = getCycleRange(prevCycleKey);

      const addDaysISO = (baseDate, offsetDays) => {
        const d = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate() + offsetDays);
        return toISODate(d);
      };

      const todayISO = toISODate(new Date());
      const sampleTxs = [
        {

          type: 'income',
          amount: 6500000,
          categoryId: 'cat_gaji',
          date: activeRange.startISO,
          note: 'Gaji Bulanan Utama',
          receiptImage: ''
        },
        {
          id: 'tx_demo_2_' + Date.now(),
          type: 'income',
          amount: 850000,
          categoryId: 'cat_freelance',
          date: todayISO,
          note: 'Project Desain & Cuan Sampingan',
          receiptImage: ''
        },
        {
          id: 'tx_demo_3_' + Date.now(),
          type: 'expense',
          amount: 1250000,
          categoryId: 'cat_tagihan',
          date: addDaysISO(activeRange.startDate, 1),
          note: 'Bayar Kos & Wi-Fi Bulanan',
          receiptImage: ''
        },
        {
          id: 'tx_demo_4_' + Date.now(),
          type: 'expense',
          amount: 48000,
          categoryId: 'cat_makan',
          date: todayISO,
          note: 'Kopi Susu Gula Aren & Makan Siang',
          receiptImage: ''
        },
        {
          id: 'tx_demo_5_' + Date.now(),
          type: 'expense',
          amount: 35000,
          categoryId: 'cat_transport',
          date: todayISO,
          note: 'Isi Bensin Pertamax Full',
          receiptImage: ''
        },
        {
          id: 'tx_demo_prev_1_' + Date.now(),
          type: 'income',
          amount: 6500000,
          categoryId: 'cat_gaji',
          date: prevRange.startISO,
          note: 'Gaji Siklus Sebelumnya',
          receiptImage: ''
        },
        {
          id: 'tx_demo_prev_2_' + Date.now(),
          type: 'expense',
          amount: 2150000,
          categoryId: 'cat_makan',
          date: addDaysISO(prevRange.startDate, 5),

      appState.transactions = [...sampleTxs, ...appState.transactions];
      uiState.selectedCycleKey = activeCycleKey;

    function exportTransactionsCSV() {
      const metrics = getCycleMetrics(uiState.selectedCycleKey);
      if (!metrics.txs.length) {
        showToast('Belum ada transaksi di siklus ini untuk diunduh.', 'warning');
        return;
      }

      const rows = [['Tanggal', 'Tipe', 'Kategori', 'Catatan', 'Nominal']];
      metrics.txs.forEach((tx) => {
        const cat = appState.categories.find((c) => c.id === tx.categoryId);
        const safeNote = `"${String(tx.note || '').replace(/"/g, '""')}"`;
        const safeCat = `"${String(cat?.name || 'Umum').replace(/"/g, '""')}"`;
        rows.push([
          tx.date,
          tx.type === 'income' ? 'Cuan Masuk' : 'Cuan Keluar',
          safeCat,
          safeNote,
          tx.amount
        ]);
      });

      const csvContent = 'data:text/csv;charset=utf-8,' + rows.map((r) => r.join(',')).join('\n');
      const link = document.createElement('a');
      link.setAttribute('href', encodeURI(csvContent));
      link.setAttribute('download', `Laporan_Cuan_${uiState.selectedCycleKey}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast('📥 File CSV laporan berhasil diunduh!', 'success');
    }

    function downloadBackupJSON() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(appState, null, 2));
      const link = document.createElement('a');
      link.setAttribute('href', dataStr);
      link.setAttribute('download', `Backup_Cuan_${toISODate(new Date())}.json`);
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast('💾 File backup JSON berhasil diunduh!', 'success');
    }

    function restoreBackupJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.transactions)) {
            throw new Error('Format file backup tidak valid.');
          }
          appState = { ...appState, ...parsed };
          applyTheme(appState.themeId);
          saveState();
          renderApp();
          showToast('📂 Data berhasil dipulihkan dari backup!', 'success');
        } catch (err) {
          showToast('Gagal memulihkan file JSON: ' + err.message, 'danger');
        }
      };
      reader.readAsText(file);
    }

    function toggleReminderSetting(enabled) {
      appState.reminderEnabled = enabled;
      saveState();
      if (enabled && 'Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      showToast(enabled ? '⏰ Pengingat harian diaktifkan' : 'Pengingat harian dimatikan', 'info');
    }

    /**
     * ============================================================================
     * 16. INISIALISASI GESTUR LONG-PRESS FAB (+), PWA & BOOTSTRAP APLIKASI
     * ============================================================================
     */
    function initFabLongPress() {
      const fab = document.getElementById('fab-add-btn');
      if (!fab) return;

      let pressTimer = null;
      let longPressTriggered = false;

      const startPress = (e) => {
        if (e.type === 'mousedown' && e.button !== 0) return;
        longPressTriggered = false;
        fab.classList.add('pressing');

        pressTimer = setTimeout(() => {
          longPressTriggered = true;
          fab.classList.remove('pressing');
          if (navigator.vibrate) navigator.vibrate(40);
          openAddTransactionModal('voice');
        }, 420);
      };

      const endPress = (e) => {
        clearTimeout(pressTimer);
        fab.classList.remove('pressing');
        if (!longPressTriggered && e.type !== 'mouseleave' && e.type !== 'touchcancel') {
          openAddTransactionModal('manual');
        }
      };

      fab.addEventListener('touchstart', startPress, { passive: true });
      fab.addEventListener('touchend', endPress);
      fab.addEventListener('touchcancel', endPress);
      fab.addEventListener('mousedown', startPress);
      fab.addEventListener('mouseup', endPress);
      fab.addEventListener('mouseleave', () => {
        clearTimeout(pressTimer);
        fab.classList.remove('pressing');
      });
    }

    function initPwaAndServiceWorker() {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          swRegistration = reg;
          if (reg.waiting) {
            document.getElementById('update-banner')?.classList.remove('hidden');
          }
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                document.getElementById('update-banner')?.classList.remove('hidden');
              }
            });
          });
        }).catch((err) => console.warn('SW registration skipped:', err));
      }
    }

    async function bootCuanApp() {
      loadLocalState();
      renderApp();
      initFabLongPress();
      initPwaAndServiceWorker();
      startReminderScheduler();
      await initSupabase();

      if (!localStorage.getItem(TOUR_SEEN_KEY)) {
        setTimeout(() => startSpotlightTour(), 650);
      }
    }

    document.addEventListener('DOMContentLoaded', bootCuanApp);
  </script>
