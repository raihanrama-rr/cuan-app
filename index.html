    .no-scrollbar::-webkit-scrollbar { display: none; }

    @keyframes backdropFadeIn {
      from { opacity: 0; }

    }

    @keyframes sheetSlideUp {
      from { transform: translateY(28px); opacity: 0.92; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-backdrop-enter {

    }

    .modal-sheet-enter {

    }

    @keyframes scanLaser {
      0% { top: 8%; }
      50% { top: 88%; }
      100% { top: 8%; }
    }
    .scan-laser-line {
      position: absolute;
      left: 6%;
      right: 6%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #10B981, #FFFFFF, #10B981, transparent);

      border-radius: 999px;

    @keyframes pulseMic {

    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getCurrentMonthKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function shiftMonthKey(monthKey, delta) {
      const [y, m] = monthKey.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function formatMonthLabel(monthKey) {
      const [y, m] = monthKey.split('-').map(Number);
      const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      return `${months[(m - 1 + 12) % 12]} ${y}`;
    }

    function formatShortDate(isoStr) {
      if (!isoStr) return '';
      const [y, m, d] = isoStr.split('-').map(Number);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      return `${d} ${months[m - 1]} ${y}`;
    }

    function formatRupiah(num) {
      const n = Math.round(Number(num) || 0);
      const sign = n < 0 ? '-' : '';
      return sign + 'Rp ' + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatThousands(val) {
      const digits = String(val || '').replace(/\D/g, '');
      if (!digits) return '';
      return digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function parseRupiahDigits(val) {
      return Number(String(val || '').replace(/\D/g, '')) || 0;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getPaydayForMonth(monthKey) {
      const custom = appState.monthlyPaydays && appState.monthlyPaydays[monthKey];
      const day = Number(custom || appState.defaultPayday || 25);
      const [y, m] = monthKey.split('-').map(Number);
      const maxDay = new Date(y, m, 0).getDate();
      return Math.min(Math.max(1, day), maxDay);
    }

    function getActiveCycleStartMonthKey() {
      const today = new Date();
      const thisMonthKey = getCurrentMonthKey();
      const thisMonthPayday = getPaydayForMonth(thisMonthKey);
      if (today.getDate() >= thisMonthPayday) {
        return thisMonthKey;
      }
      return shiftMonthKey(thisMonthKey, -1);
    }

    function getCycleRange(startMonthKey) {
      const key = startMonthKey || getActiveCycleStartMonthKey();
      const [y, m] = key.split('-').map(Number);
      const startDay = getPaydayForMonth(key);
      const startDate = new Date(y, m - 1, startDay);

      const nextKey = shiftMonthKey(key, 1);
      const [ny, nm] = nextKey.split('-').map(Number);
      const nextPayday = getPaydayForMonth(nextKey);
      const endDate = new Date(ny, nm - 1, nextPayday - 1);

      const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      return {
        monthKey: key,
        startDay,
        startISO: toISO(startDate),
        endISO: toISO(endDate),
        label: `${formatShortDate(toISO(startDate))} – ${formatShortDate(toISO(endDate))}`
      };
    }

    function getCycleOptions() {
      const activeKey = getActiveCycleStartMonthKey();
      return [
        shiftMonthKey(activeKey, -2),
        shiftMonthKey(activeKey, -1),
        activeKey,
        shiftMonthKey(activeKey, 1)
      ].map((k) => {
        const range = getCycleRange(k);
        const tag = k === activeKey ? ' (Siklus Berjalan)' : '';
        return { key: k, text: `${formatMonthLabel(k)}${tag} • ${range.label}` };
      });
    }

    function getCycleTransactions(cycleKey) {
      const range = getCycleRange(cycleKey);
      return appState.transactions.filter((tx) => tx.date >= range.startISO && tx.date <= range.endISO);
    }

    function applyTheme(themeKey) {

      document.documentElement.style.setProperty('--brand', t.brand);
      document.documentElement.style.setProperty('--brand-dark', t.dark);
      document.documentElement.style.setProperty('--brand-tint', t.tint);

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appState = {
            ...appState,
            ...parsed,
            categories: Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : appState.categories,
            transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
            notifications: Array.isArray(parsed.notifications) ? parsed.notifications : [],
            seenAnnouncements: Array.isArray(parsed.seenAnnouncements) ? parsed.seenAnnouncements : [],
            monthlyPaydays: parsed.monthlyPaydays || {}
          };

      } catch (e) {
        console.warn('Gagal membaca localStorage:', e);
      }
      if (!appState.selectedCycleKey) {
        appState.selectedCycleKey = getActiveCycleStartMonthKey();
      }
      mergeDeveloperAnnouncements();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn('Storage penuh:', e);
      }
      if (currentUser && supabaseClient) {

          syncToSupabase();
        }, 800);
      }

    function mergeDeveloperAnnouncements() {
      let added = false;
      DEVELOPER_ANNOUNCEMENTS.forEach((ann) => {
        if (!appState.seenAnnouncements.includes(ann.id)) {
          appState.seenAnnouncements.push(ann.id);
          appState.notifications.unshift({
            id: ann.id,
            title: ann.title,
            message: ann.message,
            time: ann.time,
            read: false,
            type: 'info'
          });
          added = true;
        }
      });
      if (added) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        } catch (_) {}
      }
    }

    function extractGoogleAvatar(user) {
      if (!user) return '';
      const meta = user.user_metadata || {};
      if (meta.avatar_url) return meta.avatar_url;
      if (meta.picture) return meta.picture;
      if (Array.isArray(user.identities)) {
        for (const idn of user.identities) {
          const d = idn.identity_data || {};
          if (d.avatar_url) return d.avatar_url;
          if (d.picture) return d.picture;
        }
      }
      return '';
    }

    function extractUserDisplayName(user) {
      if (!user) return appState.userName || 'Sobat Cuan';
      const meta = user.user_metadata || {};
      return meta.full_name || meta.name || (user.email ? user.email.split('@')[0] : 'Sobat Cuan');
    }

    async function initSupabaseSession() {
      if (!supabaseClient) return;

      if (window.location.hash && window.location.hash.includes('type=recovery')) {
        setTimeout(() => openAuthModal('recovery'), 250);
      }

      const params = new URLSearchParams(window.location.search);
      const oauthErr = params.get('error_description') || params.get('error');
      if (oauthErr) {
        showToast('Login Google gagal: ' + decodeURIComponent(oauthErr.replace(/\+/g, ' ')), 'error');
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      try {
        const { data } = await supabaseClient.auth.getSession();
        if (data && data.session && data.session.user) {
          await handleAuthenticatedUser(data.session.user);
        }
      } catch (e) {
        console.warn('Session check error:', e);
      }

      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          openAuthModal('recovery');
          return;
        }
        if ((event === 'SIGNED_IN' || event === 'USER_UPDATED') && session && session.user) {
          await handleAuthenticatedUser(session.user);
        }
        if (event === 'SIGNED_OUT') {
          currentUser = null;
          appState.userEmail = '';
          appState.userAvatar = '';
          appState.userName = 'Sobat Cuan';
          saveState();
          renderApp();
        }
      });
    }

    async function handleAuthenticatedUser(user) {
      currentUser = user;
      try {
        const { data: fresh } = await supabaseClient.auth.getUser();
        if (fresh && fresh.user) {
          currentUser = fresh.user;
        }
      } catch (_) {}

      const avatar = extractGoogleAvatar(currentUser);
      const displayName = extractUserDisplayName(currentUser);
      appState.userEmail = currentUser.email || '';
      if (avatar) appState.userAvatar = avatar;
      if (displayName) appState.userName = displayName;

      await loadFromSupabase();
      if (avatar) appState.userAvatar = avatar;
      if (displayName) appState.userName = displayName;
      saveState();
      renderApp();
    }

    async function loadFromSupabase() {
      if (!supabaseClient || !currentUser) return;
      isSyncing = true;
      renderApp();
      try {
        const { data, error } = await supabaseClient
          .from('cuan_user_data')
          .select('payload')
          .eq('user_id', currentUser.id)
          .maybeSingle();

        if (!error && data && data.payload) {
          const p = data.payload;
          if (Array.isArray(p.categories) && p.categories.length) appState.categories = p.categories;
          if (Array.isArray(p.transactions)) appState.transactions = p.transactions;
          if (p.defaultPayday) appState.defaultPayday = p.defaultPayday;
          if (p.monthlyPaydays) appState.monthlyPaydays = p.monthlyPaydays;
          if (p.theme) {
            appState.theme = p.theme;
            applyTheme(p.theme);
          }
          if (typeof p.reminderEnabled === 'boolean') appState.reminderEnabled = p.reminderEnabled;
          if (p.reminderTime) appState.reminderTime = p.reminderTime;
          if (p.userAvatar && !appState.userAvatar) appState.userAvatar = p.userAvatar;
          mergeDeveloperAnnouncements();
        } else if (!error && !data) {
          await syncToSupabase();
        }
      } catch (e) {
        console.warn('Load cloud error:', e);
      } finally {
        isSyncing = false;
      }
    }

    async function syncToSupabase() {
      if (!supabaseClient || !currentUser) return;
      isSyncing = true;
      try {
        const payload = {
          userName: appState.userName,
          userAvatar: appState.userAvatar,
          theme: appState.theme,
          defaultPayday: appState.defaultPayday,
          monthlyPaydays: appState.monthlyPaydays,
          categories: appState.categories,
          transactions: appState.transactions,
          reminderEnabled: appState.reminderEnabled,
          reminderTime: appState.reminderTime
        };
        await supabaseClient.from('cuan_user_data').upsert({
          user_id: currentUser.id,
          payload,
          updated_at: new Date().toISOString()
        });
      } catch (e) {
        console.warn('Sync cloud error:', e);
      } finally {
        isSyncing = false;
      }
    }

    function checkCategoryBudgetAlert(categoryId) {
      const cat = appState.categories.find((c) => c.id === categoryId);
      if (!cat || cat.type !== 'expense' || !cat.budgetLimit || cat.budgetLimit <= 0) return;

      const cycleTxs = getCycleTransactions(appState.selectedCycleKey);
      const spent = cycleTxs
        .filter((t) => t.type === 'expense' && t.categoryId === categoryId)
        .reduce((sum, t) => sum + Number(t.amount || 0), 0);

      const pct = Math.round((spent / cat.budgetLimit) * 100);
      if (pct >= 100) {
        const msg = `Pos "${cat.name}" sudah mencapai ${pct}% (${formatRupiah(spent)} / ${formatRupiah(cat.budgetLimit)})!`;
        showToast('🚨 Limit Jebol! ' + msg, 'error');
        addNotification('🚨 Limit Pos Jebol: ' + cat.name, msg, 'error');
      } else if (pct >= 80) {
        const sisa = Math.max(0, cat.budgetLimit - spent);
        const msg = `Pos "${cat.name}" terpakai ${pct}%. Sisa limit: ${formatRupiah(sisa)}.`;
        showToast('⚠️ Lampu Kuning! ' + msg, 'warning');
        addNotification('⚠️ Lampu Kuning: ' + cat.name, msg, 'warning');
      }
    }

    /*************************************************************************
     * 7. PARSER BAHASA ALAMI (CATAT AI & SUARA)
     *************************************************************************/
    function parseNaturalLanguageTransactions(rawText) {
      const text = String(rawText || '').trim();
      if (!text) return [];

      let normalized = text.toLowerCase()
        .replace(/setengah\s+juta/g, '500000')
        .replace(/(\d+(?:[.,]\d+)?)\s*(?:jt|juta)/g, (_, n) => String(Math.round(parseFloat(n.replace(',', '.')) * 1000000)))
        .replace(/(\d+(?:[.,]\d+)?)\s*(?:rb|ribu|k)\b/g, (_, n) => String(Math.round(parseFloat(n.replace(',', '.')) * 1000)))
        .replace(/\bseceng\b/g, '1000')
        .replace(/\bgoceng\b/g, '5000')
        .replace(/\bceban\b/g, '10000')
        .replace(/\bgoban\b/g, '50000')
        .replace(/\bcepek\b/g, '100000')
        .replace(/\bgopek\b/g, '500000');

      const wordNums = {
        satu: 1, dua: 2, tiga: 3, empat: 4, lima: 5,
        enam: 6, tujuh: 7, delapan: 8, sembilan: 9, sepuluh: 10,
        sebelas: 11, 'dua belas': 12, 'lima belas': 15, 'dua puluh': 20,
        'dua puluh lima': 25, 'tiga puluh': 30, 'empat puluh': 40,
        'lima puluh': 50, 'tujuh puluh lima': 75, seratus: 100
      };
      Object.entries(wordNums).forEach(([w, num]) => {
        const re = new RegExp(`\\b${w}\\s+ribu\\b`, 'g');
        normalized = normalized.replace(re, String(num * 1000));
      });

      const chunks = normalized
        .split(/(?:,|\bdan\b|\bsama\b|\bterus\b|\blalu\b|\n)/i)
        .map((s) => s.trim())
        .filter(Boolean);

      const results = [];
      chunks.forEach((chunk) => {
        const numMatch = chunk.match(/(\d[\d.]*)/);
        if (!numMatch) return;
        const amount = parseRupiahDigits(numMatch[1]);
        if (amount <= 0) return;

        let note = chunk
          .replace(numMatch[0], '')
          .replace(/\b(?:rp|rupiah|beli|bayar|buat|untuk|habis|keluar|dapat|dapet)\b/gi, '')
          .replace(/\s+/g, ' ')
          .trim();
        note = note ? note.charAt(0).toUpperCase() + note.slice(1) : 'Transaksi Cepat';

        const isIncome = /\b(?:gaji|gajian|bonus|thr|transfer masuk|pemasukan|freelance|fee|untung|cuan masuk|refund)\b/i.test(chunk);
        const type = isIncome ? 'income' : 'expense';
        const categoryId = guessCategoryFromText(chunk, type);

        results.push({
          type,
          amount,
          categoryId,
          date: getTodayISO(),
          note
        });
      });

      return results;
    }

    function guessCategoryFromText(text, type) {
      const t = text.toLowerCase();
      if (type === 'income') {
        if (/freelance|project|proyek|sampingan|komisi/.test(t)) {
          return appState.categories.find((c) => c.id === 'cat_freelance')?.id || appState.categories.find((c) => c.type === 'income')?.id;
        }
        return appState.categories.find((c) => c.id === 'cat_gaji')?.id || appState.categories.find((c) => c.type === 'income')?.id;
      }

      if (/kopi|es|makan|nasi|mie|ayam|bakso|geprek|sarapan|siang|malam|jajan|boba|teh|warteg|cafe|resto/.test(t)) {
        return appState.categories.find((c) => c.id === 'cat_makan')?.id || getDefaultExpenseCatId();
      }
      if (/ojol|gojek|grab|maxim|bensin|pertalite|pertamax|parkir|tol|kereta|krl|mrt|bus|transjakarta/.test(t)) {
        return appState.categories.find((c) => c.id === 'cat_transport')?.id || getDefaultExpenseCatId();
      }
      if (/belanja|shopee|tokped|tokopedia|lazada|tiktok|baju|skincare|indomaret|alfamart|supermarket/.test(t)) {
        return appState.categories.find((c) => c.id === 'cat_belanja')?.id || getDefaultExpenseCatId();
      }
      if (/listrik|pln|air|pdam|wifi|internet|kuota|pulsa|cicilan|kos|kontrakan|tagihan/.test(t)) {
        return appState.categories.find((c) => c.id === 'cat_tagihan')?.id || getDefaultExpenseCatId();
      }
      if (/bioskop|nonton|netflix|spotify|game|karaoke|nongkrong|konser/.test(t)) {
        return appState.categories.find((c) => c.id === 'cat_hiburan')?.id || getDefaultExpenseCatId();
      }
      return getDefaultExpenseCatId();
    }

    function getDefaultExpenseCatId() {
      return appState.categories.find((c) => c.type === 'expense')?.id || appState.categories[0]?.id || 'cat_makan';
    }

    /*************************************************************************

     *************************************************************************/
    function compressImageFile(file, maxWidth = 720, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = img.width > maxWidth ? maxWidth / img.width : 1;
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderTransaksiView() {
      const cycleRange = getCycleRange(appState.selectedCycleKey);
      let txs = getCycleTransactions(appState.selectedCycleKey);

      if (txTypeFilter !== 'all') {
        txs = txs.filter((t) => t.type === txTypeFilter);
      }
      if (txSearchQuery.trim()) {
        const q = txSearchQuery.toLowerCase();
        txs = txs.filter((t) => {
          const cat = appState.categories.find((c) => c.id === t.categoryId);
          return (t.note || '').toLowerCase().includes(q) || (cat?.name || '').toLowerCase().includes(q);
        });
      }

      txs.sort((a, b) => (b.date + (b.id || '')).localeCompare(a.date + (a.id || '')));

      return `

    /*************************************************************************

      const cycleRange = getCycleRange(appState.selectedCycleKey);
      const txs = getCycleTransactions(appState.selectedCycleKey);
      const prevCycleKey = shiftMonthKey(cycleRange.monthKey, -1);
      const prevTxs = getCycleTransactions(prevCycleKey);

      const thisExpense = txs.filter((t) => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);
      const prevExpense = prevTxs.filter((t) => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);

      let vibeText = 'Belum ada pembanding siklus sebelumnya';
      let vibeBadge = 'Netral';
      let vibeColor = 'bg-slate-100 text-slate-700';

      if (prevExpense > 0) {
        const diffPct = Math.floor(((thisExpense - prevExpense) / prevExpense) * 100);
        if (diffPct <= 0) {
          vibeBadge = `${Math.abs(diffPct)}% Lebih Hemat`;
          vibeText = `Mantap! Pengeluaranmu turun ${formatRupiah(prevExpense - thisExpense)} dibanding siklus lalu.`;
          vibeColor = 'bg-emerald-100 text-emerald-700';
        } else {
          vibeBadge = `${diffPct}% Lebih Boros`;
          vibeText = `Waspada! Pengeluaranmu naik ${formatRupiah(thisExpense - prevExpense)} dibanding siklus lalu.`;
          vibeColor = 'bg-rose-100 text-rose-700';
        }

      const catTotals = {};
      txs.filter((t) => t.type === 'expense').forEach((t) => {
        catTotals[t.categoryId] = (catTotals[t.categoryId] || 0) + Number(t.amount || 0);
      });
      const sortedCats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
      const topCatEntry = sortedCats[0];
      const topCat = topCatEntry ? appState.categories.find((c) => c.id === topCatEntry[0]) : null;
      const topCatPct = topCatEntry && thisExpense > 0 ? Math.round((topCatEntry[1] / thisExpense) * 100) : 0;

      const monthNum = Number(cycleRange.monthKey.split('-')[1] || 1);
      const itemSets = [
        [
          { name: 'Es Kopi Susu Gula Aren', price: 22000 },
          { name: 'Tiket Nonton Bioskop', price: 50000 },
          { name: 'Emas Antam 0.5 Gram', price: 780000 }

          { name: 'Langganan Musik Bulanan', price: 55000 },
          { name: 'Sepatu Sneakers Lokal', price: 450000 }

        [
          { name: 'Matcha Latte Kekinian', price: 28000 },
          { name: 'Isi Full Tank Bensin Motor', price: 45000 },
          { name: 'Reksadana Pasar Uang', price: 500000 }
        ]
      ];
      const activeItems = itemSets[monthNum % itemSets.length];

      return `

                  class="px-2.5 py-1 rounded-lg text-[11px] font-bold ${reportChartMode === 'daily' ? 'bg-white brand-text shadow-xs' : 'text-slate-500'}">Per Hari</button>
                <button type="button" onclick="reportChartMode='weekly'; renderApp()"

              <canvas id="cashflow-chart"></canvas>

              <span class="px-2.5 py-1 rounded-full text-[11px] font-extrabold ${vibeColor}">${vibeBadge}</span>
            </div>

    function initOrUpdateReportChart() {
      const canvas = document.getElementById('cashflow-chart');
      if (!canvas || !window.Chart) return;

      const txs = getCycleTransactions(appState.selectedCycleKey);
      const labels = [];
      const incomeSeries = [];
      const expenseSeries = [];

      if (reportChartMode === 'daily') {
        const grouped = {};
        txs.forEach((t) => {
          if (!grouped[t.date]) grouped[t.date] = { income: 0, expense: 0 };
          grouped[t.date][t.type] += Number(t.amount || 0);
        });
        const sortedDates = Object.keys(grouped).sort().slice(-7);
        if (sortedDates.length === 0) {
          labels.push('Hari Ini');
          incomeSeries.push(0);
          expenseSeries.push(0);
        } else {
          sortedDates.forEach((d) => {
            labels.push(d.slice(8, 10) + '/' + d.slice(5, 7));
            incomeSeries.push(grouped[d].income);
            expenseSeries.push(grouped[d].expense);
          });
        }
      } else {
        const weeks = [
          { label: 'Minggu 1', income: 0, expense: 0 },
          { label: 'Minggu 2', income: 0, expense: 0 },
          { label: 'Minggu 3', income: 0, expense: 0 },
          { label: 'Minggu 4+', income: 0, expense: 0 }
        ];
        const range = getCycleRange(appState.selectedCycleKey);
        const startMs = new Date(range.startISO).getTime();
        txs.forEach((t) => {
          const diffDays = Math.max(0, Math.floor((new Date(t.date).getTime() - startMs) / 86400000));
          const idx = Math.min(3, Math.floor(diffDays / 7));
          weeks[idx][t.type] += Number(t.amount || 0);
        });
        weeks.forEach((w) => {
          labels.push(w.label);
          incomeSeries.push(w.income);
          expenseSeries.push(w.expense);
        });
      }

      if (reportChartInstance) {
        reportChartInstance.destroy();
      }

      const brandColor = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#127084';
      reportChartInstance = new Chart(canvas, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Cuan Masuk', data: incomeSeries, backgroundColor: '#10B981', borderRadius: 6 },
            { label: 'Cuan Keluar', data: expenseSeries, backgroundColor: brandColor, borderRadius: 6 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
          scales: {
            y: { beginAtZero: true, ticks: { font: { size: 10 } } },
            x: { ticks: { font: { size: 10 } } }
          }
        }
      });
    }

    function openModalShell(type, innerHTML) {
      const backdrop = document.getElementById('modal-backdrop');
      const sheet = document.getElementById('modal-sheet');
      const inner = document.getElementById('modal-inner');
      if (!backdrop || !sheet || !inner) return;

      const wasHidden = backdrop.classList.contains('hidden');
      currentModalType = type;
      inner.innerHTML = innerHTML;

      if (wasHidden) {
        backdrop.classList.remove('hidden');
        backdrop.classList.remove('modal-backdrop-enter');
        sheet.classList.remove('modal-sheet-enter');
        sheet.classList.add('pointer-events-none');
        void sheet.offsetWidth;
        backdrop.classList.add('modal-backdrop-enter');
        sheet.classList.add('modal-sheet-enter');
        setTimeout(() => {
          sheet.classList.remove('pointer-events-none');
        }, 250);
      }
    }

    function updateModalInner(innerHTML) {

      if (inner) inner.innerHTML = innerHTML;

    function saveManualTransaction(e) {
      e.preventDefault();
      const amount = parseRupiahDigits(txDraft.amount);
      if (amount <= 0) {
        showToast('Masukkan nominal transaksi terlebih dahulu', 'warning');
        return;
      }

      if (editingTxId) {
        const idx = appState.transactions.findIndex((t) => t.id === editingTxId);
        if (idx !== -1) {
          appState.transactions[idx] = {
            ...appState.transactions[idx],
            type: txDraft.type,
            amount,
            categoryId: txDraft.categoryId,
            date: txDraft.date || getTodayISO(),
            note: txDraft.note.trim(),
            receiptImage: txDraft.receiptImage
          };
        }
        saveState();
        closeModal();
        renderApp();
        showToast('Transaksi diperbarui!', 'success');
      } else {
        appState.transactions.push({
          id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          type: txDraft.type,
          amount,
          categoryId: txDraft.categoryId,
          date: txDraft.date || getTodayISO(),
          note: txDraft.note.trim(),
          receiptImage: txDraft.receiptImage
        });
        saveState();
        closeModal();
        renderApp();
        showToast('Transaksi berhasil dicatat!', 'success');
        if (txDraft.type === 'expense') {
          checkCategoryBudgetAlert(txDraft.categoryId);
        }
      }
    }

    function saveParsedBatch(source) {
      const items = source === 'voice' ? voiceParsedItems : aiParsedItems;
      if (!items || !items.length) return;
      const checkedCats = new Set();

      items.forEach((it, i) => {
        if (it.amount > 0) {
          appState.transactions.push({
            id: 'tx_' + (Date.now() + i) + '_' + Math.random().toString(36).slice(2, 6),
            type: it.type,
            amount: it.amount,
            categoryId: it.categoryId,
            date: it.date || getTodayISO(),
            note: it.note || 'Transaksi Cepat',
            receiptImage: ''
          });
          if (it.type === 'expense') checkedCats.add(it.categoryId);
        }
      });

      saveState();
      closeModal();
      renderApp();
      showToast(`${items.length} transaksi berhasil disimpan!`, 'success');
      checkedCats.forEach((cid) => checkCategoryBudgetAlert(cid));
    }

    async function handleManualReceiptUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        txDraft.receiptImage = await compressImageFile(file);
        updateModalInner(buildTransactionModalHTML());
        showToast('Foto struk terlampir', 'success');
      } catch (_) {
        showToast('Gagal memproses gambar struk', 'error');
      }
    }

    async function handleReceiptScanUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      stopScanCameraStream();
      try {
        const compressed = await compressImageFile(file);
        scanPreviewData = {
          image: compressed,
          scanning: true,
          note: 'Pembayaran QRIS / Struk Belanja',
          amount: 45000,
          categoryId: getDefaultExpenseCatId()
        };
        updateModalInner(buildTransactionModalHTML());

        setTimeout(() => {
          if (!scanPreviewData) return;
          scanPreviewData.scanning = false;
          updateModalInner(buildTransactionModalHTML());
        }, 1100);
      } catch (_) {
        showToast('Gagal memuat foto struk', 'error');
      }
    }

    async function startScanCamera() {
      stopScanCameraStream();
      cameraErrorMsg = '';

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        const nativeInput = document.getElementById('scan-native-camera-input');
        if (nativeInput) nativeInput.click();
        return;
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        isCameraActive = true;
        updateModalInner(buildTransactionModalHTML());

        const videoEl = document.getElementById('scan-video-preview');
        if (videoEl) {
          videoEl.srcObject = cameraStream;
          await videoEl.play().catch(() => {});
        }
      } catch (_) {
        isCameraActive = false;
        cameraErrorMsg = 'Izin kamera browser dibatasi. Gunakan tombol Kamera HP di samping.';
        updateModalInner(buildTransactionModalHTML());
      }
    }

    function stopScanCameraStream() {
      isCameraActive = false;
      if (cameraStream) {
        try {
          cameraStream.getTracks().forEach((track) => track.stop());
        } catch (_) {}
        cameraStream = null;
      }
    }

    function captureFromScanCamera() {
      const videoEl = document.getElementById('scan-video-preview');
      if (!videoEl || !videoEl.videoWidth) {
        showToast('Kamera belum siap, coba sesaat lagi', 'warning');
        return;
      }

      const maxWidth = 720;
      const scale = videoEl.videoWidth > maxWidth ? maxWidth / videoEl.videoWidth : 1;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(videoEl.videoWidth * scale);
      canvas.height = Math.round(videoEl.videoHeight * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.78);

      stopScanCameraStream();
      scanPreviewData = {
        image: dataUrl,
        scanning: true,
        note: 'Foto Struk Kamera',
        amount: 45000,
        categoryId: getDefaultExpenseCatId()
      };
      updateModalInner(buildTransactionModalHTML());

      setTimeout(() => {
        if (!scanPreviewData) return;
        scanPreviewData.scanning = false;
        updateModalInner(buildTransactionModalHTML());
      }, 1100);
    }

    function saveScannedTransaction() {
      if (!scanPreviewData || scanPreviewData.amount <= 0) {
        showToast('Nominal struk tidak valid', 'warning');
        return;
      }
      const catId = scanPreviewData.categoryId;
      appState.transactions.push({
        id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        type: 'expense',
        amount: scanPreviewData.amount,
        categoryId: catId,
        date: getTodayISO(),
        note: scanPreviewData.note || 'Struk Belanja',
        receiptImage: scanPreviewData.image

      saveState();
      closeModal();
      renderApp();
      showToast('Transaksi & bukti struk tersimpan!', 'success');
      checkCategoryBudgetAlert(catId);
    }

    async function deleteTransaction(txId) {
      const ok = await showConfirmDialog('Hapus Transaksi?', 'Catatan transaksi ini akan dihapus permanen dari siklusmu.');
      if (!ok) return;
      appState.transactions = appState.transactions.filter((t) => t.id !== txId);
      saveState();
      renderApp();
      showToast('Transaksi dihapus', 'info');
    }

    function startVoiceRecognition() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        showToast('Browser tidak mendukung suara langsung. Gunakan Simulasi Suara.', 'warning');
        return;
      }
      try {
        speechRecognition = new SpeechRec();
        speechRecognition.lang = 'id-ID';
        speechRecognition.continuous = false;
        speechRecognition.interimResults = true;
        isRecordingVoice = true;
        if (currentModalType === 'transaction' && txModalTab === 'voice') {
          updateModalInner(buildTransactionModalHTML());
        }

        speechRecognition.onresult = (event) => {
          let finalTxt = '';
          for (let i = 0; i < event.results.length; i++) {
            finalTxt += event.results[i][0].transcript;
          }
          voiceTranscript = finalTxt;
          voiceParsedItems = parseNaturalLanguageTransactions(finalTxt);
          if (currentModalType === 'transaction' && txModalTab === 'voice') {
            updateModalInner(buildTransactionModalHTML());
          }
        };

        speechRecognition.onerror = () => {
          isRecordingVoice = false;
          if (currentModalType === 'transaction' && txModalTab === 'voice') {
            updateModalInner(buildTransactionModalHTML());
          }
        };

        speechRecognition.onend = () => {
          isRecordingVoice = false;
          if (currentModalType === 'transaction' && txModalTab === 'voice') {
            updateModalInner(buildTransactionModalHTML());
          }
        };

        speechRecognition.start();
      } catch (_) {
        isRecordingVoice = false;
      }
    }

    function stopVoiceRecognition() {
      isRecordingVoice = false;
      if (speechRecognition) {
        try { speechRecognition.stop(); } catch (_) {}
        speechRecognition = null;
      }
    }

    function toggleVoiceRecording() {
      if (isRecordingVoice) {
        stopVoiceRecognition();
        updateModalInner(buildTransactionModalHTML());
      } else {
        startVoiceRecognition();
      }
    }

    function simulateVoiceInput() {
      voiceTranscript = 'Kopi susu dua puluh dua ribu dan naik ojol ceban';
      voiceParsedItems = parseNaturalLanguageTransactions(voiceTranscript);
      updateModalInner(buildTransactionModalHTML());
    }

    function saveCategoryForm(e) {
      e.preventDefault();
      const name = catFormName.trim();
      if (!name) {
        showToast('Nama kategori wajib diisi', 'warning');
        return;
      }
      const limit = catModalTab === 'expense' ? parseRupiahDigits(catFormLimit) : 0;

      if (editingCategoryId) {
        const idx = appState.categories.findIndex((c) => c.id === editingCategoryId);
        if (idx !== -1) {
          appState.categories[idx] = {
            ...appState.categories[idx],
            name,
            icon: catFormIcon,
            budgetLimit: limit
          };
        }
        editingCategoryId = null;
        catFormName = '';
        catFormLimit = '';
        saveState();
        updateModalInner(buildCategoryModalHTML());
        renderApp();
        showToast('Kategori berhasil diperbarui!', 'success');
      } else {
        appState.categories.push({
          id: 'cat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          name,
          icon: catFormIcon,
          type: catModalTab,
          budgetLimit: limit
        });
        saveState();
        closeModal();
        renderApp();
        showToast(`Kategori "${name}" berhasil ditambahkan!`, 'success');
      }
    }

    async function deleteCategory(catId) {
      const target = appState.categories.find((c) => c.id === catId);
      if (!target) return;
      const sameTypeCats = appState.categories.filter((c) => c.type === target.type);
      if (sameTypeCats.length <= 1) {
        showToast('Minimal harus tersisa 1 kategori pada tipe ini', 'warning');
        return;
      }

      const ok = await showConfirmDialog(
        `Hapus "${target.name}"?`,
        'Transaksi lama pada kategori ini akan dipindahkan otomatis ke kategori lain yang sejenis.'
      );
      if (!ok) return;

      const fallback = sameTypeCats.find((c) => c.id !== catId);
      if (fallback) {
        appState.transactions.forEach((tx) => {
          if (tx.categoryId === catId) tx.categoryId = fallback.id;
        });
      }
      appState.categories = appState.categories.filter((c) => c.id !== catId);
      if (editingCategoryId === catId) editingCategoryId = null;

      saveState();
      updateModalInner(buildCategoryModalHTML());
      renderApp();
      showToast('Kategori dihapus', 'info');
    }

    function calculateItemizedSplitBreakdown() {
      const totals = {};
      splitPeopleList.forEach((p) => { totals[p] = 0; });

      splitItems.forEach((item) => {
        const price = Number(item.price || 0);
        if (price <= 0) return;
        if (item.assignedTo === 'Bagi Rata') {
          const share = price / Math.max(1, splitPeopleList.length);
          splitPeopleList.forEach((p) => { totals[p] += share; });
        } else if (totals[item.assignedTo] !== undefined) {
          totals[item.assignedTo] += price;
        }
      });

      const mult = 1 + (Number(splitItemTaxPercent || 0) / 100);
      Object.keys(totals).forEach((p) => {
        totals[p] = Math.round(totals[p] * mult);
      });
      return totals;
    }

                    <button type="button" onclick="splitItems.splice(${idx}, 1); updateModalInner(buildSplitBillModalHTML())" class="text-rose-500 text-xs font-bold px-1.5">✕</button>
                  </div>
                  <div class="grid grid-cols-2 gap-1.5">
                    <input type="text" inputmode="numeric" value="${formatThousands(item.price)}"
                      oninput="splitItems[${idx}].price = parseRupiahDigits(this.value); updateModalInner(buildSplitBillModalHTML())"

                    <select onchange="splitItems[${idx}].assignedTo = this.value; updateModalInner(buildSplitBillModalHTML())"

              ${Object.entries(itemizedTotals).map(([person, amt]) => `
                <div class="flex items-center justify-between text-xs">

        <div class="grid grid-cols-2 gap-2.5 mt-4">

    function addSplitPerson() {
      const nextNum = splitPeopleList.length;
      splitPeopleList.push(`Teman ${nextNum}`);
      updateModalInner(buildSplitBillModalHTML());
    }

    function removeSplitPerson(idx) {
      const removed = splitPeopleList[idx];
      splitPeopleList.splice(idx, 1);
      splitItems.forEach((it) => {
        if (it.assignedTo === removed) it.assignedTo = 'Aku';
      });
      updateModalInner(buildSplitBillModalHTML());

    async function handleSplitReceiptUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        splitItemReceiptImg = await compressImageFile(file);
        splitIsScanning = true;
        updateModalInner(buildSplitBillModalHTML());

        setTimeout(() => {

            { id: 'sb_' + Date.now() + '_3', name: 'Es Teh Manis (2x)', price: 16000, assignedTo: 'Bagi Rata' }
          ];
          updateModalInner(buildSplitBillModalHTML());

        }, 1200);

    }

    async function copySplitBillToClipboard() {
      let text = '*Rincian Split Bill (via Cuan)* 🧾\n\n';
      if (splitBillMode === 'equal') {
        const raw = parseRupiahDigits(splitEqualTotal);
        const grand = Math.round(raw * (1 + Number(splitEqualTax || 0) / 100));
        const perPerson = Math.round(grand / Math.max(1, splitEqualPeople));
        text += `Total Tagihan (+Pajak ${splitEqualTax}%): ${formatRupiah(grand)}\n`;
        text += `Dibagi ${splitEqualPeople} orang: *${formatRupiah(perPerson)} / orang*\n`;
      } else {
        const breakdown = calculateItemizedSplitBreakdown();
        splitItems.forEach((it) => {
          text += `• ${it.name} (${formatRupiah(it.price)}) → _${it.assignedTo}_\n`;
        });
        text += `\n*Total Patungan (+Pajak ${splitItemTaxPercent}%):*\n`;
        Object.entries(breakdown).forEach(([person, amt]) => {
          text += `• ${person}: *${formatRupiah(amt)}*\n`;
        });
      }

      try {
        await navigator.clipboard.writeText(text);
        showToast('Rincian WA disalin ke clipboard!', 'success');
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('Rincian WA disalin ke clipboard!', 'success');
      }
    }

    function recordMySplitShare() {
      let myShare = 0;
      if (splitBillMode === 'equal') {
        const raw = parseRupiahDigits(splitEqualTotal);
        const grand = Math.round(raw * (1 + Number(splitEqualTax || 0) / 100));
        myShare = Math.round(grand / Math.max(1, splitEqualPeople));
      } else {
        const breakdown = calculateItemizedSplitBreakdown();
        myShare = breakdown['Aku'] || 0;
      }

      if (myShare <= 0) {
        showToast('Nominal porsimu masih Rp 0', 'warning');
        return;
      }

      const catId = appState.categories.find((c) => c.id === 'cat_makan')?.id || getDefaultExpenseCatId();
      appState.transactions.push({
        id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        type: 'expense',
        amount: myShare,
        categoryId: catId,
        date: getTodayISO(),
        note: 'Split Bill Patungan',
        receiptImage: splitItemReceiptImg || ''
      });
      saveState();
      closeModal();
      renderApp();
      showToast(`Porsimu (${formatRupiah(myShare)}) dicatat!`, 'success');
      checkCategoryBudgetAlert(catId);
    }

    async function signInWithGoogle() {
      if (!supabaseClient) {
        showToast('Konfigurasi Supabase belum diisi di index.html', 'warning');
        return;
      }
      const redirectTo = window.location.origin + window.location.pathname;
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo,
          queryParams: { prompt: 'select_account' }
        }
      });
      if (error) {
        showToast('Gagal memulai login Google: ' + error.message, 'error');
      }
    }

    async function submitAuthForm(e) {
      e.preventDefault();
      if (!supabaseClient) {
        showToast('Konfigurasi Supabase belum diisi di index.html', 'warning');
        return;
      }

      if (authMode === 'signup') {
        if (!authAgreeTerms) {
          showToast('Silakan centang persetujuan Syarat & Ketentuan terlebih dahulu', 'warning');
          return;
        }
        const { data, error } = await supabaseClient.auth.signUp({
          email: authEmailInput.trim(),
          password: authPasswordInput,
          options: {
            data: { full_name: authNameInput.trim() || 'Sobat Cuan' }
          }
        });
        if (error) {
          showToast(error.message, 'error');
          return;
        }
        if (data?.user && !data?.session) {
          showToast('Pendaftaran berhasil! Cek email untuk konfirmasi akun.', 'success');
          openAuthModal('login');
        } else {
          closeModal();
          showToast('Akun berhasil dibuat & tersinkron!', 'success');
        }
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: authEmailInput.trim(),
          password: authPasswordInput
        });
        if (error) {
          showToast('Email atau kata sandi salah: ' + error.message, 'error');
          return;
        }
        closeModal();
        showToast('Berhasil masuk!', 'success');
      }
    }

    async function submitForgotPassword(e) {
      e.preventDefault();
      if (!supabaseClient || forgotCooldownSec > 0) return;

      const redirectTo = window.location.origin + window.location.pathname;
      const { error } = await supabaseClient.auth.resetPasswordForEmail(authEmailInput.trim(), { redirectTo });

      if (error) {
        const waitMatch = error.message.match(/(\d+)\s*seconds/i);
        startForgotCooldown(waitMatch ? Number(waitMatch[1]) : 60);
        showToast('Mohon tunggu sebentar sebelum mengirim ulang email reset sandi.', 'warning');
        return;
      }
      startForgotCooldown(60);
      showToast('Link reset sandi terkirim! Cek kotak masuk / spam emailmu.', 'success');
    }

    function startForgotCooldown(seconds) {
      forgotCooldownSec = seconds;
      clearInterval(forgotCooldownTimer);
      updateModalInner(buildAuthModalHTML());
      forgotCooldownTimer = setInterval(() => {
        forgotCooldownSec--;
        if (forgotCooldownSec <= 0) {
          clearInterval(forgotCooldownTimer);
          forgotCooldownSec = 0;
        }
        if (currentModalType === 'auth' && authMode === 'forgot') {
          updateModalInner(buildAuthModalHTML());
        }
      }, 1000);
    }

    async function submitNewRecoveryPassword(e) {
      e.preventDefault();
      if (!supabaseClient) return;
      const p1 = document.getElementById('new-recovery-pass')?.value || '';
      const p2 = document.getElementById('confirm-recovery-pass')?.value || '';
      if (p1 !== p2) {
        showToast('Konfirmasi kata sandi tidak cocok', 'warning');
        return;
      }
      const { error } = await supabaseClient.auth.updateUser({ password: p1 });
      if (error) {
        showToast('Gagal memperbarui sandi: ' + error.message, 'error');
        return;
      }
      window.history.replaceState({}, document.title, window.location.pathname);
      closeModal();
      showToast('Kata sandi baru berhasil disimpan!', 'success');
    }

      if (supabaseClient) {
        await supabaseClient.auth.signOut();

      appState.userEmail = '';
      appState.userAvatar = '';
      appState.userName = 'Sobat Cuan';
      saveState();
      renderApp();
      showToast('Berhasil keluar dari akun', 'info');
    }

    function startSpotlightTour() {
      if (activeTab !== 'beranda') {
        activeTab = 'beranda';

      tourStepIndex = 0;

    }

    function stepSpotlightTour(delta) {
      const next = tourStepIndex + delta;
      if (next < 0) return;
      if (next >= TOUR_STEPS.length) {
        endSpotlightTour();
        return;
      }
      tourStepIndex = next;
      positionSpotlightTour(false);
    }

    function endSpotlightTour() {
      document.getElementById('tour-layer').classList.add('hidden');
    }

    function positionSpotlightTour(isInitial) {
      const step = TOUR_STEPS[tourStepIndex];
      const target = document.getElementById(step.targetId) || document.getElementById('tour-target-quick');
      if (!target) return;

      const isFixedTarget = step.targetId === 'global-plus-btn';
      const rect = target.getBoundingClientRect();
      const inView = isFixedTarget || (rect.top >= 24 && rect.bottom <= window.innerHeight - 100);
      if (!inView) {
        if (tourStepIndex === 0) {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      setTimeout(() => {
        const r = target.getBoundingClientRect();
        const box = document.getElementById('tour-highlight-box');
        const card = document.getElementById('tour-tooltip-card');
        const shell = document.getElementById('app-shell').getBoundingClientRect();

        const pad = 6;
        const boxTop = Math.max(8, r.top - pad);
        const boxLeft = Math.max(shell.left + 8, r.left - pad);
        const boxWidth = Math.min(shell.width - 16, r.width + pad * 2);
        const boxHeight = Math.min(window.innerHeight - 16, r.height + pad * 2);

        box.style.top = `${boxTop}px`;
        box.style.left = `${boxLeft}px`;
        box.style.width = `${boxWidth}px`;
        box.style.height = `${boxHeight}px`;

        document.getElementById('tour-step-badge').textContent = `Langkah ${tourStepIndex + 1} / ${TOUR_STEPS.length}`;
        document.getElementById('tour-title').textContent = step.title;
        document.getElementById('tour-desc').textContent = step.desc;
        document.getElementById('tour-prev-btn').style.visibility = tourStepIndex === 0 ? 'hidden' : 'visible';
        document.getElementById('tour-next-btn').textContent = tourStepIndex === TOUR_STEPS.length - 1 ? 'Selesai' : 'Lanjut';

        const cardWidth = Math.min(310, Math.max(260, shell.width - 24));
        card.style.width = `${cardWidth}px`;

        const actualCardHeight = card.offsetHeight || 195;
        const safeMinTop = 28;
        const safeMaxTop = Math.max(safeMinTop, window.innerHeight - actualCardHeight - 24);
        const centeredLeft = shell.left + (shell.width - cardWidth) / 2;

        const spaceBelow = window.innerHeight - (boxTop + boxHeight) - 14;
        const spaceAbove = boxTop - 14;

        let topPos;
        if (spaceBelow >= actualCardHeight + 12) {
          topPos = boxTop + boxHeight + 12;
        } else if (spaceAbove >= actualCardHeight + safeMinTop) {
          topPos = boxTop - actualCardHeight - 12;
        } else {
          topPos = spaceBelow >= spaceAbove
            ? Math.min(safeMaxTop, boxTop + boxHeight + 10)
            : Math.max(safeMinTop, boxTop - actualCardHeight - 10);
        }

        topPos = Math.min(safeMaxTop, Math.max(safeMinTop, topPos));

        card.style.left = `${Math.max(12, centeredLeft)}px`;
        card.style.top = `${topPos}px`;
      }, inView ? 20 : 320);
    }

      renderApp();
    }

    function toggleHideBalance() {
      appState.hideBalance = !appState.hideBalance;
      saveState();
      renderApp();
    }

    function changeAppTheme(themeKey) {
      appState.theme = themeKey;
      applyTheme(themeKey);
      saveState();
      renderApp();
      showToast('Tema warna diperbarui', 'success');
    }

    function toggleReminder(enabled) {
      appState.reminderEnabled = enabled;
      if (enabled && 'Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      saveState();
      renderApp();
    }

    function seedSimulationData() {
      const cycle = getCycleRange(appState.selectedCycleKey);
      const d1 = cycle.startISO;
      const d2 = getTodayISO();

      const sampleTxs = [
        { type: 'income', amount: 6500000, categoryId: 'cat_gaji', date: d1, note: 'Gaji Bulanan' },
        { type: 'income', amount: 850000, categoryId: 'cat_freelance', date: d2, note: 'Project Desain UI' },
        { type: 'expense', amount: 24000, categoryId: 'cat_makan', date: d2, note: 'Es Kopi Susu Gula Aren' },
        { type: 'expense', amount: 42000, categoryId: 'cat_makan', date: d2, note: 'Makan Siang Ayam Bakar' },
        { type: 'expense', amount: 18000, categoryId: 'cat_transport', date: d2, note: 'Ojol ke Kantor' },
        { type: 'expense', amount: 350000, categoryId: 'cat_tagihan', date: d1, note: 'Token Listrik & WiFi' },
        { type: 'expense', amount: 215000, categoryId: 'cat_belanja', date: d2, note: 'Belanja Bulanan Minimarket' }
      ];

      sampleTxs.forEach((s, i) => {
        appState.transactions.push({
          id: 'tx_seed_' + (Date.now() + i),
          ...s,
          receiptImage: ''
        });
      });

      saveState();
      renderApp();
      showToast('7 transaksi contoh berhasil ditambahkan!', 'success');
    }

    function exportTransactionsCSV() {
      const txs = getCycleTransactions(appState.selectedCycleKey);
      if (!txs.length) {
        showToast('Belum ada transaksi untuk diekspor', 'warning');
        return;
      }
      const rows = [['Tanggal', 'Tipe', 'Kategori', 'Nominal', 'Catatan']];
      txs.forEach((t) => {
        const cat = appState.categories.find((c) => c.id === t.categoryId)?.name || 'Lainnya';
        rows.push([t.date, t.type === 'income' ? 'Cuan Masuk' : 'Cuan Keluar', cat, t.amount, `"${(t.note || '').replace(/"/g, '""')}"`]);
      });
      const csv = rows.map((r) => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cuan-transaksi-${appState.selectedCycleKey}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('File CSV berhasil diunduh', 'success');
    }

    function backupJSON() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup-cuan-${getTodayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup JSON berhasil diunduh', 'success');
    }

    function restoreJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!Array.isArray(parsed.transactions)) throw new Error('Format tidak valid');
          appState = { ...appState, ...parsed };
          applyTheme(appState.theme);
          saveState();
          renderApp();
          showToast('Data berhasil dipulihkan!', 'success');
        } catch (_) {
          showToast('File JSON tidak valid', 'error');
        }
      };
      reader.readAsText(file);
    }

    function setupGlobalPlusButton() {
      const btn = document.getElementById('global-plus-btn');
      if (!btn) return;
      let holdTimer = null;
      let held = false;
      let pointerActive = false;

      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        pointerActive = true;
        held = false;
        holdTimer = setTimeout(() => {
          held = true;
          pointerActive = false;
          openTransactionModal('voice');
        }, 450);
      });

      const release = (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        clearTimeout(holdTimer);
        if (!pointerActive) return;
        pointerActive = false;
        if (!held) {
          setTimeout(() => {
            openTransactionModal('manual');
          }, 35);
        }
      };

      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', () => {
        pointerActive = false;
        clearTimeout(holdTimer);
      });
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
    }

    function startReminderScheduler() {
      setInterval(() => {
        if (!appState.reminderEnabled) return;
        const now = new Date();
        const hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const today = getTodayISO();
        if (hhmm === appState.reminderTime && appState.lastReminderDate !== today) {
          appState.lastReminderDate = today;
          saveState();
          showToast('⏰ Waktunya catat pengeluaran hari ini di Cuan!', 'info');
          addNotification('⏰ Pengingat Harian', 'Jangan lupa catat transaksi hari ini agar siklus gajianmu tetap terkontrol.', 'info');
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('Cuan — Pengingat Harian', { body: 'Yuk catat transaksi hari ini sebelum tidur!' });
          }
        }
      }, 20000);
    }

    /*************************************************************************
     * 22. INISIALISASI APLIKASI & SERVICE WORKER
     *************************************************************************/
    document.addEventListener('DOMContentLoaded', () => {
      loadLocalState();
      setupGlobalPlusButton();
      renderApp();
      initSupabaseSession();
      startReminderScheduler();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
