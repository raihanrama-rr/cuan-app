  <style>
    :root {
      --brand: #127084;
      --brand-dark: #0E5A6A;
      --brand-darker: #0B4F5E;
      --brand-tint: #E6F3F6;
      --brand-rgb: 18, 112, 132;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #EBF0F2;
      color: #0F172A;
      margin: 0;
      padding: 0;
      overscroll-behavior-y: contain;
    }

    /* Mobile-First App Shell */
    #app-shell {
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      background-color: #F4F7F8;
      position: relative;
      box-shadow: 0 0 40px rgba(15, 23, 42, 0.08);
      padding-bottom: 92px;
      overflow-x: hidden;
    }

    /* Curved Hero Header */
    .hero-gradient {
      background: linear-gradient(155deg, var(--brand) 0%, var(--brand-dark) 58%, var(--brand-darker) 100%);
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
    }

    /* Custom Scrollbar Hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Bottom Sheet & Modal Transitions */
    .modal-backdrop {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      animation: fadeIn 0.2s ease-out;
    }

    .bottom-sheet {
      animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Voice Pulse Animation */
    @keyframes pulseRing {
      0% { transform: scale(0.92); opacity: 0.8; }
      70% { transform: scale(1.35); opacity: 0; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    .voice-pulse::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 9999px;
      background: var(--brand);
      animation: pulseRing 1.5s infinite;
      z-index: 0;
    }

    /* Laser Scan Animation */
    @keyframes laserScan {
      0%, 100% { top: 8%; }
      50% { top: 88%; }
    }
    .scan-laser {
      position: absolute;
      left: 6%;
      right: 6%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #10B981, #FFFFFF, #10B981, transparent);
      box-shadow: 0 0 12px #10B981;
      animation: laserScan 2s ease-in-out infinite;
    }

    /* Long-Press FAB Feedback */
    .fab-btn {
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .fab-btn.pressing {
      transform: scale(0.91);
      box-shadow: 0 0 0 8px rgba(18, 112, 132, 0.22);
    }

    /* Spotlight Tour Highlight (Smooth Single-Glide Transition) */
    .tour-highlight-box {
      position: fixed;
      border-radius: 18px;
      box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.72), 0 0 0 3px #FFFFFF, 0 0 24px rgba(255, 255, 255, 0.45);

    const MONTH_NAMES_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const MONTH_NAMES_FULL = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const DAY_NAMES = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

    function formatRupiah(num) {
      const n = Math.round(Number(num) || 0);
      const prefix = n < 0 ? '-Rp ' : 'Rp ';
      return prefix + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function parseRupiahInput(str) {
      return Number(String(str || '').replace(/[^\d]/g, '')) || 0;
    }

    function formatTodayHeader() {
      const now = new Date();
      return `${DAY_NAMES[now.getDay()]}, ${now.getDate()} ${MONTH_NAMES_SHORT[now.getMonth()]} ${now.getFullYear()}`;
    }

    function toISODate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseISODate(isoStr) {
      const [y, m, d] = (isoStr || toISODate(new Date())).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function getDaysInMonth(year, monthIndex0) {
      return new Date(year, monthIndex0 + 1, 0).getDate();
    }

    function getPaydayForYearMonth(year, monthIndex0) {
      const ym = `${year}-${String(monthIndex0 + 1).padStart(2, '0')}`;
      const rawDay = appState.monthlyPaydays && appState.monthlyPaydays[ym]
        ? Number(appState.monthlyPaydays[ym])
        : Number(appState.defaultPayday || 30);
      const maxDays = getDaysInMonth(year, monthIndex0);
      return Math.min(Math.max(1, rawDay), maxDays);
    }

    function getCycleRange(cycleKey) {
      const [y, m] = cycleKey.split('-').map(Number);
      const m0 = m - 1;
      const startDay = getPaydayForYearMonth(y, m0);
      const startDate = new Date(y, m0, startDay);

      const nextDateObj = new Date(y, m0 + 1, 1);
      const ny = nextDateObj.getFullYear();
      const nm0 = nextDateObj.getMonth();
      const nextPayday = getPaydayForYearMonth(ny, nm0);
      const endDate = new Date(ny, nm0, nextPayday - 1);

      const label = `${startDate.getDate()} ${MONTH_NAMES_SHORT[startDate.getMonth()]} – ${endDate.getDate()} ${MONTH_NAMES_SHORT[endDate.getMonth()]}`;
      const fullLabel = `${startDate.getDate()} ${MONTH_NAMES_SHORT[startDate.getMonth()]} ${startDate.getFullYear()} – ${endDate.getDate()} ${MONTH_NAMES_SHORT[endDate.getMonth()]} ${endDate.getFullYear()}`;

      return {
        key: cycleKey,
        startDate,
        endDate,
        startISO: toISODate(startDate),
        endISO: toISODate(endDate),
        label,
        fullLabel
      };
    }

    function findCycleKeyForDate(dateObj) {
      const iso = toISODate(dateObj);
      const y = dateObj.getFullYear();
      const m0 = dateObj.getMonth();

      const currentMonthKey = `${y}-${String(m0 + 1).padStart(2, '0')}`;
      const currentCycle = getCycleRange(currentMonthKey);
      if (iso >= currentCycle.startISO && iso <= currentCycle.endISO) {
        return currentMonthKey;
      }

      if (iso < currentCycle.startISO) {
        const prev = new Date(y, m0 - 1, 1);
        return `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;
      } else {
        const next = new Date(y, m0 + 1, 1);
        return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}`;
      }
    }

    function getAvailableCycles() {
      const todayCycleKey = findCycleKeyForDate(new Date());
      const keysSet = new Set([todayCycleKey]);

      (appState.transactions || []).forEach((tx) => {
        if (tx.date) {
          const ck = findCycleKeyForDate(parseISODate(tx.date));
          keysSet.add(ck);
        }
      });

      const sortedKeys = Array.from(keysSet).sort((a, b) => b.localeCompare(a));
      return sortedKeys.map((k) => {
        const range = getCycleRange(k);
        return {
          ...range,
          isActiveToday: k === todayCycleKey
        };
      });
    }

    function getPreviousCycleKey(cycleKey) {
      const [y, m] = cycleKey.split('-').map(Number);
      const prev = new Date(y, m - 2, 1);
      return `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;
    }

        .replace(/</g, '&lt;')

    function applyTheme(themeId) {
      const theme = ACCENT_THEMES.find((t) => t.id === themeId) || ACCENT_THEMES[0];
      appState.themeId = theme.id;
      document.documentElement.style.setProperty('--brand', theme.brand);
      document.documentElement.style.setProperty('--brand-dark', theme.dark);
      document.documentElement.style.setProperty('--brand-darker', theme.darker);
      document.documentElement.style.setProperty('--brand-tint', theme.tint);
      const metaTheme = document.getElementById('meta-theme-color');
      if (metaTheme) metaTheme.setAttribute('content', theme.brand);
      updateDynamicFavicon(theme.brand, theme.darker);
    }

    function buildCuanIconCanvas(size, colorTop = '#147D93', colorBottom = '#083D49') {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const s = size / 512;

      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, colorTop);
      grad.addColorStop(1, colorBottom);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 14 * s;
      ctx.beginPath();
      ctx.arc(256 * s, 256 * s, 176 * s, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 42 * s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      const startAngle = Math.atan2(184 - 256, 322 - 256);
      const endAngle = Math.atan2(328 - 256, 322 - 256);
      ctx.arc(256 * s, 256 * s, 98 * s, startAngle, endAngle, true);
      ctx.stroke();

      ctx.lineWidth = 24 * s;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(244 * s, 274 * s);
      ctx.lineTo(292 * s, 226 * s);
      ctx.lineTo(324 * s, 246 * s);
      ctx.lineTo(368 * s, 196 * s);
      ctx.stroke();

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.moveTo(376 * s, 144 * s);
      ctx.quadraticCurveTo(376 * s, 170 * s, 402 * s, 170 * s);
      ctx.quadraticCurveTo(376 * s, 170 * s, 376 * s, 196 * s);
      ctx.quadraticCurveTo(376 * s, 170 * s, 350 * s, 170 * s);
      ctx.quadraticCurveTo(376 * s, 170 * s, 376 * s, 144 * s);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.78)';
      ctx.beginPath();
      ctx.arc(332 * s, 146 * s, 6 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      return canvas;
    }

    function updateDynamicFavicon(colorTop, colorBottom) {
      try {
        const png192 = buildCuanIconCanvas(192, colorTop, colorBottom).toDataURL('image/png');
        let iconLink = document.querySelector('link[rel="icon"]');
        if (iconLink) {
          iconLink.setAttribute('type', 'image/png');
          iconLink.setAttribute('href', png192);
        }
        let appleLink = document.querySelector('link[rel="apple-touch-icon"]');
        if (appleLink) {
          appleLink.setAttribute('href', png192);
        }
      } catch (_) {}
    }

    function downloadAppPngIcons() {
      [192, 512].forEach((sz, i) => {
        setTimeout(() => {
          const dataUrl = buildCuanIconCanvas(sz, '#147D93', '#083D49').toDataURL('image/png');
          const a = document.createElement('a');
          a.href = dataUrl;
          a.download = `icon-${sz}.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
        }, i * 350);
      });
      showToast('📥 Mengunduh icon-192.png & icon-512.png! Upload keduanya ke GitHub.', 'success');

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appState = {
            ...appState,
            ...parsed,
            categories: Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : appState.categories,
            transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
            notifications: Array.isArray(parsed.notifications) ? parsed.notifications : [],
            monthlyPaydays: parsed.monthlyPaydays || {}
          };
        }
      } catch (err) {
        console.error('Gagal memuat state lokal:', err);
      }
      applyTheme(appState.themeId);
      mergeDeveloperAnnouncements();

      const cycles = getAvailableCycles();
      if (!uiState.selectedCycleKey || !cycles.some((c) => c.key === uiState.selectedCycleKey)) {
        uiState.selectedCycleKey = findCycleKeyForDate(new Date());
      }
    }

    function mergeDeveloperAnnouncements() {
      const existingIds = new Set((appState.notifications || []).map((n) => n.id));
      DEVELOPER_ANNOUNCEMENTS.forEach((ann) => {
        if (!existingIds.has(ann.id)) {
          appState.notifications.unshift({
            id: ann.id,
            title: ann.title,
            message: ann.message,
            time: ann.time || 'Baru saja',
            read: false,
            type: 'dev'
          });
        }
      });
    }

    function saveState(triggerCloud = true) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.error('Gagal menyimpan state lokal:', err);
      }

      if (triggerCloud && currentUser && supabaseClient) {
        uiState.syncStatus = 'syncing';
        updateSyncBadgeOnly();
        clearTimeout(syncTimeout);
        syncTimeout = setTimeout(() => {
          syncUserDataToCloud();
        }, 800);
      }
    }

    function updateSyncBadgeOnly() {
      const el = document.getElementById('sync-status-pill');
      if (!el) return;
      if (!currentUser) {
        el.innerHTML = `<span class="inline-flex items-center gap-1">${getAppIcon('smartphone', 'w-3.5 h-3.5')} Mode Lokal</span>`;
      } else if (uiState.syncStatus === 'syncing') {
        el.innerHTML = `<span class="inline-flex items-center gap-1">${getAppIcon('refresh', 'w-3.5 h-3.5 animate-spin')} Sync...</span>`;
      } else if (uiState.syncStatus === 'error') {
        el.innerHTML = `<span class="inline-flex items-center gap-1">${getAppIcon('alert', 'w-3.5 h-3.5')} Gagal Sync</span>`;
      } else {
        el.innerHTML = `<span class="inline-flex items-center gap-1">${getAppIcon('cloud', 'w-3.5 h-3.5')} Tersinkron</span>`;
      }

    async function initSupabase() {
      try {
        if (!window.supabase || !SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey) return;
        supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const queryParams = new URLSearchParams(window.location.search);
        const hasRecoveryInUrl = hashParams.get('type') === 'recovery' || queryParams.get('type') === 'recovery';
        if (hasRecoveryInUrl) {
          uiState.isPasswordRecovery = true;
        }

        supabaseClient.auth.onAuthStateChange(async (event, sessionObj) => {
          if (event === 'PASSWORD_RECOVERY') {
            currentUser = sessionObj?.user || currentUser;
            uiState.isPasswordRecovery = true;
            if (currentUser) {
              await loadUserDataFromCloud();
            }
            renderApp();
            openNewPasswordModal();
            return;
          }

          if (event === 'SIGNED_IN' && sessionObj?.user) {
            currentUser = sessionObj.user;
            if (!appState.userName || appState.userName === 'Sobat Cuan') {
              appState.userName = currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || 'Sobat Cuan';
            }
            await loadUserDataFromCloud();
            renderApp();
            if (uiState.isPasswordRecovery) {
              openNewPasswordModal();
            }
          } else if (event === 'SIGNED_OUT') {
            currentUser = null;
            uiState.syncStatus = 'local';
            uiState.isPasswordRecovery = false;
            renderApp();
          }
        });

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          currentUser = session.user;
          await loadUserDataFromCloud();
          if (uiState.isPasswordRecovery) {
            openNewPasswordModal();
          }
        } else if (hasRecoveryInUrl) {
          uiState.isPasswordRecovery = false;
          window.history.replaceState({}, document.title, window.location.pathname);
          showToast('⚠️ Link reset sandi sudah kedaluwarsa. Silakan minta link baru.', 'warning');
          authFormMode = 'forgot';
          openAuthOrProfileModal();
        }
      } catch (err) {
        console.error('Supabase init error:', err);
      }
    }

    async function loadUserDataFromCloud() {
      if (!supabaseClient || !currentUser) return;
      try {
        uiState.syncStatus = 'syncing';
        updateSyncBadgeOnly();

        const { data, error } = await supabaseClient
          .from('cuan_user_data')
          .select('payload')
          .eq('user_id', currentUser.id)
          .maybeSingle();

        if (error) throw error;

        if (data && data.payload && Object.keys(data.payload).length > 0) {
          appState = {
            ...appState,
            ...data.payload,
            categories: Array.isArray(data.payload.categories) && data.payload.categories.length ? data.payload.categories : appState.categories,
            transactions: Array.isArray(data.payload.transactions) ? data.payload.transactions : [],
            monthlyPaydays: data.payload.monthlyPaydays || {}
          };
          applyTheme(appState.themeId);
          mergeDeveloperAnnouncements();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));

          const cycles = getAvailableCycles();
          if (!cycles.some((c) => c.key === uiState.selectedCycleKey)) {
            uiState.selectedCycleKey = findCycleKeyForDate(new Date());
          }
        } else {
          await syncUserDataToCloud();
        }

        uiState.syncStatus = 'synced';
        renderApp();
      } catch (err) {
        console.error('Load cloud error:', err);
        uiState.syncStatus = 'error';
        updateSyncBadgeOnly();
      }
    }

    async function syncUserDataToCloud() {
      if (!supabaseClient || !currentUser) return;
      try {
        const payload = {
          userName: appState.userName,
          defaultPayday: appState.defaultPayday,
          monthlyPaydays: appState.monthlyPaydays,
          categories: appState.categories,
          transactions: appState.transactions,
          notifications: appState.notifications,
          reminderEnabled: appState.reminderEnabled,
          reminderTime: appState.reminderTime,
          themeId: appState.themeId
        };

        const { error } = await supabaseClient
          .from('cuan_user_data')
          .upsert({
            user_id: currentUser.id,
            payload,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });

        if (error) throw error;
        uiState.syncStatus = 'synced';
        updateSyncBadgeOnly();
      } catch (err) {
        console.error('Sync cloud error:', err);
        uiState.syncStatus = 'error';
        updateSyncBadgeOnly();
      }
    }

    function translateAuthError(msg) {
      const m = String(msg || '').toLowerCase();
      const waitMatch = m.match(/after\s+(\d+)\s+seconds?/);
      if (waitMatch) {
        const sec = Number(waitMatch[1]) || 15;
        uiState.resetCooldownUntil = Date.now() + sec * 1000;
        return `Demi keamanan, tunggu ${sec} detik lagi sebelum kirim ulang link reset sandi.`;
      }
      if (m.includes('new password should be different')) return 'Kata sandi baru harus berbeda dari kata sandi lama.';
      if (m.includes('auth session missing') || m.includes('session_not_found')) return 'Sesi reset sandi sudah habis. Minta link reset sandi baru ya.';
      if (m.includes('invalid login credentials')) return 'Email atau kata sandi salah. Coba cek lagi ya!';
      if (m.includes('user already registered')) return 'Email ini sudah terdaftar. Silakan langsung Masuk.';
      if (m.includes('password should be at least')) return 'Kata sandi minimal 6 karakter.';
      if (m.includes('email not confirmed')) return 'Email belum dikonfirmasi. Cek inbox atau matikan Confirm Email di Supabase.';
      if (m.includes('rate limit') || m.includes('too many requests')) return 'Terlalu banyak percobaan. Tunggu sekitar 1 menit lalu coba lagi.';
      return msg || 'Terjadi kendala autentikasi. Coba beberapa saat lagi.';
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const bgMap = {
        info: 'bg-slate-900 text-white',
        success: 'bg-emerald-600 text-white',
        warning: 'bg-amber-500 text-slate-950 font-semibold',
        danger: 'bg-rose-600 text-white'
      };

      const toast = document.createElement('div');
      toast.className = `${bgMap[type] || bgMap.info} px-4 py-3 rounded-2xl shadow-xl text-xs flex items-center justify-between gap-2 transition-all duration-300 pointer-events-auto`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 280);
      }, 3200);

    function addNotification(title, message, type = 'system') {
      appState.notifications.unshift({
        id: 'notif_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        title,
        message,
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
        read: false,
        type
      });
      if (appState.notifications.length > 40) {
        appState.notifications = appState.notifications.slice(0, 40);
      }
      saveState();
    }

    function checkCategoryBudgetAlert(categoryId, cycleKey) {
      const cat = appState.categories.find((c) => c.id === categoryId);
      if (!cat || cat.type !== 'expense' || !cat.budgetLimit || cat.budgetLimit <= 0) return;

      const range = getCycleRange(cycleKey);
      const spent = appState.transactions
        .filter((t) => t.type === 'expense' && t.categoryId === categoryId && t.date >= range.startISO && t.date <= range.endISO)
        .reduce((sum, t) => sum + Number(t.amount || 0), 0);

      const ratio = spent / cat.budgetLimit;
      if (ratio >= 1) {
        const msg = `Pengeluaran pos ${cat.name} sudah mencapai ${formatRupiah(spent)} (100%+ dari limit ${formatRupiah(cat.budgetLimit)}).`;
        showToast(`🚨 Limit Jebol: ${cat.name}!`, 'danger');
        addNotification(`🚨 Limit Pos ${cat.name} Jebol!`, msg, 'budget');
      } else if (ratio >= 0.8) {
        const sisa = Math.max(0, cat.budgetLimit - spent);
        const msg = `Pos ${cat.name} sudah terpakai ${Math.round(ratio * 100)}%. Sisa aman: ${formatRupiah(sisa)}.`;
        showToast(`⚠️ Lampu Kuning: ${cat.name} (${Math.round(ratio * 100)}%)`, 'warning');
        addNotification(`⚠️ Lampu Kuning: ${cat.name}`, msg, 'budget');
      }
    }

    function startReminderScheduler() {
      setInterval(() => {
        if (!appState.reminderEnabled || !appState.reminderTime) return;
        const now = new Date();
        const todayStr = toISODate(now);
        if (appState.lastReminderDate === todayStr) return;

        const currentHHMM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        if (currentHHMM === appState.reminderTime) {
          appState.lastReminderDate = todayStr;
          const title = '⏰ Waktunya Catat Cuan Hari Ini!';
          const msg = 'Jangan lupa catat jajan atau pemasukan hari ini biar arus cuan siklus ini tetap akurat.';
          showToast(title, 'info');
          addNotification(title, msg, 'reminder');

          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(title, { body: msg, icon: '/icon.svg' });
          }
          renderApp();
        }
      }, 20000);
    }

    /**
     * ============================================================================
     * 6. PARSER SUARA & CATAT AI (BAHASA INDONESIA + SLANG GEN-Z)
     * ============================================================================
     */
    function parseIndonesianAmount(text) {
      let clean = text.toLowerCase().replace(/rp\.?/g, '').trim();

      const slangMap = {
        'seceng': 1000,
        'goceng': 5000,
        'ceban': 10000,
        'goban': 50000,
        'cepek': 100000,
        'gopek': 500000
      };
      for (const [slang, val] of Object.entries(slangMap)) {
        if (clean.includes(slang)) return val;
      }

      if (clean.includes('setengah juta')) return 500000;

      const numMatch = clean.match(/(\d+(?:[.,]\d+)?)\s*(jt|juta|rb|ribu|k)?\b/);
      if (numMatch) {
        let numStr = numMatch[1];
        const unit = numMatch[2] || '';

        if (unit === 'jt' || unit === 'juta') {
          return Math.round(parseFloat(numStr.replace(',', '.')) * 1000000);
        }
        if (unit === 'rb' || unit === 'ribu' || unit === 'k') {
          return Math.round(parseFloat(numStr.replace(',', '.')) * 1000);
        }
        const digitsOnly = parseInt(numStr.replace(/[.,]/g, ''), 10);
        if (!isNaN(digitsOnly) && digitsOnly > 0) return digitsOnly;
      }

      const wordNums = {
        'satu': 1, 'se': 1, 'dua': 2, 'tiga': 3, 'empat': 4, 'lima': 5,
        'enam': 6, 'tujuh': 7, 'delapan': 8, 'sembilan': 9, 'sepuluh': 10,
        'sebelas': 11, 'dua belas': 12, 'lima belas': 15, 'dua puluh': 20,
        'dua puluh lima': 25, 'tiga puluh': 30, 'empat puluh': 40, 'lima puluh': 50,
        'seratus': 100, 'dua ratus': 200, 'tiga ratus': 300, 'lima ratus': 500
      };
      for (const [word, mult] of Object.entries(wordNums)) {
        if (clean.includes(word + ' juta')) return mult * 1000000;
        if (clean.includes(word + ' ribu')) return mult * 1000;
      }

      return 0;
    }

    function guessCategoryAndType(noteText) {
      const lower = noteText.toLowerCase();
      const incomeKeywords = ['gaji', 'bonus', 'thr', 'freelance', 'project', 'transfer masuk', 'dapat', 'cuan masuk', 'jual', 'komisi', 'dividen'];
      const isIncome = incomeKeywords.some((kw) => lower.includes(kw));

      if (isIncome) {
        const cat = lower.includes('gaji') || lower.includes('bonus')
          ? appState.categories.find((c) => c.id === 'cat_gaji')
          : appState.categories.find((c) => c.type === 'income');
        return { type: 'income', categoryId: cat ? cat.id : appState.categories[0].id };
      }

      const rules = [
        { kw: ['kopi', 'makan', 'nasi', 'ayam', 'bakso', 'mie', 'minum', 'boba', 'sarapan', 'lunch', 'dinner', 'jajan', 'cafe', 'warteg', 'gofood', 'grabfood'], catId: 'cat_makan' },
        { kw: ['ojol', 'gojek', 'grab', 'bensin', 'pertalite', 'pertamax', 'parkir', 'tol', 'kereta', 'krl', 'mrt', 'transjakarta', 'bus'], catId: 'cat_transport' },
        { kw: ['kos', 'listrik', 'token', 'air', 'wifi', 'internet', 'pulsa', 'kuota', 'tagihan', 'cicilan', 'bpjs'], catId: 'cat_tagihan' },
        { kw: ['baju', 'sepatu', 'skincare', 'shopee', 'tokopedia', 'lazada', 'beli', 'indomaret', 'alfamart', 'sabun'], catId: 'cat_belanja' },
        { kw: ['nonton', 'bioskop', 'game', 'netflix', 'spotify', 'nongkrong', 'karaoke', 'liburan', 'healing'], catId: 'cat_hiburan' }
      ];

      for (const rule of rules) {
        if (rule.kw.some((k) => lower.includes(k))) {
          const exists = appState.categories.find((c) => c.id === rule.catId);
          if (exists) return { type: 'expense', categoryId: exists.id };
        }
      }

      const defaultExp = appState.categories.find((c) => c.type === 'expense') || appState.categories[0];
      return { type: 'expense', categoryId: defaultExp.id };
    }

    function parseSmartTransactions(rawInput) {
      const segments = String(rawInput || '')
        .split(/(?:,|\bdan\b|\bsama\b|\bterus\b|\blalu\b|\n)/i)
        .map((s) => s.trim())
        .filter(Boolean);

      const todayISO = toISODate(new Date());
      const results = [];

      segments.forEach((seg) => {
        const amount = parseIndonesianAmount(seg);
        if (amount > 0) {
          const cleanNote = seg
            .replace(/rp\.?\s*\d+(?:[.,]\d+)?\s*(?:jt|juta|rb|ribu|k)?/gi, '')
            .replace(/\b\d+(?:[.,]\d+)?\s*(?:jt|juta|rb|ribu|k)?\b/gi, '')
            .replace(/\b(?:seceng|goceng|ceban|goban|cepek|gopek|setengah juta)\b/gi, '')
            .trim();
          const finalNote = cleanNote
            ? cleanNote.charAt(0).toUpperCase() + cleanNote.slice(1)
            : 'Transaksi Cepat';
          const guessed = guessCategoryAndType(seg);

          results.push({
            id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            type: guessed.type,
            amount,
            categoryId: guessed.categoryId,
            date: todayISO,
            note: finalNote,
            receiptImage: ''
          });
        }
      });

      return results;
    }

    /**
     * ============================================================================
     * 7. METRIK SIKLUS GAJIAN & PEMBANDING "SETARA KALO BELI APA?"
     * ============================================================================
     */
    function getCycleMetrics(cycleKey) {
      const range = getCycleRange(cycleKey);
      const txs = appState.transactions
        .filter((t) => t.date >= range.startISO && t.date <= range.endISO)
        .sort((a, b) => b.date.localeCompare(a.date));

      const income = txs.filter((t) => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0);
      const expense = txs.filter((t) => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);
      const balance = income - expense;

      const catTotals = {};
      txs.filter((t) => t.type === 'expense').forEach((t) => {
        catTotals[t.categoryId] = (catTotals[t.categoryId] || 0) + Number(t.amount || 0);
      });

      let topCategory = null;
      let topAmount = 0;
      Object.entries(catTotals).forEach(([cid, amt]) => {
        if (amt > topAmount) {
          topAmount = amt;
          topCategory = appState.categories.find((c) => c.id === cid) || { name: 'Lainnya', icon: 'wallet', color: '#127084' };
        }
      });

      const prevKey = getPreviousCycleKey(cycleKey);
      const prevRange = getCycleRange(prevKey);
      const prevExpense = appState.transactions
        .filter((t) => t.type === 'expense' && t.date >= prevRange.startISO && t.date <= prevRange.endISO)
        .reduce((s, t) => s + Number(t.amount || 0), 0);

      let diffPercent = null;
      if (prevExpense > 0) {
        diffPercent = Math.floor(((expense - prevExpense) / prevExpense) * 100);
      }

      return {
        range,
        txs,
        income,
        expense,
        balance,
        catTotals,
        topCategory,
        topAmount,
        prevExpense,
        diffPercent
      };
    }

    function initLaporanChart() {
      const canvas = document.getElementById('cuan-flow-chart');
      if (!canvas || !window.Chart) return;
      if (activeChart) {
        activeChart.destroy();
      }

      const metrics = getCycleMetrics(uiState.selectedCycleKey);
      const brandHex = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#127084';

      let labels = [];
      let incomeData = [];
      let expenseData = [];

      if (uiState.chartMode === 'weekly') {
        labels = ['Minggu 1', 'Minggu 2', 'Minggu 3', 'Minggu 4+'];
        incomeData = [0, 0, 0, 0];
        expenseData = [0, 0, 0, 0];

        metrics.txs.forEach((tx) => {
          const d = parseISODate(tx.date);
          const diffDays = Math.max(0, Math.floor((d - metrics.range.startDate) / 86400000));
          const wIdx = Math.min(3, Math.floor(diffDays / 7));
          if (tx.type === 'income') incomeData[wIdx] += Number(tx.amount || 0);
          else expenseData[wIdx] += Number(tx.amount || 0);
        });
      } else {
        const cursor = new Date(metrics.range.startDate);
        const allDays = [];
        while (cursor <= metrics.range.endDate) {
          allDays.push(toISODate(cursor));
          cursor.setDate(cursor.getDate() + 1);
        }
        const sliceDays = allDays.slice(0, 10);
        labels = sliceDays.map((iso) => {
          const d = parseISODate(iso);
          return `${d.getDate()}/${d.getMonth() + 1}`;
        });
        incomeData = sliceDays.map((iso) =>
          metrics.txs.filter((t) => t.date === iso && t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0)
        );
        expenseData = sliceDays.map((iso) =>
          metrics.txs.filter((t) => t.date === iso && t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0)
        );
      }

      activeChart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Cuan Masuk', data: incomeData, backgroundColor: '#10B981', borderRadius: 6 },
            { label: 'Cuan Keluar', data: expenseData, backgroundColor: brandHex, borderRadius: 6 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { boxWidth: 10, font: { size: 11, family: 'Plus Jakarta Sans' } } }
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 } } },
            y: {
              ticks: {
                font: { size: 10 },
                callback: (v) => (v >= 1000 ? v / 1000 + 'rb' : v)
              }
            }
          }
        }
      });
    }

    function setDraftTxType(type) {
      activeModalTxDraft.type = type;
      const firstCat = appState.categories.find((c) => c.type === type);
      if (firstCat) activeModalTxDraft.categoryId = firstCat.id;
      renderTransactionModal('manual');
    }

    function handleAmountInput(inputEl) {
      const numeric = parseRupiahInput(inputEl.value);
      activeModalTxDraft.amount = numeric;
      inputEl.value = numeric ? numeric.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
    }

    function saveTransactionForm(e) {
      e.preventDefault();
      const amount = Number(activeModalTxDraft.amount || 0);
      if (amount <= 0) {
        showToast('Masukkan nominal transaksi lebih dari Rp 0', 'warning');
        return;
      }

      const dateVal = document.getElementById('tx-date-input')?.value || activeModalTxDraft.date || toISODate(new Date());
      const noteVal = document.getElementById('tx-note-input')?.value.trim() || '';
      const cat = appState.categories.find((c) => c.id === activeModalTxDraft.categoryId);

      if (activeModalTxDraft.id) {
        const idx = appState.transactions.findIndex((t) => t.id === activeModalTxDraft.id);
        if (idx !== -1) {
          appState.transactions[idx] = {
            ...appState.transactions[idx],
            type: activeModalTxDraft.type,
            amount,
            categoryId: activeModalTxDraft.categoryId,
            date: dateVal,
            note: noteVal || cat?.name || 'Transaksi'
          };
        }
        showToast('✅ Transaksi berhasil diperbarui!', 'success');
      } else {
        appState.transactions.unshift({
          id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          type: activeModalTxDraft.type,
          amount,
          categoryId: activeModalTxDraft.categoryId,
          date: dateVal,
          note: noteVal || cat?.name || 'Transaksi',
          receiptImage: activeModalTxDraft.receiptImage || ''
        });
        showToast('🎉 Transaksi berhasil dicatat!', 'success');
      }

      const txCycleKey = findCycleKeyForDate(parseISODate(dateVal));
      uiState.selectedCycleKey = txCycleKey;
      saveState();
      if (activeModalTxDraft.type === 'expense') {
        checkCategoryBudgetAlert(activeModalTxDraft.categoryId, txCycleKey);
      }
      closeModal();
      renderApp();
    }

    function openDeleteConfirmModal(txId) {
      const tx = appState.transactions.find((t) => t.id === txId);
      if (!tx) return;
      const root = document.getElementById('modal-root');
      if (!root) return;

      root.innerHTML = `
        <div class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
          <div class="bg-white w-full max-w-[380px] rounded-3xl p-5 shadow-2xl space-y-4 text-center">
            <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto">
              ${getAppIcon('trash', 'w-6 h-6')}
            </div>
            <div>
              <h3 class="text-base font-extrabold text-slate-900">Hapus Transaksi Ini?</h3>
              <p class="text-xs text-slate-500 mt-1">
                <b>${escapeHtml(tx.note || 'Transaksi')}</b> (${formatRupiah(tx.amount)}) akan dihapus permanen.
              </p>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="closeModal()" class="bg-slate-100 text-slate-700 text-xs font-extrabold py-3 rounded-2xl">Batal</button>

            </div>

    function executeDeleteTransaction(txId) {
      appState.transactions = appState.transactions.filter((t) => t.id !== txId);

      closeModal();
      renderApp();
      showToast('🗑️ Transaksi berhasil dihapus.', 'info');

    function openReceiptPreview(txId) {
      const tx = appState.transactions.find((t) => t.id === txId);
      if (!tx || !tx.receiptImage) return;
      const root = document.getElementById('modal-root');
      if (!root) return;

      root.innerHTML = `
        <div class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
          <div class="bg-white w-full max-w-[420px] rounded-3xl p-4 shadow-2xl space-y-3">

              <h3 class="text-sm font-extrabold text-slate-900">Bukti Struk: ${escapeHtml(tx.note)}</h3>

          </div>
        </div>
      `;
    }

    function toggleVoiceRecording() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('Browser ini belum mendukung pengenalan suara. Gunakan tombol Simulasi Suara atau Catat AI.', 'warning');
        return;
      }

      if (isListeningVoice && voiceRecognitionInstance) {
        voiceRecognitionInstance.stop();
        isListeningVoice = false;
        renderTransactionModal('voice');
        return;
      }

      voiceRecognitionInstance = new SpeechRecognition();
      voiceRecognitionInstance.lang = 'id-ID';
      voiceRecognitionInstance.interimResults = false;
      voiceRecognitionInstance.maxAlternatives = 1;

      voiceRecognitionInstance.onstart = () => {
        isListeningVoice = true;
        renderTransactionModal('voice');
      };

      voiceRecognitionInstance.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        voiceTranscriptText = transcript;
        voiceDraftItems = parseSmartTransactions(transcript);
        isListeningVoice = false;
        renderTransactionModal('voice');
      };

      voiceRecognitionInstance.onerror = () => {
        isListeningVoice = false;
        renderTransactionModal('voice');

    function handleReceiptFileUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 720;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.72);

          const cleanName = file.name.replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ').trim();
          const detectedAmt = parseIndonesianAmount(cleanName) || 45000;
          const guessed = guessCategoryAndType(cleanName || 'belanja');

          scanDraftResult = {
            receiptImage: compressedDataUrl,
            amount: detectedAmt,
            note: cleanName ? cleanName.slice(0, 36) : 'Struk Pembayaran QRIS',
            categoryId: guessed.categoryId,
            date: toISODate(new Date())
          };
          renderTransactionModal('scan');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveScannedReceiptTransaction() {
      if (!scanDraftResult || Number(scanDraftResult.amount) <= 0) {
        showToast('Pastikan nominal struk terisi valid.', 'warning');
        return;
      }
      appState.transactions.unshift({
        id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        type: 'expense',
        amount: Number(scanDraftResult.amount),
        categoryId: scanDraftResult.categoryId,
        date: scanDraftResult.date,
        note: scanDraftResult.note || 'Struk Pembayaran',
        receiptImage: scanDraftResult.receiptImage
      });
      const cycleKey = findCycleKeyForDate(parseISODate(scanDraftResult.date));
      uiState.selectedCycleKey = cycleKey;
      saveState();
      checkCategoryBudgetAlert(scanDraftResult.categoryId, cycleKey);
      closeModal();
      renderApp();
      showToast('📸 Transaksi & bukti struk tersimpan!', 'success');
    }

            btn.textContent = 'Kirim Link Reset Sandi';

    async function submitEmailAuthForm(e) {
      e.preventDefault();
      if (!supabaseClient) {
        showToast('Layanan cloud belum siap. Muat ulang halaman lalu coba lagi.', 'danger');
        return;
      }

      const email = document.getElementById('auth-email')?.value.trim();
      const password = document.getElementById('auth-password')?.value || '';
      const fullName = document.getElementById('auth-name')?.value.trim() || '';
      const btn = document.getElementById('auth-submit-btn');

      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Memproses...';
      }

      try {
        if (authFormMode === 'forgot') {
          const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/'
          });
          if (error) throw error;
          uiState.resetCooldownUntil = Date.now() + 60000;
          showToast('📩 Link reset sandi terkirim! Cek inbox atau folder spam emailmu.', 'success');
          openAuthOrProfileModal();
          return;
        }

        if (authFormMode === 'register') {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullName || email.split('@')[0] } }
          });
          if (error) throw error;
          if (fullName) appState.userName = fullName;
          saveState(false);

          if (data?.session?.user) {
            currentUser = data.session.user;
            await syncUserDataToCloud();
            closeModal();
            renderApp();
            showToast('🎉 Akun berhasil dibuat & tersinkron!', 'success');
          } else {
            showToast('📩 Pendaftaran berhasil! Silakan cek email atau langsung Masuk.', 'success');
            authFormMode = 'login';
            openAuthOrProfileModal();
          }
          return;
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentUser = data.user;
        await loadUserDataFromCloud();
        closeModal();
        renderApp();
        showToast('👋 Berhasil masuk ke akun Cuan!', 'success');
      } catch (err) {
        const friendly = translateAuthError(err.message);
        showToast(friendly, 'danger');
        if (authFormMode === 'forgot') {
          openAuthOrProfileModal();
        } else if (btn) {
          btn.disabled = false;
          btn.textContent = authFormMode === 'login' ? 'Masuk Sekarang' : 'Buat Akun & Sinkronkan';
        }
      }
    }

    function goToTourStep(stepIndex) {
      uiState.tourStep = stepIndex;
      cancelAnimationFrame(tourScrollWatcher);

      const root = document.getElementById('tour-root');
      if (!root) return;

      if (uiState.tourStep < 0 || uiState.tourStep >= TOUR_STEPS.length) {
        root.innerHTML = '';
        localStorage.setItem(TOUR_SEEN_KEY, '1');
        return;
      }

      const step = TOUR_STEPS[uiState.tourStep];
      const targetEl = document.getElementById(step.targetId) || (step.fallbackTargetId ? document.getElementById(step.fallbackTargetId) : null);

      if (targetEl && !targetEl.closest('nav')) {
        const rect = targetEl.getBoundingClientRect();
        const isOutOfView = rect.top < 16 || rect.bottom > window.innerHeight - 96;
        if (isOutOfView) {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          let lastY = window.scrollY;
          let stableFrames = 0;
          const waitScrollSettle = () => {
            if (Math.abs(window.scrollY - lastY) < 1) {
              stableFrames++;
            } else {
              stableFrames = 0;
              lastY = window.scrollY;
            }
            if (stableFrames >= 4) {
              renderSpotlightTourStep();
            } else {
              tourScrollWatcher = requestAnimationFrame(waitScrollSettle);
            }
          };
          tourScrollWatcher = requestAnimationFrame(waitScrollSettle);
          return;
        }
      }

      renderSpotlightTourStep();
    }

    function renderSpotlightTourStep() {
      const root = ensureTourShellDOM();
      if (!root) return;

      if (uiState.tourStep < 0 || uiState.tourStep >= TOUR_STEPS.length) {
        root.innerHTML = '';
        localStorage.setItem(TOUR_SEEN_KEY, '1');
        return;
      }

      const step = TOUR_STEPS[uiState.tourStep];
      const targetEl = document.getElementById(step.targetId) || (step.fallbackTargetId ? document.getElementById(step.fallbackTargetId) : null);
      const shell = document.getElementById('app-shell');
      const shellRect = shell
        ? shell.getBoundingClientRect()
        : { left: 0, right: window.innerWidth, width: window.innerWidth };

      const cardWidth = Math.max(260, Math.min(shellRect.width - 24, 420));
      const cardLeft = Math.round(shellRect.left + (shellRect.width - cardWidth) / 2);

      const spotBox = document.getElementById('tour-spotlight-box');
      const fallbackBg = document.getElementById('tour-backdrop-fallback');
      const cardEl = document.getElementById('tour-popup-card');

      document.getElementById('tour-step-badge').textContent = `Panduan ${uiState.tourStep + 1} / ${TOUR_STEPS.length}`;
      document.getElementById('tour-step-title').textContent = step.title;
      document.getElementById('tour-step-desc').textContent = step.desc;

      const prevBtn = document.getElementById('tour-prev-btn');
      prevBtn.onclick = () => goToTourStep(Math.max(0, uiState.tourStep - 1));
      prevBtn.classList.toggle('invisible', uiState.tourStep === 0);

      const nextBtn = document.getElementById('tour-next-btn');
      nextBtn.onclick = () => goToTourStep(uiState.tourStep + 1);
      nextBtn.textContent = uiState.tourStep === TOUR_STEPS.length - 1 ? 'Siap Pakai!' : 'Lanjut →';

      let targetBounds = null;
      if (targetEl && spotBox) {
        fallbackBg?.classList.add('hidden');
        spotBox.classList.remove('hidden');

        const rect = targetEl.getBoundingClientRect();
        const pad = 6;
        const boxLeft = Math.max(shellRect.left + 6, rect.left - pad);
        const boxRight = Math.min(shellRect.right - 6, rect.right + pad);
        const boxTop = Math.max(6, rect.top - pad);
        const boxBottom = Math.min(window.innerHeight - 6, rect.bottom + pad);
        const boxWidth = Math.max(28, boxRight - boxLeft);
        const boxHeight = Math.max(28, boxBottom - boxTop);

        targetBounds = { top: boxTop, bottom: boxBottom };
        spotBox.style.top = `${Math.round(boxTop)}px`;
        spotBox.style.left = `${Math.round(boxLeft)}px`;
        spotBox.style.width = `${Math.round(boxWidth)}px`;
        spotBox.style.height = `${Math.round(boxHeight)}px`;
      } else {
        spotBox?.classList.add('hidden');
        fallbackBg?.classList.remove('hidden');
      }

      if (cardEl) {
        cardEl.style.left = `${cardLeft}px`;
        cardEl.style.width = `${cardWidth}px`;

        const cardH = cardEl.offsetHeight || 175;
        const vh = window.innerHeight;
        let cardTop = Math.round((vh - cardH) / 2);

        if (targetBounds) {
          const spaceBelow = vh - targetBounds.bottom - 14;
          const spaceAbove = targetBounds.top - 14;

          if (spaceBelow >= cardH + 12) {
            cardTop = targetBounds.bottom + 14;
          } else if (spaceAbove >= cardH + 12) {
            cardTop = targetBounds.top - cardH - 14;
          } else {
            cardTop = spaceAbove > spaceBelow
              ? targetBounds.top - cardH - 10
              : targetBounds.bottom + 10;
          }
        }

        cardTop = Math.max(12, Math.min(vh - cardH - 12, Math.round(cardTop)));
        cardEl.style.top = `${cardTop}px`;
      }
    }

      renderApp();
      showToast('✨ Data simulasi berhasil dimuat ke siklus aktif & siklus lalu!', 'success');
    }

    function exportTransactionsCSV() {
      const metrics = getCycleMetrics(uiState.selectedCycleKey);
      if (!metrics.txs.length) {
        showToast('Belum ada transaksi di siklus ini untuk diunduh.', 'warning');
        return;
      }

      const rows = [['Tanggal', 'Tipe', 'Kategori', 'Catatan', 'Nominal']];
      metrics.txs.forEach((tx) => {
        const cat = appState.categories.find((c) => c.id === tx.categoryId);
        const safeNote = `"${String(tx.note || '').replace(/"/g, '""')}"`;
        const safeCat = `"${String(cat?.name || 'Umum').replace(/"/g, '""')}"`;
        rows.push([
          tx.date,
          tx.type === 'income' ? 'Cuan Masuk' : 'Cuan Keluar',
          safeCat,
          safeNote,
          tx.amount
        ]);
      });

      const csvContent = 'data:text/csv;charset=utf-8,' + rows.map((r) => r.join(',')).join('\n');
      const link = document.createElement('a');
      link.setAttribute('href', encodeURI(csvContent));
      link.setAttribute('download', `Laporan_Cuan_${uiState.selectedCycleKey}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast('📥 File CSV laporan berhasil diunduh!', 'success');
    }

    function downloadBackupJSON() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(appState, null, 2));
      const link = document.createElement('a');
      link.setAttribute('href', dataStr);
      link.setAttribute('download', `Backup_Cuan_${toISODate(new Date())}.json`);
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast('💾 File backup JSON berhasil diunduh!', 'success');
    }

    function restoreBackupJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.transactions)) {
            throw new Error('Format file backup tidak valid.');
          }
          appState = { ...appState, ...parsed };
          applyTheme(appState.themeId);
          saveState();
          renderApp();
          showToast('📂 Data berhasil dipulihkan dari backup!', 'success');
        } catch (err) {
          showToast('Gagal memulihkan file JSON: ' + err.message, 'danger');
        }
      };
      reader.readAsText(file);
    }

    function toggleReminderSetting(enabled) {
      appState.reminderEnabled = enabled;
      saveState();
      if (enabled && 'Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      showToast(enabled ? '⏰ Pengingat harian diaktifkan' : 'Pengingat harian dimatikan', 'info');
    }

    /**
     * ============================================================================
     * 15. INISIALISASI GESTUR LONG-PRESS FAB (+), PWA & BOOTSTRAP APLIKASI
     * ============================================================================
     */
    function initFabLongPress() {
      const fab = document.getElementById('fab-add-btn');
      if (!fab) return;

      let pressTimer = null;
      let longPressTriggered = false;

      const startPress = (e) => {
        if (e.type === 'mousedown' && e.button !== 0) return;
        longPressTriggered = false;
        fab.classList.add('pressing');

        pressTimer = setTimeout(() => {
          longPressTriggered = true;
          fab.classList.remove('pressing');
          if (navigator.vibrate) navigator.vibrate(40);
          openAddTransactionModal('voice');
        }, 420);
      };

      const endPress = (e) => {
        clearTimeout(pressTimer);
        fab.classList.remove('pressing');
        if (!longPressTriggered && e.type !== 'mouseleave' && e.type !== 'touchcancel') {
          openAddTransactionModal('manual');
        }
      };

      fab.addEventListener('touchstart', startPress, { passive: true });
      fab.addEventListener('touchend', endPress);
      fab.addEventListener('touchcancel', endPress);
      fab.addEventListener('mousedown', startPress);
      fab.addEventListener('mouseup', endPress);
      fab.addEventListener('mouseleave', () => {
        clearTimeout(pressTimer);
        fab.classList.remove('pressing');
      });
    }

    function initPwaAndServiceWorker() {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          swRegistration = reg;
          if (reg.waiting) {
            document.getElementById('update-banner')?.classList.remove('hidden');
          }
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                document.getElementById('update-banner')?.classList.remove('hidden');
              }
            });
          });
        }).catch((err) => console.warn('SW registration skipped:', err));
      }
    }

    async function bootCuanApp() {
      loadLocalState();
      renderApp();
      initFabLongPress();
      initPwaAndServiceWorker();
      startReminderScheduler();
      await initSupabase();

      if (!localStorage.getItem(TOUR_SEEN_KEY)) {
        setTimeout(() => startSpotlightTour(), 650);
      }
    }

    document.addEventListener('DOMContentLoaded', bootCuanApp);
  </script>
</body>
