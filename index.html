<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cuan" />
  <title>Cuan — Catatan Keuangan & Siklus Gajian</title>

  <!-- PWA Manifest & Icons (Minimalist White Gen-Z Icon) -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: 'var(--brand)',
              dark: 'var(--brand-dark)',
              darker: 'var(--brand-darker)',
              tint: 'var(--brand-tint)',
            }
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --brand: #127084;
      --brand-dark: #0E5A6A;
      --brand-darker: #0B4F5E;
      --brand-tint: #E6F3F6;
      --brand-rgb: 18, 112, 132;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #EBF0F2;
      color: #0F172A;
      margin: 0;
      padding: 0;
      overscroll-behavior-y: contain;
    }

    /* Mobile-First App Shell */
    #app-shell {
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      background-color: #F4F7F8;
      position: relative;
      box-shadow: 0 0 40px rgba(15, 23, 42, 0.08);
      padding-bottom: 92px;
      overflow-x: hidden;
    }

    /* Curved Hero Header */
    .hero-gradient {
      background: linear-gradient(155deg, var(--brand) 0%, var(--brand-dark) 58%, var(--brand-darker) 100%);
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
    }

    /* Custom Scrollbar Hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Bottom Sheet & Modal Transitions */
    .modal-backdrop {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      animation: fadeIn 0.2s ease-out;
    }

    .bottom-sheet {
      animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Voice Pulse Animation */
    @keyframes pulseRing {
      0% { transform: scale(0.92); opacity: 0.8; }
      70% { transform: scale(1.35); opacity: 0; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    .voice-pulse::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 9999px;
      background: var(--brand);
      animation: pulseRing 1.5s infinite;
      z-index: 0;
    }

    /* Laser Scan Animation */
    @keyframes laserScan {
      0%, 100% { top: 8%; }
      50% { top: 88%; }
    }
    .scan-laser {
      position: absolute;
      left: 6%;
      right: 6%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #10B981, #FFFFFF, #10B981, transparent);
      box-shadow: 0 0 12px #10B981;
      animation: laserScan 2s ease-in-out infinite;
    }

    /* Long-Press FAB Ring */
    .fab-btn {
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    .fab-btn:active, .fab-btn.pressing {
      transform: scale(0.92);
    }

    /* Spotlight Tour Highlight */
    .tour-highlight-box {
      position: fixed;
      border-radius: 18px;
      box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.72), 0 0 0 4px #FFFFFF, 0 0 24px rgba(255, 255, 255, 0.5);
      z-index: 90;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>

  <script>
    /**
     * ============================================================================
     * 1. KONFIGURASI SUPABASE & PENGUMUMAN DEVELOPER (HANN)
     * ============================================================================
     */
    const SUPABASE_CONFIG = {
      url: 'https://nbzlnyrtpnfsiaeqdcrz.supabase.co',
      anonKey: 'sb_publishable_-4i05ZsjNBvlLE02KDoPxQ_5cMdtpRE'
    };

    // Tambahkan pengumuman di sini kapan saja lalu push ke GitHub agar muncul di lonceng semua user
    const DEVELOPER_ANNOUNCEMENTS = [
      {
        id: 'ann_v23_release',
        title: 'Fitur Baru Cuan v2.3 ✨',
        message: 'Sekarang kamu bisa edit transaksi kapan saja, tahan tombol + untuk catat suara, ganti tema warna, & pantau siklus gajian otomatis!',
        time: 'Info Developer'
      }
    ];

    const ACCENT_THEMES = [
      { id: 'teal', name: 'Deep Teal', brand: '#127084', dark: '#0E5A6A', darker: '#0B4F5E', tint: '#E6F3F6' },
      { id: 'emerald', name: 'Emerald Mint', brand: '#0D8A6A', dark: '#0A6E54', darker: '#075440', tint: '#E4F6F1' },
      { id: 'indigo', name: 'Royal Indigo', brand: '#4F46E5', dark: '#4338CA', darker: '#3730A3', tint: '#EEF2FF' },
      { id: 'ocean', name: 'Ocean Blue', brand: '#0284C7', dark: '#0369A1', darker: '#075985', tint: '#E0F2FE' },
      { id: 'rose', name: 'Berry Rose', brand: '#E11D48', dark: '#BE123C', darker: '#9F1239', tint: '#FFE4E6' },
      { id: 'amber', name: 'Sunset Gold', brand: '#D97706', dark: '#B45309', darker: '#92400E', tint: '#FEF3C7' }
    ];

    const STORAGE_KEY = 'cuan_pwa_prod_state_v2';
    const TOUR_SEEN_KEY = 'cuan_tour_completed_v2';
    const INSTALL_DISMISSED_KEY = 'cuan_install_banner_dismissed_v1';

    let supabaseClient = null;
    let currentUser = null;
    let syncTimeout = null;
    let deferredInstallPrompt = null;
    let swRegistration = null;
    let activeChart = null;

    /**
     * ============================================================================
     * 2. STATE APLIKASI & DATA DEFAULT
     * ============================================================================
     */
    const DEFAULT_CATEGORIES = [
      { id: 'cat_gaji', name: 'Gaji & Bonus', icon: '💼', type: 'income', color: '#10B981', budgetLimit: 0 },
      { id: 'cat_freelance', name: 'Cuan Sampingan', icon: '🚀', type: 'income', color: '#059669', budgetLimit: 0 },
      { id: 'cat_makan', name: 'Makan & Ngopi', icon: '🍜', type: 'expense', color: '#127084', budgetLimit: 1500000 },
      { id: 'cat_transport', name: 'Transport & Ojol', icon: '🛵', type: 'expense', color: '#0284C7', budgetLimit: 600000 },
      { id: 'cat_tagihan', name: 'Kos & Tagihan', icon: '⚡', type: 'expense', color: '#7C3AED', budgetLimit: 1800000 },
      { id: 'cat_belanja', name: 'Belanja & Lifestyle', icon: '🛍️', type: 'expense', color: '#E11D48', budgetLimit: 800000 },
      { id: 'cat_hiburan', name: 'Hiburan & Nongkrong', icon: '🎮', type: 'expense', color: '#D97706', budgetLimit: 500000 }
    ];

    let appState = {
      userName: 'Sobat Cuan',
      defaultPayday: 30, // Default tanggal gajian tanggal 30
      monthlyPaydays: {}, // Contoh: { '2026-10': 30, '2026-11': 30 }
      categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
      transactions: [],
      notifications: [],
      reminderEnabled: true,
      reminderTime: '20:00',
      lastReminderDate: '',
      themeId: 'teal',
      hideBalance: false
    };

    let uiState = {
      activeTab: 'beranda',
      selectedCycleKey: '', // Format 'YYYY-MM' (bulan mulai siklus)
      txSearch: '',
      txFilter: 'all', // 'all' | 'expense' | 'income'
      chartMode: 'daily', // 'daily' | 'weekly'
      syncStatus: 'local', // 'local' | 'syncing' | 'synced' | 'error'
      tourStep: -1 // -1 = inactive, 0..4 = active step
    };

    /**
     * ============================================================================
     * 3. UTILITAS TANGGAL, FORMAT RUPIAH & SIKLUS GAJIAN DINAMIS
     * ============================================================================
     */
    const MONTH_NAMES_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const MONTH_NAMES_FULL = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const DAY_NAMES = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

    function formatRupiah(num) {
      const n = Math.round(Number(num) || 0);
      const prefix = n < 0 ? '-Rp ' : 'Rp ';
      return prefix + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function parseRupiahInput(str) {
      return Number(String(str || '').replace(/[^\d]/g, '')) || 0;
    }

    function formatTodayHeader() {
      const now = new Date();
      return `${DAY_NAMES[now.getDay()]}, ${now.getDate()} ${MONTH_NAMES_SHORT[now.getMonth()]} ${now.getFullYear()}`;
    }

    function toISODate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseISODate(isoStr) {
      const [y, m, d] = (isoStr || toISODate(new Date())).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function getDaysInMonth(year, monthIndex0) {
      return new Date(year, monthIndex0 + 1, 0).getDate();
    }

    function getPaydayForYearMonth(year, monthIndex0) {
      const ym = `${year}-${String(monthIndex0 + 1).padStart(2, '0')}`;
      const rawDay = appState.monthlyPaydays && appState.monthlyPaydays[ym]
        ? Number(appState.monthlyPaydays[ym])
        : Number(appState.defaultPayday || 30);
      const maxDays = getDaysInMonth(year, monthIndex0);
      return Math.min(Math.max(1, rawDay), maxDays);
    }

    // Menghitung rentang tanggal siklus berdasarkan 'YYYY-MM' (bulan mulai siklus)
    function getCycleRange(cycleKey) {
      const [y, m] = cycleKey.split('-').map(Number);
      const m0 = m - 1;
      const startDay = getPaydayForYearMonth(y, m0);
      const startDate = new Date(y, m0, startDay);

      // Bulan berikutnya
      const nextDateObj = new Date(y, m0 + 1, 1);
      const ny = nextDateObj.getFullYear();
      const nm0 = nextDateObj.getMonth();
      const nextPayday = getPaydayForYearMonth(ny, nm0);
      const endDate = new Date(ny, nm0, nextPayday - 1);

      const label = `${startDate.getDate()} ${MONTH_NAMES_SHORT[startDate.getMonth()]} – ${endDate.getDate()} ${MONTH_NAMES_SHORT[endDate.getMonth()]}`;
      const fullLabel = `${startDate.getDate()} ${MONTH_NAMES_SHORT[startDate.getMonth()]} ${startDate.getFullYear()} – ${endDate.getDate()} ${MONTH_NAMES_SHORT[endDate.getMonth()]} ${endDate.getFullYear()}`;

      return {
        key: cycleKey,
        startDate,
        endDate,
        startISO: toISODate(startDate),
        endISO: toISODate(endDate),
        label,
        fullLabel
      };
    }

    // Menemukan cycleKey ('YYYY-MM') yang menaungi suatu tanggal tertentu
    function findCycleKeyForDate(dateObj) {
      const iso = toISODate(dateObj);
      const y = dateObj.getFullYear();
      const m0 = dateObj.getMonth();

      const currentMonthKey = `${y}-${String(m0 + 1).padStart(2, '0')}`;
      const currentCycle = getCycleRange(currentMonthKey);
      if (iso >= currentCycle.startISO && iso <= currentCycle.endISO) {
        return currentMonthKey;
      }

      if (iso < currentCycle.startISO) {
        const prev = new Date(y, m0 - 1, 1);
        return `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;
      } else {
        const next = new Date(y, m0 + 1, 1);
        return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}`;
      }
    }

    // Menghasilkan daftar pilihan siklus HANYA dari data transaksi di database + siklus aktif hari ini
    function getAvailableCycles() {
      const todayCycleKey = findCycleKeyForDate(new Date());
      const keysSet = new Set([todayCycleKey]);

      (appState.transactions || []).forEach((tx) => {
        if (tx.date) {
          const ck = findCycleKeyForDate(parseISODate(tx.date));
          keysSet.add(ck);
        }
      });

      const sortedKeys = Array.from(keysSet).sort((a, b) => b.localeCompare(a));
      return sortedKeys.map((k) => {
        const range = getCycleRange(k);
        return {
          ...range,
          isActiveToday: k === todayCycleKey
        };
      });
    }

    function getPreviousCycleKey(cycleKey) {
      const [y, m] = cycleKey.split('-').map(Number);
      const prev = new Date(y, m - 2, 1);
      return `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /**
     * ============================================================================
     * 4. PERSISTENSI LOKAL, SUPABASE AUTH & CLOUD SYNC
     * ============================================================================
     */
    function applyTheme(themeId) {
      const theme = ACCENT_THEMES.find((t) => t.id === themeId) || ACCENT_THEMES[0];
      appState.themeId = theme.id;
      document.documentElement.style.setProperty('--brand', theme.brand);
      document.documentElement.style.setProperty('--brand-dark', theme.dark);
      document.documentElement.style.setProperty('--brand-darker', theme.darker);
      document.documentElement.style.setProperty('--brand-tint', theme.tint);
      const metaTheme = document.getElementById('meta-theme-color');
      if (metaTheme) metaTheme.setAttribute('content', theme.brand);
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appState = {
            ...appState,
            ...parsed,
            categories: Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : appState.categories,
            transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
            notifications: Array.isArray(parsed.notifications) ? parsed.notifications : [],
            monthlyPaydays: parsed.monthlyPaydays || {}
          };
        }
      } catch (err) {
        console.error('Gagal memuat state lokal:', err);
      }
      applyTheme(appState.themeId);
      mergeDeveloperAnnouncements();

      const cycles = getAvailableCycles();
      if (!uiState.selectedCycleKey || !cycles.some((c) => c.key === uiState.selectedCycleKey)) {
        uiState.selectedCycleKey = findCycleKeyForDate(new Date());
      }
    }

    function mergeDeveloperAnnouncements() {
      const existingIds = new Set((appState.notifications || []).map((n) => n.id));
      DEVELOPER_ANNOUNCEMENTS.forEach((ann) => {
        if (!existingIds.has(ann.id)) {
          appState.notifications.unshift({
            id: ann.id,
            title: ann.title,
            message: ann.message,
            time: ann.time || 'Baru saja',
            read: false,
            type: 'dev'
          });
        }
      });
    }

    function saveState(triggerCloud = true) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.error('Gagal menyimpan state lokal:', err);
      }

      if (triggerCloud && currentUser && supabaseClient) {
        uiState.syncStatus = 'syncing';
        updateSyncBadgeOnly();
        clearTimeout(syncTimeout);
        syncTimeout = setTimeout(() => {
          syncUserDataToCloud();
        }, 800);
      }
    }

    function updateSyncBadgeOnly() {
      const el = document.getElementById('sync-status-pill');
      if (!el) return;
      if (!currentUser) {
        el.innerHTML = '📱 Mode Lokal';
      } else if (uiState.syncStatus === 'syncing') {
        el.innerHTML = '⏳ Menyinkronkan...';
      } else if (uiState.syncStatus === 'error') {
        el.innerHTML = '⚠️ Gagal Sync';
      } else {
        el.innerHTML = '☁️ Tersinkron';
      }
    }

    async function initSupabase() {
      try {
        if (!window.supabase || !SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey) return;
        supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          currentUser = session.user;
          await loadUserDataFromCloud();
        }

        supabaseClient.auth.onAuthStateChange(async (event, sessionObj) => {
          if (event === 'SIGNED_IN' && sessionObj?.user) {
            currentUser = sessionObj.user;
            if (!appState.userName || appState.userName === 'Sobat Cuan') {
              appState.userName = currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || 'Sobat Cuan';
            }
            await loadUserDataFromCloud();
            renderApp();
          } else if (event === 'SIGNED_OUT') {
            currentUser = null;
            uiState.syncStatus = 'local';
            renderApp();
          }
        });
      } catch (err) {
        console.error('Supabase init error:', err);
      }
    }

    async function loadUserDataFromCloud() {
      if (!supabaseClient || !currentUser) return;
      try {
        uiState.syncStatus = 'syncing';
        updateSyncBadgeOnly();

        const { data, error } = await supabaseClient
          .from('cuan_user_data')
          .select('payload')
          .eq('user_id', currentUser.id)
          .maybeSingle();

        if (error) throw error;

        if (data && data.payload && Object.keys(data.payload).length > 0) {
          appState = {
            ...appState,
            ...data.payload,
            categories: Array.isArray(data.payload.categories) && data.payload.categories.length ? data.payload.categories : appState.categories,
            transactions: Array.isArray(data.payload.transactions) ? data.payload.transactions : [],
            monthlyPaydays: data.payload.monthlyPaydays || {}
          };
          applyTheme(appState.themeId);
          mergeDeveloperAnnouncements();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));

          const cycles = getAvailableCycles();
          if (!cycles.some((c) => c.key === uiState.selectedCycleKey)) {
            uiState.selectedCycleKey = findCycleKeyForDate(new Date());
          }
        } else {
          // User baru pertama kali login: unggah data lokal saat ini ke cloud
          await syncUserDataToCloud();
        }

        uiState.syncStatus = 'synced';
        renderApp();
      } catch (err) {
        console.error('Load cloud error:', err);
        uiState.syncStatus = 'error';
        updateSyncBadgeOnly();
      }
    }

    async function syncUserDataToCloud() {
      if (!supabaseClient || !currentUser) return;
      try {
        const payload = {
          userName: appState.userName,
          defaultPayday: appState.defaultPayday,
          monthlyPaydays: appState.monthlyPaydays,
          categories: appState.categories,
          transactions: appState.transactions,
          notifications: appState.notifications,
          reminderEnabled: appState.reminderEnabled,
          reminderTime: appState.reminderTime,
          themeId: appState.themeId
        };

        const { error } = await supabaseClient
          .from('cuan_user_data')
          .upsert({
            user_id: currentUser.id,
            payload,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });

        if (error) throw error;
        uiState.syncStatus = 'synced';
        updateSyncBadgeOnly();
      } catch (err) {
        console.error('Sync cloud error:', err);
        uiState.syncStatus = 'error';
        updateSyncBadgeOnly();
      }
    }

    /**
     * ============================================================================
     * 6. PARSER SUARA & CATAT AI (BAHASA INDONESIA + SLANG GEN-Z)
     * ============================================================================
     */
    function parseIndonesianAmount(text) {
      let clean = text.toLowerCase().replace(/rp\.?/g, '').trim();

      // Slang nominal umum
      const slangMap = {
        'seceng': 1000,
        'goceng': 5000,
        'ceban': 10000,
        'goban': 50000,
        'cepek': 100000,
        'gopek': 500000
      };
      for (const [slang, val] of Object.entries(slangMap)) {
        if (clean.includes(slang)) return val;
      }

      if (clean.includes('setengah juta')) return 500000;

      // Pola angka langsung: 25k, 25rb, 25 ribu, 1.5jt, 1,5 juta, 25000
      const numMatch = clean.match(/(\d+(?:[.,]\d+)?)\s*(jt|juta|rb|ribu|k)?\b/);
      if (numMatch) {
        let numStr = numMatch[1];
        const unit = numMatch[2] || '';

        if (unit === 'jt' || unit === 'juta') {
          return Math.round(parseFloat(numStr.replace(',', '.')) * 1000000);
        }
        if (unit === 'rb' || unit === 'ribu' || unit === 'k') {
          return Math.round(parseFloat(numStr.replace(',', '.')) * 1000);
        }
        const digitsOnly = parseInt(numStr.replace(/[.,]/g, ''), 10);
        if (!isNaN(digitsOnly) && digitsOnly > 0) return digitsOnly;
      }

      // Konversi kata bilangan bahasa Indonesia sederhana
      const wordNums = {
        'satu': 1, 'se': 1, 'dua': 2, 'tiga': 3, 'empat': 4, 'lima': 5,
        'enam': 6, 'tujuh': 7, 'delapan': 8, 'sembilan': 9, 'sepuluh': 10,
        'sebelas': 11, 'dua belas': 12, 'lima belas': 15, 'dua puluh': 20,
        'dua puluh lima': 25, 'tiga puluh': 30, 'empat puluh': 40, 'lima puluh': 50,
        'seratus': 100, 'dua ratus': 200, 'tiga ratus': 300, 'lima ratus': 500
      };
      for (const [word, mult] of Object.entries(wordNums)) {
        if (clean.includes(word + ' juta')) return mult * 1000000;
        if (clean.includes(word + ' ribu')) return mult * 1000;
      }

      return 0;
    }

    function guessCategoryAndType(noteText) {
      const lower = noteText.toLowerCase();
      const incomeKeywords = ['gaji', 'bonus', 'thr', 'freelance', 'project', 'transfer masuk', 'dapat', 'cuan masuk', 'jual', 'komisi', 'dividen'];
      const isIncome = incomeKeywords.some((kw) => lower.includes(kw));

      if (isIncome) {
        const cat = lower.includes('gaji') || lower.includes('bonus')
          ? appState.categories.find((c) => c.id === 'cat_gaji')
          : appState.categories.find((c) => c.type === 'income');
        return { type: 'income', categoryId: cat ? cat.id : appState.categories[0].id };
      }

      const rules = [
        { kw: ['kopi', 'makan', 'nasi', 'ayam', 'bakso', 'mie', 'minum', 'boba', 'sarapan', 'lunch', 'dinner', 'jajan', 'cafe', 'warteg', 'gofood', 'grabfood'], catId: 'cat_makan' },
        { kw: ['ojol', 'gojek', 'grab', 'bensin', 'pertalite', 'pertamax', 'parkir', 'tol', 'kereta', 'krl', 'mrt', 'transjakarta', 'bus'], catId: 'cat_transport' },
        { kw: ['kos', 'listrik', 'token', 'air', 'wifi', 'internet', 'pulsa', 'kuota', 'tagihan', 'cicilan', 'bpjs'], catId: 'cat_tagihan' },
        { kw: ['baju', 'sepatu', 'skincare', 'shopee', 'tokopedia', 'lazada', 'beli', 'indomaret', 'alfamart', 'sabun'], catId: 'cat_belanja' },
        { kw: ['nonton', 'bioskop', 'game', 'netflix', 'spotify', 'nongkrong', 'karaoke', 'liburan', 'healing'], catId: 'cat_hiburan' }
      ];

      for (const rule of rules) {
        if (rule.kw.some((k) => lower.includes(k))) {
          const exists = appState.categories.find((c) => c.id === rule.catId);
          if (exists) return { type: 'expense', categoryId: exists.id };
        }
      }

      const defaultExp = appState.categories.find((c) => c.type === 'expense') || appState.categories[0];
      return { type: 'expense', categoryId: defaultExp.id };
    }

    function parseSmartTransactions(rawInput) {
      const segments = String(rawInput || '')
        .split(/(?:,|\bdan\b|\bsama\b|\bterus\b|\blalu\b|\n)/i)
        .map((s) => s.trim())
        .filter(Boolean);

      const todayISO = toISODate(new Date());
      const results = [];

      segments.forEach((seg) => {
        const amount = parseIndonesianAmount(seg);
        if (amount > 0) {
          const cleanNote = seg
            .replace(/rp\.?\s*\d+(?:[.,]\d+)?\s*(?:jt|juta|rb|ribu|k)?/gi, '')
            .replace(/\b\d+(?:[.,]\d+)?\s*(?:jt|juta|rb|ribu|k)?\b/gi, '')
            .replace(/\b(?:seceng|goceng|ceban|goban|cepek|gopek|setengah juta)\b/gi, '')
            .trim();
          const finalNote = cleanNote
            ? cleanNote.charAt(0).toUpperCase() + cleanNote.slice(1)
            : 'Transaksi Cepat';
          const guessed = guessCategoryAndType(seg);

          results.push({
            id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            type: guessed.type,
            amount,
            categoryId: guessed.categoryId,
            date: todayISO,
            note: finalNote,
            receiptImage: ''
          });
        }
      });

      return results;
    }

    /**
     * ============================================================================
     * 7. METRIK SIKLUS GAJIAN & PEMBANDING "SETARA KALO BELI APA?"
     * ============================================================================
     */
    function getCycleMetrics(cycleKey) {
      const range = getCycleRange(cycleKey);
      const txs = appState.transactions
        .filter((t) => t.date >= range.startISO && t.date <= range.endISO)
        .sort((a, b) => b.date.localeCompare(a.date));

      const income = txs.filter((t) => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0);
      const expense = txs.filter((t) => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);
      const balance = income - expense;

      // Kategori terboros
      const catTotals = {};
      txs.filter((t) => t.type === 'expense').forEach((t) => {
        catTotals[t.categoryId] = (catTotals[t.categoryId] || 0) + Number(t.amount || 0);
      });

      let topCategory = null;
      let topAmount = 0;
      Object.entries(catTotals).forEach(([cid, amt]) => {
        if (amt > topAmount) {
          topAmount = amt;
          topCategory = appState.categories.find((c) => c.id === cid) || { name: 'Lainnya', icon: '💸', color: '#127084' };
        }
      });

      // Perbandingan dengan siklus sebelumnya
      const prevKey = getPreviousCycleKey(cycleKey);
      const prevRange = getCycleRange(prevKey);
      const prevExpense = appState.transactions
        .filter((t) => t.type === 'expense' && t.date >= prevRange.startISO && t.date <= prevRange.endISO)
        .reduce((s, t) => s + Number(t.amount || 0), 0);

      let diffPercent = null;
      if (prevExpense > 0) {
        diffPercent = Math.floor(((expense - prevExpense) / prevExpense) * 100);
      }

      return {
        range,
        txs,
        income,
        expense,
        balance,
        catTotals,
        topCategory,
        topAmount,
        prevExpense,
        diffPercent
      };
    }

    function renderBudgetProgressList(metrics) {
      const expenseCats = appState.categories.filter((c) => c.type === 'expense');
      if (expenseCats.length === 0) {
        return `<p class="text-xs text-slate-500 text-center py-2">Belum ada kategori pengeluaran.</p>`;
      }

      return expenseCats.map((cat) => {
        const spent = metrics.catTotals[cat.id] || 0;
        const limit = Number(cat.budgetLimit || 0);
        const pct = limit > 0 ? Math.min(100, Math.round((spent / limit) * 100)) : 0;
        const rawPct = limit > 0 ? Math.round((spent / limit) * 100) : 0;

        let barColor = 'bg-brand';
        let statusText = limit > 0 ? `${rawPct}%` : 'Tanpa limit';
        if (limit > 0 && rawPct >= 100) {
          barColor = 'bg-rose-500';
          statusText = `Jebol (${rawPct}%)`;
        } else if (limit > 0 && rawPct >= 80) {
          barColor = 'bg-amber-500';
          statusText = `Waspada (${rawPct}%)`;
        }

        return `
          <div>
            <div class="flex items-center justify-between text-xs mb-1">
              <div class="flex items-center gap-2 font-bold text-slate-800">
                <span>${cat.icon}</span>
                <span>${escapeHtml(cat.name)}</span>
              </div>
              <div class="text-right">
                <span class="font-extrabold text-slate-900">${formatRupiah(spent)}</span>
                ${limit > 0 ? `<span class="text-slate-400 text-[11px]"> / ${formatRupiah(limit)}</span>` : ''}
              </div>
            </div>
            ${limit > 0 ? `
              <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                <div class="${barColor} h-full rounded-full transition-all duration-300" style="width: ${pct}%"></div>
              </div>
              <div class="flex justify-between text-[10px] text-slate-400 mt-0.5">
                <span>Sisa: ${formatRupiah(Math.max(0, limit - spent))}</span>
                <span class="font-semibold ${rawPct >= 100 ? 'text-rose-600' : (rawPct >= 80 ? 'text-amber-600' : 'text-slate-500')}">${statusText}</span>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function initLaporanChart() {
      const canvas = document.getElementById('cuan-flow-chart');
      if (!canvas || !window.Chart) return;
      if (activeChart) {
        activeChart.destroy();
      }

      const metrics = getCycleMetrics(uiState.selectedCycleKey);
      const brandHex = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#127084';

      let labels = [];
      let incomeData = [];
      let expenseData = [];

      if (uiState.chartMode === 'weekly') {
        labels = ['Minggu 1', 'Minggu 2', 'Minggu 3', 'Minggu 4+'];
        incomeData = [0, 0, 0, 0];
        expenseData = [0, 0, 0, 0];

        metrics.txs.forEach((tx) => {
          const d = parseISODate(tx.date);
          const diffDays = Math.max(0, Math.floor((d - metrics.range.startDate) / 86400000));
          const wIdx = Math.min(3, Math.floor(diffDays / 7));
          if (tx.type === 'income') incomeData[wIdx] += Number(tx.amount || 0);
          else expenseData[wIdx] += Number(tx.amount || 0);
        });
      } else {
        // 7 titik tanggal terbaru dalam siklus
        const cursor = new Date(metrics.range.startDate);
        const allDays = [];
        while (cursor <= metrics.range.endDate) {
          allDays.push(toISODate(cursor));
          cursor.setDate(cursor.getDate() + 1);
        }
        const sliceDays = allDays.slice(0, 10);
        labels = sliceDays.map((iso) => {
          const d = parseISODate(iso);
          return `${d.getDate()}/${d.getMonth() + 1}`;
        });
        incomeData = sliceDays.map((iso) =>
          metrics.txs.filter((t) => t.date === iso && t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0)
        );
        expenseData = sliceDays.map((iso) =>
          metrics.txs.filter((t) => t.date === iso && t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0)
        );
      }

      activeChart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Cuan Masuk', data: incomeData, backgroundColor: '#10B981', borderRadius: 6 },
            { label: 'Cuan Keluar', data: expenseData, backgroundColor: brandHex, borderRadius: 6 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { boxWidth: 10, font: { size: 11, family: 'Plus Jakarta Sans' } } }
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 } } },
            y: {
              ticks: {
                font: { size: 10 },
                callback: (v) => (v >= 1000 ? v / 1000 + 'rb' : v)
              }
            }
          }
        }
      });
    }

    function submitManualTransaction(e) {
      e.preventDefault();
      const amt = Number(activeModalTxDraft.amount || 0);
      if (amt <= 0) {
        showToast('Masukkan nominal transaksi lebih dari 0 ya!', 'warning');
        return;
      }

      const cat = appState.categories.find((c) => c.id === activeModalTxDraft.categoryId);
      const txPayload = {
        id: activeModalTxDraft.id || ('tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7)),
        type: activeModalTxDraft.type,
        amount: amt,
        categoryId: activeModalTxDraft.categoryId,
        date: activeModalTxDraft.date || toISODate(new Date()),
        note: (activeModalTxDraft.note || '').trim() || (cat ? cat.name : 'Transaksi'),
        receiptImage: activeModalTxDraft.receiptImage || ''
      };

      if (activeModalTxDraft.id) {
        const idx = appState.transactions.findIndex((t) => t.id === activeModalTxDraft.id);
        if (idx !== -1) appState.transactions[idx] = txPayload;
        showToast('✏️ Transaksi berhasil diperbarui!', 'success');
      } else {
        appState.transactions.unshift(txPayload);
        showToast('✅ Transaksi berhasil dicatat!', 'success');
      }

      const txCycle = findCycleKeyForDate(parseISODate(txPayload.date));
      uiState.selectedCycleKey = txCycle;
      saveState();
      if (txPayload.type === 'expense') {
        checkCategoryBudgetAlert(txPayload.categoryId, txCycle);
      }
      closeModal();
      renderApp();
    }

    let parsedDraftList = [];

    function renderVoiceTxHTML() {
      return `

              🎧 Simulasi Suara
            </button>

      `;

    function startVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const statusEl = document.getElementById('voice-status-text');

      if (!SpeechRecognition) {
        if (statusEl) statusEl.textContent = 'Browser tidak mendukung Speech API. Gunakan Simulasi Suara atau Catat AI.';
        return;
      }

      try {
        if (voiceRecognitionInstance) {
          try { voiceRecognitionInstance.stop(); } catch (_) {}
        }
        voiceRecognitionInstance = new SpeechRecognition();
        voiceRecognitionInstance.lang = 'id-ID';
        voiceRecognitionInstance.interimResults = false;
        voiceRecognitionInstance.maxAlternatives = 1;

        isListeningVoice = true;
        if (statusEl) statusEl.textContent = '🔴 Mendengarkan... Silakan bicara sekarang';

        voiceRecognitionInstance.onresult = (event) => {
          isListeningVoice = false;
          const transcript = event.results[0][0].transcript;
          if (statusEl) statusEl.textContent = `Terdengar: "${transcript}"`;
          parsedDraftList = parseSmartTransactions(transcript);
          const container = document.getElementById('smart-draft-container');
          if (container) container.innerHTML = renderSmartDraftCards();
        };

        voiceRecognitionInstance.onerror = () => {
          isListeningVoice = false;
          if (statusEl) statusEl.textContent = 'Izin mikrofon dibatasi atau tidak ada suara. Coba klik Simulasi Suara.';
        };

        voiceRecognitionInstance.onend = () => {
          isListeningVoice = false;
        };

        voiceRecognitionInstance.start();
      } catch (err) {
        isListeningVoice = false;
        if (statusEl) statusEl.textContent = 'Gagal mengakses mikrofon. Gunakan Simulasi Suara.';
      }
    }

    function simulateVoiceDemo() {
      const samplePhrase = 'Kopi susu gula aren 22 ribu dan makan siang ayam geprek 25 ribu';
      const statusEl = document.getElementById('voice-status-text');
      if (statusEl) statusEl.textContent = `Simulasi: "${samplePhrase}"`;
      parsedDraftList = parseSmartTransactions(samplePhrase);
      const container = document.getElementById('smart-draft-container');
      if (container) container.innerHTML = renderSmartDraftCards();
    }

            <p class="text-[11px] text-slate-500 mt-0.5">Otomatis dikompresi & diekstrak ke formulir</p>
            <input type="file" accept="image/*" capture="environment" onchange="handleReceiptUpload(event, true)" class="hidden" />

    function handleReceiptUpload(event, autoScanMode = false) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = 720;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.72);

          activeModalTxDraft.receiptImage = compressedDataUrl;

          if (autoScanMode) {
            const area = document.getElementById('scan-preview-area');
            if (area) {
              area.innerHTML = `
                <div class="relative rounded-2xl overflow-hidden border border-slate-200 my-2">
                  <img src="${compressedDataUrl}" class="w-full h-44 object-cover" />
                  <div class="scan-laser"></div>
                </div>
                <p class="text-xs font-bold text-brand animate-pulse">Memindai struk pembayaran...</p>
              `;
            }
            setTimeout(() => {
              // Estimasi cerdas berdasarkan nama file atau default merchant
              const baseName = file.name.replace(/\.[^/.]+$/, '').replace(/[_-]/g, ' ');
              const guessedAmount = parseIndonesianAmount(baseName) || 45000;
              activeModalTxDraft.amount = guessedAmount;
              activeModalTxDraft.note = baseName.length > 3 ? `Struk ${baseName}` : 'Belanja Merchant QRIS';
              showToast('✨ Struk berhasil dipindai! Silakan cek detailnya.', 'success');
              renderTransactionModal('manual');
            }, 1300);
          } else {
            renderTransactionModal('manual');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function handleGoogleLogin() {
      if (!supabaseClient) {
        showToast('Layanan autentikasi sedang dimuat, coba sebentar lagi.', 'warning');
        return;
      }
      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin }
        });
        if (error) throw error;
      } catch (err) {
        showToast(translateAuthError(err.message), 'danger');
      }
    }

    async function handleEmailAuthSubmit(e) {
      e.preventDefault();
      if (!supabaseClient) return;

      const email = document.getElementById('auth-email')?.value.trim();
      const password = document.getElementById('auth-password')?.value;
      const name = document.getElementById('auth-name')?.value.trim();
      const btn = document.getElementById('auth-submit-btn');

      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Memproses...';
      }

      try {
        if (authFormMode === 'forgot') {
          const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin
          });
          if (error) throw error;
          showToast('📩 Link reset sandi sudah dikirim ke email kamu!', 'success');
          authFormMode = 'login';
          openAuthOrProfileModal();
          return;
        }

        if (authFormMode === 'register') {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { full_name: name || email.split('@')[0] } }
          });
          if (error) throw error;
          if (name) appState.userName = name;
          if (data.user) {
            currentUser = data.user;
            await syncUserDataToCloud();
          }
          closeModal();
          renderApp();
          showToast('🎉 Akun berhasil dibuat & tersinkron!', 'success');
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          currentUser = data.user;
          await loadUserDataFromCloud();
          closeModal();
          renderApp();
          showToast('👋 Berhasil masuk! Data cloud dimuat.', 'success');
        }
      } catch (err) {
        showToast(translateAuthError(err.message), 'danger');
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function handleLogout() {
      try {
        if (supabaseClient) await supabaseClient.auth.signOut();
      } catch (err) {
        console.error('Logout error:', err);
      }
      currentUser = null;
      uiState.syncStatus = 'local';
      closeModal();
      renderApp();
      showToast('👋 Kamu telah keluar dari akun.', 'info');
    }

    /**
     * ============================================================================
     * 13. SPOTLIGHT TOUR INTERAKTIF + PANDUAN INSTALL PWA + CEK UPDATE
     * ============================================================================
     */
    const TOUR_STEPS = [
      {
        targetId: 'tour-header-cycle',
        title: '🗓️ Siklus Gajian Dinamis',
        desc: 'Saldo & laporan dihitung otomatis sesuai tanggal gajianmu (default tgl 30), bukan tanggal 1–31 kaku.'
      },
      {
        targetId: 'tour-quick-actions',
        title: '⚡ Catat Super Cepat',
        desc: 'Gunakan Catat Suara, ketik santai lewat Catat AI, atau Scan Struk QRIS dalam hitungan detik.'
      },
      {
        targetId: 'tour-fab-plus',
        title: '➕ Ketuk atau Tahan Tombol +',
        desc: 'Ketuk sekali untuk catat manual, atau tahan (long-press) 0,4 detik untuk langsung mengaktifkan mikrofon!'
      },
      {
        targetId: 'nav-laporan',
        title: '📊 Vibe Check & Pos Boncos',
        desc: 'Cek apakah siklus ini lebih hemat dari bulan lalu dan lihat pos pengeluaran paling boros.'
      },
      {
        targetId: 'tour-install-banner',
        title: '📲 Pasang Cuan di Layar Utama HP',
        desc: 'Android Chrome: ketuk ikon titik tiga (⋮) → "Install aplikasi". iPhone Safari: ketuk ikon Share (□↑) → "Add to Home Screen".'
      }
    ];

    function startSpotlightTour() {
      uiState.activeTab = 'beranda';
      uiState.tourStep = 0;
      renderApp();
      setTimeout(renderSpotlightTourStep, 120);
    }

    function renderSpotlightTourStep() {
      const root = document.getElementById('tour-root');
      if (!root) return;

      if (uiState.tourStep < 0 || uiState.tourStep >= TOUR_STEPS.length) {
        root.innerHTML = '';
        localStorage.setItem(TOUR_SEEN_KEY, '1');
        return;
      }

      const step = TOUR_STEPS[uiState.tourStep];
      const targetEl = document.getElementById(step.targetId);
      let boxHTML = '';
      let cardTopStyle = 'top: 50%; transform: translateY(-50%);';

      if (targetEl) {
        const rect = targetEl.getBoundingClientRect();
        const pad = 6;
        boxHTML = `<div class="tour-highlight-box" style="top:${rect.top - pad}px; left:${rect.left - pad}px; width:${rect.width + pad * 2}px; height:${rect.height + pad * 2}px;"></div>`;

        if (rect.top > window.innerHeight * 0.55) {
          cardTopStyle = `bottom: ${window.innerHeight - rect.top + 18}px;`;
        } else {
          cardTopStyle = `top: ${rect.bottom + 18}px;`;
        }
      } else {
        boxHTML = `<div class="fixed inset-0 bg-slate-900/75 z-[90]"></div>`;
      }

      root.innerHTML = `
        ${boxHTML}
        <div class="fixed left-1/2 -translate-x-1/2 w-[90%] max-w-[420px] bg-white rounded-3xl p-4 shadow-2xl z-[95] border border-slate-100" style="${cardTopStyle}">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[10px] font-extrabold uppercase tracking-wider text-brand bg-brand-tint px-2.5 py-0.5 rounded-full">
              Panduan ${uiState.tourStep + 1} / ${TOUR_STEPS.length}
            </span>
            <button onclick="uiState.tourStep = -1; renderSpotlightTourStep();" class="text-xs text-slate-400 font-bold">Lewati</button>
          </div>
          <h3 class="text-sm font-extrabold text-slate-900">${step.title}</h3>
          <p class="text-xs text-slate-600 mt-1 leading-relaxed">${step.desc}</p>
          <div class="flex items-center justify-between mt-4">
            <button
              onclick="uiState.tourStep = Math.max(0, uiState.tourStep - 1); renderSpotlightTourStep();"
              class="text-xs font-bold text-slate-500 px-3 py-1.5 rounded-xl ${uiState.tourStep === 0 ? 'invisible' : ''}"
            >
              ← Kembali
            </button>
            <button
              onclick="uiState.tourStep++; renderSpotlightTourStep();"
              class="bg-brand text-white text-xs font-extrabold px-4 py-2 rounded-xl shadow-sm"
            >
              ${uiState.tourStep === TOUR_STEPS.length - 1 ? 'Siap Pakai! 🚀' : 'Lanjut →'}
            </button>
          </div>
        </div>
      `;
    }

    function dismissInstallBanner() {
      localStorage.setItem(INSTALL_DISMISSED_KEY, '1');
      renderApp();
    }

    async function triggerPwaInstall() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const { outcome } = await deferredInstallPrompt.userChoice;
        if (outcome === 'accepted') {
          deferredInstallPrompt = null;
          dismissInstallBanner();
          showToast('🎉 Aplikasi Cuan sedang dipasang ke HP kamu!', 'success');
        }
        return;
      }

      // Tutorial Visual Android & iOS jika browser tidak memicu prompt otomatis
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 modal-backdrop flex items-end justify-center" onclick="if(event.target===this) closeModal()">
          <div class="bottom-sheet bg-white w-full max-w-[480px] rounded-t-3xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="text-base font-extrabold text-slate-900">📲 Cara Pasang Cuan di HP</h2>
              <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 text-sm">✕</button>
            </div>

            <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100 space-y-1.5">
              <p class="text-xs font-extrabold text-brand">🤖 Pengguna Android (Google Chrome)</p>
              <ol class="text-xs text-slate-600 list-decimal pl-4 space-y-1">
                <li>Pastikan link dibuka di aplikasi <b>Google Chrome</b> (bukan browser dalam WhatsApp).</li>
                <li>Ketuk ikon <b>titik tiga (⋮)</b> di pojok kanan atas Chrome.</li>
                <li>Pilih <b>Install aplikasi</b> atau <b>Tambahkan ke Layar Utama</b>.</li>
              </ol>
            </div>

            <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100 space-y-1.5">
              <p class="text-xs font-extrabold text-brand">🍎 Pengguna iPhone (Safari)</p>
              <ol class="text-xs text-slate-600 list-decimal pl-4 space-y-1">
                <li>Buka link aplikasi ini lewat browser <b>Safari</b>.</li>
                <li>Ketuk ikon <b>Share (kotak panah ke atas)</b> di bagian bawah layar.</li>
                <li>Gulir ke bawah lalu pilih <b>Add to Home Screen (Tambah ke Layar Utama)</b>.</li>
              </ol>
            </div>

            <button onclick="closeModal()" class="w-full bg-brand text-white text-xs font-extrabold py-3 rounded-2xl">Mengerti</button>
          </div>
        </div>
      `;
    }

    function applyAppUpdate() {
      if (swRegistration && swRegistration.waiting) {
        swRegistration.waiting.postMessage({ type: 'SKIP_WAITING' });
      }
      window.location.reload();
    }

    async function checkForAppUpdates() {
      showToast('🔄 Mengecek pembaruan dari server...', 'info');
      try {
        if (swRegistration) {
          await swRegistration.update();
          if (swRegistration.waiting) {
            document.getElementById('update-banner')?.classList.remove('hidden');
            showToast('🚀 Versi baru ditemukan! Klik tombol Update di atas.', 'success');
            return;
          }
        }
        setTimeout(() => {
          window.location.reload();
        }, 600);
      } catch (_) {
        window.location.reload();
      }
    }

    /**
     * ============================================================================
     * 14. DATA CONTOH, EKSPOR CSV, BACKUP & RESTORE JSON
     * ============================================================================
     */
    function loadSampleDemoData() {
      const now = new Date();
      const activeKey = findCycleKeyForDate(now);
      const activeRange = getCycleRange(activeKey);
      const prevKey = getPreviousCycleKey(activeKey);
      const prevRange = getCycleRange(prevKey);

      const d1 = toISODate(activeRange.startDate);
      const d2 = toISODate(now);
      const p1 = toISODate(prevRange.startDate);

      appState.transactions = [
        { id: 'tx_demo_1', type: 'income', amount: 6500000, categoryId: 'cat_gaji', date: d1, note: 'Gaji Bulanan Utama', receiptImage: '' },
        { id: 'tx_demo_2', type: 'expense', amount: 1200000, categoryId: 'cat_tagihan', date: d1, note: 'Bayar Kos & Wi-Fi', receiptImage: '' },
        { id: 'tx_demo_3', type: 'expense', amount: 25000, categoryId: 'cat_makan', date: d2, note: 'Es Kopi Susu Gula Aren', receiptImage: '' },
        { id: 'tx_demo_4', type: 'expense', amount: 42000, categoryId: 'cat_makan', date: d2, note: 'Makan Siang Ayam Bakar', receiptImage: '' },
        { id: 'tx_demo_5', type: 'expense', amount: 18000, categoryId: 'cat_transport', date: d2, note: 'Naik Ojol ke Kantor', receiptImage: '' },
        { id: 'tx_demo_6', type: 'income', amount: 6200000, categoryId: 'cat_gaji', date: p1, note: 'Gaji Siklus Lalu', receiptImage: '' },
        { id: 'tx_demo_7', type: 'expense', amount: 1850000, categoryId: 'cat_belanja', date: p1, note: 'Belanja Kebutuhan Bulanan', receiptImage: '' }
      ];

      uiState.selectedCycleKey = activeKey;
      saveState();
      renderApp();
      showToast('✨ Data contoh siklus ini & siklus lalu berhasil dimuat!', 'success');
    }

    function exportTransactionsCSV() {
      const metrics = getCycleMetrics(uiState.selectedCycleKey);
      const rows = [['Tanggal', 'Tipe', 'Kategori', 'Catatan', 'Nominal']];
      metrics.txs.forEach((tx) => {
        const cat = appState.categories.find((c) => c.id === tx.categoryId)?.name || 'Umum';
        rows.push([tx.date, tx.type === 'income' ? 'Cuan Masuk' : 'Cuan Keluar', `"${cat}"`, `"${(tx.note || '').replace(/"/g, '""')}"`, tx.amount]);
      });

      const csvContent = 'data:text/csv;charset=utf-8,' + rows.map((r) => r.join(',')).join('\n');
      const link = document.createElement('a');
      link.setAttribute('href', encodeURI(csvContent));
      link.setAttribute('download', `Laporan_Cuan_${uiState.selectedCycleKey}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast('📥 File CSV laporan berhasil diunduh!', 'success');
    }

    function downloadBackupJSON() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(appState, null, 2));
      const link = document.createElement('a');
      link.setAttribute('href', dataStr);
      link.setAttribute('download', `Backup_Cuan_${toISODate(new Date())}.json`);
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast('💾 File backup JSON berhasil diunduh!', 'success');
    }

    function restoreBackupJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.transactions)) {
            throw new Error('Format file backup tidak valid.');
          }
          appState = { ...appState, ...parsed };
          applyTheme(appState.themeId);
          saveState();
          renderApp();
          showToast('📂 Data berhasil dipulihkan dari backup!', 'success');
        } catch (err) {
          showToast('Gagal memulihkan file JSON: ' + err.message, 'danger');
        }
      };
      reader.readAsText(file);
    }

    function toggleReminderSetting(enabled) {
      appState.reminderEnabled = enabled;
      saveState();
      if (enabled && 'Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      showToast(enabled ? '⏰ Pengingat harian diaktifkan' : 'Pengingat harian dimatikan', 'info');
    }

    /**
     * ============================================================================
     * 15. INISIALISASI GESTUR LONG-PRESS FAB (+), PWA & BOOTSTRAP APLIKASI
     * ============================================================================
     */
    function initFabLongPress() {
      const fab = document.getElementById('fab-add-btn');
      if (!fab) return;

      let pressTimer = null;
      let longPressTriggered = false;

      const startPress = (e) => {
        if (e.type === 'mousedown' && e.button !== 0) return;
        longPressTriggered = false;
        fab.classList.add('pressing');

        pressTimer = setTimeout(() => {
          longPressTriggered = true;
          fab.classList.remove('pressing');
          if (navigator.vibrate) navigator.vibrate(40);
          openAddTransactionModal('voice');
        }, 420);
      };

      const endPress = (e) => {
        clearTimeout(pressTimer);
        fab.classList.remove('pressing');
        if (!longPressTriggered && e.type !== 'mouseleave' && e.type !== 'touchcancel') {
          openAddTransactionModal('manual');
        }
      };

      fab.addEventListener('touchstart', startPress, { passive: true });
      fab.addEventListener('touchend', endPress);
      fab.addEventListener('touchcancel', endPress);
      fab.addEventListener('mousedown', startPress);
      fab.addEventListener('mouseup', endPress);
      fab.addEventListener('mouseleave', () => {
        clearTimeout(pressTimer);
        fab.classList.remove('pressing');
      });
    }

    function initPwaAndServiceWorker() {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          swRegistration = reg;
          if (reg.waiting) {
            document.getElementById('update-banner')?.classList.remove('hidden');
          }
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                document.getElementById('update-banner')?.classList.remove('hidden');
              }
            });
          });
        }).catch((err) => console.warn('SW registration skipped:', err));
      }
    }

    async function bootCuanApp() {
      loadLocalState();
      renderApp();
      initFabLongPress();
      initPwaAndServiceWorker();
      startReminderScheduler();
      await initSupabase();

      if (!localStorage.getItem(TOUR_SEEN_KEY)) {
        setTimeout(() => startSpotlightTour(), 650);
      }
    }

    document.addEventListener('DOMContentLoaded', bootCuanApp);
  </script>
