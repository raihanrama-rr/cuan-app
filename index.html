  <script>
    // =========================================================================
    // 0. KONFIGURASI SUPABASE (SUDAH TERPASANG OTOMATIS)

    const SUPABASE_CONFIG = {

    const SUPABASE_SQL_SETUP = `-- Jalankan di Supabase SQL Editor (1x saja)

    const MONTHLY_COMPARISON_PRESETS = [
      [
        { icon: '☕', name: 'Es Kopi Susu Gula Aren', price: 22000 },

    // =========================================================================
    // 1. APPLICATION STATE & RUNTIME OBJECTS

    let state = {
      activeTab: 'beranda',
      cycleOffset: 0,
      hideBalance: false,
      userMode: 'simulation', // 'simulation' | 'supabase'
      isDemoData: true,
      userName: 'Sobat Cuan',

      supabaseUrl: '',

      supabaseUserId: '',
      lastSyncedAt: '',
      syncStatus: 'simulation', // 'simulation' | 'synced' | 'saving' | 'error'
      authModalTab: 'signin', // 'signin' | 'signup'
      defaultPayday: 25,
      monthlyPaydays: {},
      categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
      transactions: [],
      chartMode: 'daily', // 'daily' | 'weekly'
      txFilterType: 'all', // 'all' | 'income' | 'expense'
      txSearchQuery: '',
      reminderEnabled: true,
      reminderTime: '20:00',

      notifications: [
        {
          id: 'notif_welcome',
          title: 'Selamat datang di Cuan! 👋',
          body: 'Ini adalah tampilan preview dengan data contoh. Login pake Google atau Email untuk mulai mencatat keuanganmu!',
          time: 'Baru saja',
          level: 'info',
          unread: true
        }
      ]
    };

    let supabaseClient = null;
    let activeChartInstance = null;
    let autoCloudSyncTimer = null;
    let deferredPWAInstallPrompt = null;

    const voiceRuntime = {
      recognition: null,
      isListening: false,
      transcript: '',
      interimTranscript: '',
      draftItems: [],
      statusMessage: 'Tap tombol mikrofon di atas lalu sebutkan transaksi kamu.'
    };

    // =========================================================================
    // 2. CORE UTILITIES (CURRENCY, DATE, ESCAPE, STORAGE, TOASTS)
    // =========================================================================
    function uid(prefix = 'id') {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function escapeHTML(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatIDR(num) {
      const n = Math.round(Number(num) || 0);
      const sign = n < 0 ? '-' : '';
      return `${sign}Rp ${Math.abs(n).toLocaleString('id-ID')}`;
    }

    function formatShortIDR(num) {
      const abs = Math.abs(Number(num) || 0);
      const sign = num < 0 ? '-' : '';
      if (abs >= 1000000) return `${sign}Rp ${(abs / 1000000).toFixed(1).replace(/\.0$/, '')}jt`;
      if (abs >= 1000) return `${sign}Rp ${Math.round(abs / 1000)}rb`;
      return `${sign}Rp ${abs}`;
    }

    function parseFormattedNumber(raw) {
      const digits = String(raw || '').replace(/[^\d]/g, '');
      return digits ? parseInt(digits, 10) : 0;
    }

    function formatRupiahInput(el) {
      const digits = el.value.replace(/[^\d]/g, '');
      if (!digits) {
        el.value = '';
        return;
      }
      el.value = parseInt(digits, 10).toLocaleString('id-ID');
    }

    function toISODate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatIndoDate(isoStr) {
      if (!isoStr) return '-';
      const [y, m, d] = isoStr.split('-').map(Number);
      if (!y || !m || !d) return isoStr;
      return `${d} ${INDO_SHORT_MONTHS[m - 1]} ${y}`;
    }

    function saveStateToStorage(triggerCloud = true) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('Gagal menyimpan ke localStorage:', e);
      }
      if (triggerCloud && state.userMode === 'supabase' && state.supabaseUserId) {
        scheduleAutoCloudSync();
      }
    }

    function loadStateFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          state = {
            ...state,
            ...parsed,
            categories: Array.isArray(parsed.categories) && parsed.categories.length
              ? parsed.categories
              : JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
            transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
            notifications: Array.isArray(parsed.notifications) ? parsed.notifications : state.notifications,
            monthlyPaydays: parsed.monthlyPaydays && typeof parsed.monthlyPaydays === 'object'
              ? parsed.monthlyPaydays
              : {}
          };
        }
      } catch (e) {
        console.warn('Gagal memuat localStorage:', e);
      }
    }

    function applyUrlAutoConfigParams() {
      try {
        const params = new URLSearchParams(window.location.search);
        const sbUrl = params.get('sb_url');
        const sbKey = params.get('sb_key');
        if (sbUrl && sbKey) {
          state.supabaseUrl = sbUrl.trim();
          state.supabaseAnonKey = sbKey.trim();
          saveStateToStorage(false);
          const cleanUrl = window.location.origin + window.location.pathname;
          window.history.replaceState({}, document.title, cleanUrl);
        }
      } catch (e) {}
    }

    function showToast(title, message = '', tone = 'teal') {
      const stack = document.getElementById('toastStack');
      if (!stack) return;
      const palette = {
        teal: 'bg-[#0B4F5E] text-white border-[#127084]',
        mint: 'bg-emerald-700 text-white border-emerald-500',
        amber: 'bg-amber-600 text-white border-amber-400',
        rose: 'bg-rose-600 text-white border-rose-400'
      };
      const cls = palette[tone] || palette.teal;
      const el = document.createElement('div');
      el.className = `pointer-events-auto rounded-2xl px-4 py-3 shadow-xl border ${cls} transition-all duration-300 text-left`;
      el.innerHTML = `
        <div class="text-xs font-extrabold tracking-tight">${escapeHTML(title)}</div>
        ${message ? `<div class="text-[11px] opacity-90 mt-0.5 leading-snug">${escapeHTML(message)}</div>` : ''}
      `;
      stack.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-8px)';
        setTimeout(() => el.remove(), 260);
      }, 3600);
    }

    function pushNotification(title, body, level = 'info') {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      state.notifications.unshift({
        id: uid('notif'),
        title,
        body,
        time: `Hari ini ${hh}:${mm}`,
        level,
        unread: true
      });
      if (state.notifications.length > 30) {
        state.notifications = state.notifications.slice(0, 30);
      }
      saveStateToStorage(false);
    }

    // =========================================================================
    // 3. SUPABASE CONFIGURATION, AUTH & AUTO CLOUD SYNC
    // =========================================================================
    function getActiveSupabaseConfig() {
      const hardcodedUrl = (SUPABASE_CONFIG.url || '').trim();
      const hardcodedKey = (SUPABASE_CONFIG.anonKey || '').trim();
      const isHardcoded = hardcodedUrl.startsWith('http') && !hardcodedUrl.includes('ISI_') &&
                          hardcodedKey.length > 20 && !hardcodedKey.includes('ISI_');

      const finalUrl = isHardcoded ? hardcodedUrl : (state.supabaseUrl || '').trim();
      const finalKey = isHardcoded ? hardcodedKey : (state.supabaseAnonKey || '').trim();
      const isConfigured = finalUrl.startsWith('http') && finalKey.length > 20;

      return { url: finalUrl, anonKey: finalKey, isConfigured, isHardcoded };
    }

    function getOrInitSupabase() {
      const cfg = getActiveSupabaseConfig();
      if (!cfg.isConfigured || !window.supabase) return null;
      if (!supabaseClient || supabaseClient.__cuanUrl !== cfg.url || supabaseClient.__cuanKey !== cfg.anonKey) {
        supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey);
        supabaseClient.__cuanUrl = cfg.url;
        supabaseClient.__cuanKey = cfg.anonKey;
      }
      return supabaseClient;
    }

    function updateSyncStatusPillUI() {
      const pill = document.getElementById('headerSyncStatusPill');
      if (!pill) return;
      if (state.userMode !== 'supabase') {
        pill.innerHTML = '👀 Data Contoh';
        return;
      }
      if (state.syncStatus === 'saving') {
        pill.innerHTML = '⏳ Menyimpan...';
      } else if (state.syncStatus === 'error') {
        pill.innerHTML = '⚠️ Cek Tabel DB';
      } else {
        pill.innerHTML = '☁️ Tersinkron';
      }
    }

    function requireAuthForRecording(actionLabel = 'mulai mencatat keuangan') {
      if (state.userMode === 'supabase' && state.supabaseUserId) {
        return true;
      }
      openAccountModal(actionLabel);
      return false;
    }

    function scheduleAutoCloudSync() {
      state.syncStatus = 'saving';
      updateSyncStatusPillUI();
      clearTimeout(autoCloudSyncTimer);
      autoCloudSyncTimer = setTimeout(() => {
        syncUserData(true);
      }, 800);
    }

    async function applyAuthenticatedUserSession(user, announceLogin = false) {
      if (!user) return;
      const isDifferentUser = state.supabaseUserId && state.supabaseUserId !== user.id;
      const wasDemoMode = state.userMode !== 'supabase' || state.isDemoData;
      const meta = user.user_metadata || {};
      const resolvedName = meta.full_name || meta.name || (user.email ? user.email.split('@')[0] : 'Sobat Cuan');
      const resolvedAvatar = meta.avatar_url || meta.picture || '';

      state.userMode = 'supabase';
      state.isDemoData = false;
      state.supabaseUserId = user.id;
      state.userEmail = user.email || state.userEmail;
      state.userName = resolvedName;
      state.userAvatar = resolvedAvatar;
      state.syncStatus = 'saving';

      if (isDifferentUser || wasDemoMode) {
        state.transactions = [];
      }

      saveStateToStorage(false);
      render();

      await loadUserData(true, true);
      if (announceLogin) {
        showToast(`Yo, ${state.userName}! 👋`, 'Akun & database cloud kamu sudah tertaut. Gas mulai catat cuanmu!', 'mint');
      }
      render();
    }

    async function initSupabaseAuthListener() {
      const sb = getOrInitSupabase();
      if (!sb) return;

      try {
        const { data } = await sb.auth.getSession();
        if (data && data.session && data.session.user) {
          await applyAuthenticatedUserSession(data.session.user, false);
        }

        sb.auth.onAuthStateChange(async (event, session) => {
          if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session && session.user) {
            await applyAuthenticatedUserSession(session.user, event === 'SIGNED_IN');
          } else if (event === 'SIGNED_OUT') {
            state.userMode = 'simulation';
            state.isDemoData = true;
            state.supabaseUserId = '';
            state.userEmail = '';
            state.userAvatar = '';
            state.lastSyncedAt = '';
            state.syncStatus = 'simulation';
            seedDummyPreviewData(false);
            saveStateToStorage(false);
            render();
          }
        });
      } catch (err) {
        console.warn('Auth session check:', err);
      }
    }

    async function handleGoogleLoginClick() {
      const sb = getOrInitSupabase();
      if (!sb) {
        showToast('Supabase Belum Diset', 'Isi Project URL & Anon Key Supabase dulu di tab Lainnya -> Setup Database Supabase.', 'amber');
        return;
      }
      try {
        const redirectTo = window.location.origin + window.location.pathname;
        const { error } = await sb.auth.signInWithOAuth({

    async function syncUserData(silent = false) {

      const sb = getOrInitSupabase();
      if (!sb) return;

      state.syncStatus = 'saving';
      updateSyncStatusPillUI();

      const payload = {
        userName: state.userName,
        defaultPayday: state.defaultPayday,
        monthlyPaydays: state.monthlyPaydays,
        categories: state.categories,
        transactions: state.transactions,
        reminderEnabled: state.reminderEnabled,
        reminderTime: state.reminderTime
      };

      try {
        const { error } = await sb
          .from('cuan_user_data')
          .upsert({
            user_id: state.supabaseUserId,
            payload,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });

        if (error) throw error;

        const now = new Date();
        state.lastSyncedAt = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        state.syncStatus = 'synced';

        state.syncStatus = 'error';
        updateSyncStatusPillUI();

    async function loadUserData(silent = false, uploadIfEmpty = false) {
      if (state.userMode !== 'supabase' || !state.supabaseUserId) return;
      const sb = getOrInitSupabase();
      if (!sb) return;

      try {
        const { data, error } = await sb
          .from('cuan_user_data')
          .select('payload, updated_at')
          .eq('user_id', state.supabaseUserId)
          .maybeSingle();

        if (error) throw error;

        if (data && data.payload && typeof data.payload === 'object') {
          const p = data.payload;
          if (Array.isArray(p.categories) && p.categories.length) state.categories = p.categories;
          if (Array.isArray(p.transactions)) state.transactions = p.transactions;
          if (typeof p.defaultPayday === 'number') state.defaultPayday = p.defaultPayday;
          if (p.monthlyPaydays && typeof p.monthlyPaydays === 'object') state.monthlyPaydays = p.monthlyPaydays;
          if (typeof p.reminderEnabled === 'boolean') state.reminderEnabled = p.reminderEnabled;
          if (p.reminderTime) state.reminderTime = p.reminderTime;
          state.isDemoData = false;
          state.syncStatus = 'synced';
          saveStateToStorage(false);
          updateSyncStatusPillUI();
          if (!silent) showToast('Data Cloud Dimuat ☁️', 'Catatan keuanganmu berhasil dipulihkan.', 'mint');
        } else if (uploadIfEmpty) {
          await syncUserData(true);

    // =========================================================================
    // 4. PAYDAY CYCLE ENGINE (DYNAMIC PER MONTH)
    // =========================================================================
    function getMonthKey(year, monthIndex0) {
      return `${year}-${String(monthIndex0 + 1).padStart(2, '0')}`;
    }

    function getPaydayForMonth(year, monthIndex0) {
      const key = getMonthKey(year, monthIndex0);
      const customDay = state.monthlyPaydays[key];
      const maxDaysInMonth = new Date(year, monthIndex0 + 1, 0).getDate();
      const targetDay = customDay ? Number(customDay) : Number(state.defaultPayday || 25);
      return Math.min(Math.max(1, targetDay), maxDaysInMonth);
    }

    function getCycleRange(offset = 0) {
      const today = new Date();
      const thisMonthPayday = getPaydayForMonth(today.getFullYear(), today.getMonth());
      let baseYear = today.getFullYear();
      let baseMonth = today.getMonth();

      if (today.getDate() < thisMonthPayday) {
        baseMonth -= 1;
        if (baseMonth < 0) {
          baseMonth = 11;
          baseYear -= 1;
        }
      }

      const targetDate = new Date(baseYear, baseMonth + offset, 1);
      const startYear = targetDate.getFullYear();
      const startMonth = targetDate.getMonth();
      const startDay = getPaydayForMonth(startYear, startMonth);
      const startDate = new Date(startYear, startMonth, startDay);

      const nextMonthRef = new Date(startYear, startMonth + 1, 1);
      const nextYear = nextMonthRef.getFullYear();
      const nextMonth = nextMonthRef.getMonth();
      const nextPayday = getPaydayForMonth(nextYear, nextMonth);
      const endDate = new Date(nextYear, nextMonth, nextPayday - 1);

      const startISO = toISODate(startDate);
      const endISO = toISODate(endDate);
      const label = `${INDO_MONTHS[startMonth]} ${startYear}`;
      const rangeText = `${startDate.getDate()} ${INDO_SHORT_MONTHS[startMonth]} – ${endDate.getDate()} ${INDO_SHORT_MONTHS[nextMonth]} ${nextYear}`;

      return {
        offset,
        startYear,
        startMonth,
        monthKey: getMonthKey(startYear, startMonth),
        startDate,
        endDate,
        startISO,
        endISO,
        label,
        rangeText
      };
    }

    function getCycleStats(offset = 0) {
      const cycle = getCycleRange(offset);
      const txs = state.transactions.filter(t => t.date >= cycle.startISO && t.date <= cycle.endISO);

      let income = 0;
      let expense = 0;
      const expenseByCategory = {};

      for (const tx of txs) {
        const amt = Number(tx.amount) || 0;
        if (tx.type === 'income') {
          income += amt;
        } else {
          expense += amt;
          expenseByCategory[tx.categoryId] = (expenseByCategory[tx.categoryId] || 0) + amt;
        }
      }

      const net = income - expense;
      return { cycle, txs, income, expense, net, expenseByCategory };
    }

    function changeCycleOffset(newOffset) {
      state.cycleOffset = Number(newOffset) || 0;
      render();
    }

    // =========================================================================
    // 5. NATURAL LANGUAGE & VOICE TRANSACTION PARSER (INDONESIAN)
    // =========================================================================
    function parseIndonesianSpokenAmount(segmentText) {
      const cleaned = segmentText.toLowerCase().replace(/rp\.?/gi, ' ').trim();

      // 1. Cek pola angka eksplisit (contoh: "25.000", "25rb", "1,5jt", "50k")
      const explicitMatch = cleaned.match(/(\d+(?:[.,]\d+)?)\s*(jt|juta|rb|ribu|k|ratus)?\b/);
      if (explicitMatch) {
        let numStr = explicitMatch[1];
        const unit = explicitMatch[2] || '';
        if (unit === 'jt' || unit === 'juta') {
          numStr = numStr.replace(',', '.');
          return Math.round(parseFloat(numStr) * 1000000);
        }
        if (unit === 'rb' || unit === 'ribu' || unit === 'k') {
          numStr = numStr.replace(',', '.');
          return Math.round(parseFloat(numStr) * 1000);
        }
        if (unit === 'ratus') {
          numStr = numStr.replace(',', '.');
          return Math.round(parseFloat(numStr) * 100);
        }
        const digitsOnly = numStr.replace(/[.,]/g, '');
        const parsed = parseInt(digitsOnly, 10);
        if (parsed > 0) return parsed;
      }

      // 2. Cek slang nominal Indonesia
      const slangMap = [
        { regex: /\bsetengah\s+juta\b/, val: 500000 },
        { regex: /\bsejuta\b/, val: 1000000 },
        { regex: /\bseribu\b/, val: 1000 },
        { regex: /\bseceng\b/, val: 1000 },
        { regex: /\bgoceng\b/, val: 5000 },
        { regex: /\bceban\b/, val: 10000 },
        { regex: /\bnob\s*an\b|\bgoban\b/, val: 50000 },
        { regex: /\bcepek\b/, val: 100000 },
        { regex: /\bgopek\b/, val: 500000 }
      ];
      for (const s of slangMap) {
        if (s.regex.test(cleaned)) return s.val;
      }

      // 3. Konversi kata bilangan bahasa Indonesia ("dua puluh lima ribu", "tiga ratus lima puluh ribu")
      const wordNums = {
        nol: 0, satu: 1, se: 1, dua: 2, tiga: 3, empat: 4,
        lima: 5, enam: 6, tujuh: 7, delapan: 8, sembilan: 9
      };
      const tokens = cleaned.split(/\s+/);
      let total = 0;
      let current = 0;
      let foundWordNumber = false;

      for (let i = 0; i < tokens.length; i++) {
        const w = tokens[i];
        if (w === 'seratus') {
          current += 100;
          foundWordNumber = true;
        } else if (w === 'seribu') {
          current = (current || 1) * 1000;
          total += current;
          current = 0;
          foundWordNumber = true;
        } else if (w === 'sejuta') {
          current = (current || 1) * 1000000;
          total += current;
          current = 0;
          foundWordNumber = true;
        } else if (w === 'belas') {
          current = (current === 0 ? 1 : current) + 10;
          foundWordNumber = true;
        } else if (w === 'puluh') {
          current = (current || 1) * 10;
          foundWordNumber = true;
        } else if (w === 'ratus') {
          current = (current || 1) * 100;
          foundWordNumber = true;
        } else if (w === 'ribu') {
          total += (current || 1) * 1000;
          current = 0;
          foundWordNumber = true;
        } else if (w === 'juta') {
          total += (current || 1) * 1000000;
          current = 0;
          foundWordNumber = true;
        } else if (Object.prototype.hasOwnProperty.call(wordNums, w)) {
          current += wordNums[w];
          foundWordNumber = true;
        }
      }

      if (foundWordNumber) {
        return total + current;
      }
      return 0;
    }

    function guessCategoryAndType(text) {
      const lower = text.toLowerCase();
      const isIncome = /(gaji|bonus|cuan|pemasukan|dapat|terima|transfer masuk|jual|freelance|komisi|thr)/.test(lower);

      if (isIncome) {
        const incomeCat = /(gaji|thr|upah)/.test(lower)
          ? state.categories.find(c => c.id === 'cat_gaji')
          : state.categories.find(c => c.id === 'cat_cuan_lain') || state.categories.find(c => c.type === 'income');
        return {
          type: 'income',
          categoryId: incomeCat ? incomeCat.id : (state.categories[0]?.id || 'cat_gaji')
        };
      }

      const keywordRules = [
        { regex: /(kopi|makan|nasi|mie|ayam|bakso|soto|boba|teh|sarapan|lunch|dinner|jajan|snack|roti|geprek|sushi|burger|warteg|cafe|kafe)/, catId: 'cat_makan' },
        { regex: /(ojol|gojek|grab|maxim|bensin|pertalite|pertamax|parkir|tol|kereta|mrt|lrt|busway|transjakarta|angkot|tiket)/, catId: 'cat_transport' },
        { regex: /(listrik|pln|air|pdam|wifi|internet|kuota|pulsa|tagihan|cicilan|bpjs|kos|sewa)/, catId: 'cat_tagihan' },
        { regex: /(beli|belanja|checkout|shopee|tokopedia|lazada|skincare|baju|sepatu|sabun|indomaret|alfamart)/, catId: 'cat_belanja' },
        { regex: /(bioskop|nonton|netflix|spotify|game|topup|nongkrong|karaoke|konser|hiburan)/, catId: 'cat_nongkrong' }
      ];

      for (const rule of keywordRules) {
        if (rule.regex.test(lower)) {
          const found = state.categories.find(c => c.id === rule.catId);
          if (found) return { type: 'expense', categoryId: found.id };
        }
      }

      const fallbackExpense = state.categories.find(c => c.type === 'expense') || state.categories[0];
      return {
        type: 'expense',
        categoryId: fallbackExpense ? fallbackExpense.id : 'cat_makan'
      };
    }

    function cleanTransactionNote(segment) {
      let note = segment
        .replace(/rp\.?\s*\d+(?:[.,]\d+)?\s*(jt|juta|rb|ribu|k|ratus)?/gi, '')
        .replace(/\b\d+(?:[.,]\d+)?\s*(jt|juta|rb|ribu|k|ratus)\b/gi, '')
        .replace(/\b(beli|bayar|buat|untuk|abis|habis|tadi|barusan)\b/gi, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      if (!note) note = 'Catatan Transaksi';
      return note.charAt(0).toUpperCase() + note.slice(1);
    }

    function parseMultiTransactionsFromText(rawText) {
      const segments = String(rawText || '')
        .split(/\b(?:dan|sama|terus|lalu|kemudian|serta)\b|[,;\n]+/i)
        .map(s => s.trim())
        .filter(Boolean);

      const results = [];
      const todayISO = toISODate(new Date());

      for (const seg of segments) {
        const amount = parseIndonesianSpokenAmount(seg);
        if (amount > 0) {
          const { type, categoryId } = guessCategoryAndType(seg);
          results.push({
            id: uid('draft'),
            type,
            amount,
            categoryId,
            date: todayISO,
            note: cleanTransactionNote(seg)
          });
        }
      }
      return results;
    }

    // =========================================================================
    // 6. BUDGET LIMIT CHECKER & DAILY REMINDER SCHEDULER
    // =========================================================================
    function checkCategoryBudgetAlert(categoryId) {
      const cat = state.categories.find(c => c.id === categoryId);
      if (!cat || cat.type !== 'expense' || !cat.budgetLimit || cat.budgetLimit <= 0) return;

      const stats = getCycleStats(0);
      const spent = stats.expenseByCategory[categoryId] || 0;
      const pct = Math.round((spent / cat.budgetLimit) * 100);

      if (pct >= 100) {
        const title = `🚨 Limit ${cat.name} Jebol (${pct}%)!`;
        const body = `Total keluar ${formatIDR(spent)} dari batas ${formatIDR(cat.budgetLimit)} siklus ini.`;
        showToast(title, body, 'rose');
        pushNotification(title, body, 'danger');
      } else if (pct >= 80) {
        const sisa = Math.max(0, cat.budgetLimit - spent);
        const title = `⚠️ Lampu Kuning Pos ${cat.name} (${pct}%)`;
        const body = `Sisa jatah pos ini tinggal ${formatIDR(sisa)} lagi sampai gajian berikutnya.`;
        showToast(title, body, 'amber');
        pushNotification(title, body, 'warning');
      }
    }

    function setupDailyReminderScheduler() {
      setInterval(() => {
        if (!state.reminderEnabled || !state.reminderTime) return;
        const now = new Date();
        const todayISO = toISODate(now);
        if (state.lastReminderDate === todayISO) return;

        const currentHHMM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        if (currentHHMM === state.reminderTime) {
          state.lastReminderDate = todayISO;
          const title = '⏰ Waktunya Catat Cuan Hari Ini!';
          const body = 'Jangan sampai lupa catat jajan atau pemasukan hari ini biar arus kas tetap terkontrol.';
          showToast(title, body, 'teal');
          pushNotification(title, body, 'info');
          saveStateToStorage(false);

          if ('Notification' in window && Notification.permission === 'granted') {
            try {
              new Notification(title, { body });
            } catch (e) {}
          }
        }
      }, 20000);
    }

        <!-- Parsed Draft Cards -->

        </div>

        ${voiceRuntime.draftItems.length > 0 ? `

    function stopVoiceListening() {
      voiceRuntime.isListening = false;
      if (voiceRuntime.recognition) {
        try { voiceRuntime.recognition.stop(); } catch (e) {}
      }
    }

    function toggleVoiceListening() {
      if (voiceRuntime.isListening) {
        stopVoiceListening();
        voiceRuntime.statusMessage = 'Rekaman berhenti. Cek hasil deteksi di bawah.';
        renderVoiceModalBody();
        return;
      }

      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        voiceRuntime.statusMessage = 'Browser ini membatasi mikrofon. Gunakan tombol "Tes Cepat Kalimat Suara" di bawah.';
        renderVoiceModalBody();
        return;
      }

      try {
        const rec = new SpeechRec();
        rec.lang = 'id-ID';
        rec.continuous = false;
        rec.interimResults = true;

        rec.onstart = () => {
          voiceRuntime.isListening = true;
          voiceRuntime.statusMessage = 'Mendengarkan... silakan bicara sekarang.';
          renderVoiceModalBody();
        };

        rec.onresult = (event) => {
          let finalStr = '';
          let interimStr = '';
          for (let i = 0; i < event.results.length; i++) {
            const res = event.results[i];
            if (res.isFinal) {
              finalStr += res[0].transcript + ' ';
            } else {
              interimStr += res[0].transcript;
            }
          }
          if (finalStr.trim()) {
            voiceRuntime.transcript = (voiceRuntime.transcript + ' ' + finalStr).trim();
            voiceRuntime.draftItems = parseMultiTransactionsFromText(voiceRuntime.transcript);
          }
          voiceRuntime.interimTranscript = interimStr;
          renderVoiceModalBody();
        };

        rec.onerror = (event) => {
          voiceRuntime.isListening = false;
          voiceRuntime.statusMessage = `Mikrofon tidak tersedia (${event.error}). Coba klik contoh kalimat suara di bawah.`;
          renderVoiceModalBody();
        };

        rec.onend = () => {
          voiceRuntime.isListening = false;
          voiceRuntime.interimTranscript = '';
          voiceRuntime.statusMessage = voiceRuntime.draftItems.length > 0
            ? `Berhasil mendeteksi ${voiceRuntime.draftItems.length} transaksi!`
            : 'Selesai merekam. Tap mic lagi atau gunakan contoh suara.';
          renderVoiceModalBody();
        };

        voiceRuntime.recognition = rec;
        rec.start();
      } catch (err) {
        voiceRuntime.isListening = false;
        voiceRuntime.statusMessage = 'Izin mikrofon dibatasi. Gunakan tombol Tes Cepat di bawah.';
        renderVoiceModalBody();
      }
    }

    function simulateVoiceInput(sampleText) {
      stopVoiceListening();
      voiceRuntime.transcript = sampleText;
      voiceRuntime.interimTranscript = '';
      voiceRuntime.draftItems = parseMultiTransactionsFromText(sampleText);
      voiceRuntime.statusMessage = `Berhasil mendeteksi ${voiceRuntime.draftItems.length} transaksi dari suara!`;
      renderVoiceModalBody();
    }

    function updateVoiceDraftItem(idx, field, val) {
      if (!voiceRuntime.draftItems[idx]) return;
      voiceRuntime.draftItems[idx][field] = val;
      if (field === 'categoryId') {
        const cat = state.categories.find(c => c.id === val);
        if (cat) voiceRuntime.draftItems[idx].type = cat.type;
      }
    }

    function removeVoiceDraftItem(idx) {
      voiceRuntime.draftItems.splice(idx, 1);
      renderVoiceModalBody();
    }

    function saveVoiceDraftItems() {
      if (!requireAuthForRecording('simpan transaksi suara')) return;
      const validItems = voiceRuntime.draftItems.filter(i => Number(i.amount) > 0);
      if (!validItems.length) return;

      const checkedCats = new Set();
      for (const item of validItems) {
        state.transactions.unshift({
          id: uid('tx'),
          type: item.type,
          amount: Number(item.amount),
          categoryId: item.categoryId,
          date: item.date || toISODate(new Date()),
          note: item.note || 'Catatan Suara',
          receiptImage: ''
        });
        if (item.type === 'expense') checkedCats.add(item.categoryId);
      }

      state.isDemoData = false;
      saveStateToStorage();
      closeModal();
      showToast(`${validItems.length} Transaksi Tersimpan! 🎙️`, 'Otomatis masuk ke siklus gajian aktif & cloud.', 'mint');
      checkedCats.forEach(catId => checkCategoryBudgetAlert(catId));
      render();
    }

    // 8. MODAL FRAMEWORK

    function showModal(innerHtml) {
      const backdrop = document.getElementById('modalBackdrop');
      if (!backdrop) return;
      backdrop.innerHTML = `

          <div class="w-10 h-1 rounded-full bg-slate-200 mx-auto mb-3 sm:hidden"></div>
          ${innerHtml}
        </div>
      `;
      backdrop.classList.remove('hidden');
      backdrop.onclick = () => {
        stopVoiceListening();
        closeModal();
      };
      if (window.lucide) window.lucide.createIcons();
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.innerHTML = '';
    }

    function render() {
      const mainView = document.getElementById('mainView');
      if (!mainView) return;

      const tabs = ['beranda', 'transaksi', 'laporan', 'lainnya'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (!btn) return;
        if (t === state.activeTab) {
          btn.classList.remove('text-slate-400');
          btn.classList.add('text-[#127084]');
        } else {
          btn.classList.remove('text-[#127084]');
          btn.classList.add('text-slate-400');
        }
      });

      if (state.activeTab === 'beranda') {
        mainView.innerHTML = renderBerandaView();
      } else if (state.activeTab === 'transaksi') {
        mainView.innerHTML = renderTransaksiView();
      } else if (state.activeTab === 'laporan') {
        mainView.innerHTML = renderLaporanView();
        setTimeout(initLaporanChart, 30);
      } else if (state.activeTab === 'lainnya') {
        mainView.innerHTML = renderLainnyaView();
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }

    function initLaporanChart() {
      const canvas = document.getElementById('cuanFlowChart');
      if (!canvas || !window.Chart) return;

      if (activeChartInstance) {
        activeChartInstance.destroy();
        activeChartInstance = null;
      }

      const stats = getCycleStats(state.cycleOffset);
      const labels = [];
      const incomeSeries = [];
      const expenseSeries = [];

      if (state.chartMode === 'weekly') {
        const weekBuckets = [
          { label: 'Minggu 1', inc: 0, exp: 0 },
          { label: 'Minggu 2', inc: 0, exp: 0 },
          { label: 'Minggu 3', inc: 0, exp: 0 },
          { label: 'Minggu 4+', inc: 0, exp: 0 }
        ];
        for (const tx of stats.txs) {
          const d = new Date(tx.date + 'T00:00:00');
          const diffDays = Math.max(0, Math.floor((d - stats.cycle.startDate) / 86400000));
          const wIdx = Math.min(3, Math.floor(diffDays / 7));
          if (tx.type === 'income') weekBuckets[wIdx].inc += Number(tx.amount) || 0;
          else weekBuckets[wIdx].exp += Number(tx.amount) || 0;
        }
        weekBuckets.forEach(b => {
          labels.push(b.label);
          incomeSeries.push(b.inc);
          expenseSeries.push(b.exp);
        });
      } else {
        const dayMap = {};
        for (const tx of stats.txs) {
          if (!dayMap[tx.date]) dayMap[tx.date] = { inc: 0, exp: 0 };
          if (tx.type === 'income') dayMap[tx.date].inc += Number(tx.amount) || 0;
          else dayMap[tx.date].exp += Number(tx.amount) || 0;
        }
        const sortedDates = Object.keys(dayMap).sort();
        if (sortedDates.length === 0) {
          labels.push('Belum ada data');
          incomeSeries.push(0);
          expenseSeries.push(0);
        } else {
          sortedDates.forEach(iso => {
            const parts = iso.split('-');
            labels.push(`${Number(parts[2])}/${Number(parts[1])}`);
            incomeSeries.push(dayMap[iso].inc);
            expenseSeries.push(dayMap[iso].exp);
          });
        }
      }

      activeChartInstance = new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels,
          datasets: [
            {
              label: 'Cuan Masuk',
              data: incomeSeries,
              backgroundColor: '#10B981',
              borderRadius: 6
            },
            {
              label: 'Cuan Keluar',
              data: expenseSeries,
              backgroundColor: '#127084',
              borderRadius: 6
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 10, font: { size: 11, family: 'Inter' } }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                font: { size: 10 },
                callback: (val) => formatShortIDR(val)
              },
              grid: { color: '#F1F5F9' }
            },
            x: {
              ticks: { font: { size: 10 } },
              grid: { display: false }
            }
          }
        }
      });
    }

    function handleManualTxSubmit(e) {
      e.preventDefault();
      if (!requireAuthForRecording('simpan transaksi')) return;

      const typeEl = document.querySelector('input[name="txType"]:checked');
      const type = typeEl ? typeEl.value : 'expense';
      const amount = parseFormattedNumber(document.getElementById('manualAmountInput').value);
      const categoryId = document.getElementById('manualCategoryInput').value;
      const date = document.getElementById('manualDateInput').value || toISODate(new Date());
      const note = document.getElementById('manualNoteInput').value.trim();

      if (amount <= 0) {
        showToast('Nominal Kosong', 'Masukkan nominal lebih dari Rp 0 ya!', 'amber');
        return;
      }

      state.transactions.unshift({
        id: uid('tx'),
        type,
        amount,
        categoryId,
        date,
        note: note || (state.categories.find(c => c.id === categoryId)?.name || 'Transaksi'),
        receiptImage: window._pendingReceiptDataUrl || ''
      });

      window._pendingReceiptDataUrl = '';
      state.isDemoData = false;
      saveStateToStorage();
      closeModal();
      showToast('Tercatat! ✅', `${type === 'income' ? 'Cuan masuk' : 'Cuan keluar'} ${formatIDR(amount)} tersimpan.`, 'mint');
      if (type === 'expense') checkCategoryBudgetAlert(categoryId);
      render();
    }

    function handleAiTextSubmit(e) {
      e.preventDefault();
      if (!requireAuthForRecording('catat AI')) return;

      const raw = document.getElementById('aiNaturalTextInput').value.trim();
      const parsed = parseMultiTransactionsFromText(raw);
      if (!parsed.length) {
        showToast('Belum Terbaca', 'Sertakan nominal di kalimatmu ya (contoh: "Nasi padang 25rb").', 'amber');
        return;
      }

      const checkedCats = new Set();
      parsed.forEach(item => {
        state.transactions.unshift({
          id: uid('tx'),
          type: item.type,
          amount: item.amount,
          categoryId: item.categoryId,
          date: item.date,
          note: item.note,
          receiptImage: ''
        });
        if (item.type === 'expense') checkedCats.add(item.categoryId);
      });

      state.isDemoData = false;
      saveStateToStorage();
      closeModal();
      showToast(`✨ ${parsed.length} Transaksi Dicatat!`, 'AI otomatis mengelompokkan kategori & nominal.', 'mint');
      checkedCats.forEach(catId => checkCategoryBudgetAlert(catId));
      render();
    }

    function handleReceiptFileUpload(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;

      const previewArea = document.getElementById('scanPreviewArea');
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = 720;
          const scale = img.width > maxW ? maxW / img.width : 1;
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.72);
          window._pendingReceiptDataUrl = compressedDataUrl;

          if (previewArea) {
            previewArea.innerHTML = `
              <div class="relative rounded-2xl overflow-hidden border border-slate-200 max-h-48 flex items-center justify-center bg-slate-900">
                <img src="${compressedDataUrl}" alt="Struk" class="max-h-48 object-contain opacity-85" />
                <div class="animate-scan-laser absolute left-0 right-0 h-0.5 bg-emerald-400 shadow-[0_0_10px_#34d399]"></div>
              </div>
              <p class="text-[11px] text-center text-[#127084] font-bold mt-2">Memindai detail struk...</p>
            `;
          }

          setTimeout(() => {
            const amountMatch = file.name.match(/(\d{4,7})/);
            const guessedAmount = amountMatch ? parseInt(amountMatch[1], 10) : 45000;
            renderAddModalBody('manual', {
              type: 'expense',
              amount: guessedAmount,
              categoryId: 'cat_makan',
              note: 'Struk Belanja / QRIS',
              receiptImage: compressedDataUrl
            });
          }, 1200);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function savePaydaySettings(e) {
      e.preventDefault();
      const defVal = parseInt(document.getElementById('defaultPaydayInput').value, 10);
      if (defVal >= 1 && defVal <= 31) {
        state.defaultPayday = defVal;
      }
      document.querySelectorAll('.month-payday-input').forEach(inp => {
        const mk = inp.getAttribute('data-month-key');
        const v = parseInt(inp.value, 10);
        if (v >= 1 && v <= 31) {
          state.monthlyPaydays[mk] = v;
        } else {
          delete state.monthlyPaydays[mk];
        }
      });
      saveStateToStorage();
      closeModal();
      showToast('Siklus Gajian Diperbarui 📅', 'Perhitungan saldo & laporan otomatis menyesuaikan.', 'mint');
      render();
    }

    // =========================================================================
    // 16. BACKUP, CSV EXPORT, SAMPLE RECEIPT & DUMMY SEED DATA

    function exportJSONBackup() {
      const backupObj = {
        app: 'Cuan PWA',
        exportedAt: new Date().toISOString(),
        defaultPayday: state.defaultPayday,
        monthlyPaydays: state.monthlyPaydays,
        categories: state.categories,
        transactions: state.transactions
      };
      const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cuan-backup-${toISODate(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup JSON Diunduh 📦', 'Simpan file ini sebagai cadangan datamu.', 'mint');
    }

    function importJSONBackup(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (Array.isArray(data.categories) && data.categories.length) state.categories = data.categories;
          if (Array.isArray(data.transactions)) state.transactions = data.transactions;
          if (typeof data.defaultPayday === 'number') state.defaultPayday = data.defaultPayday;
          if (data.monthlyPaydays) state.monthlyPaydays = data.monthlyPaydays;
          saveStateToStorage();
          showToast('Restore Berhasil ✅', `${state.transactions.length} transaksi berhasil dipulihkan.`, 'mint');
          render();
        } catch (err) {
          showToast('File Tidak Valid', 'Pastikan file backup berformat .JSON dari aplikasi Cuan.', 'rose');
        }
      };
      reader.readAsText(file);
    }

    function exportCSVTransactions() {
      const rows = [['Tanggal', 'Tipe', 'Kategori', 'Nominal', 'Catatan']];
      state.transactions.forEach(tx => {
        const cat = state.categories.find(c => c.id === tx.categoryId);
        rows.push([
          tx.date,
          tx.type === 'income' ? 'Pemasukan' : 'Pengeluaran',
          cat ? cat.name : 'Lainnya',
          tx.amount,
          `"${String(tx.note || '').replace(/"/g, '""')}"`
        ]);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `laporan-cuan-${toISODate(new Date())}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('CSV Diunduh 📊', 'Siap dibuka di Microsoft Excel atau Google Sheets.', 'mint');
    }

    function seedDummyPreviewData(shouldPersist = false) {
      state.transactions = buildDummyTransactions();
      state.isDemoData = true;
      state.cycleOffset = 0;
      if (shouldPersist) saveStateToStorage(false);
    }

    function populateSampleData() {
      state.transactions = buildDummyTransactions();
      state.isDemoData = state.userMode !== 'supabase';
      state.cycleOffset = 0;
      saveStateToStorage();
      showToast('Data Contoh Dimuat! ✨', 'Cek grafik laporan, vibe check, & bukti struk digital.', 'mint');
      render();
    }

    // =========================================================================
    // 17. BOOTSTRAP & SERVICE WORKER REGISTRATION
    // =========================================================================
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPWAInstallPrompt = e;
      if (state.activeTab === 'lainnya') render();
    });

    function bootCuanApp() {
      if (window.__cuanAppInitialized) return;
      window.__cuanAppInitialized = true;

      loadStateFromStorage();
      applyUrlAutoConfigParams();

      if (state.userMode !== 'supabase' && state.transactions.length === 0) {
        seedDummyPreviewData(true);
      }

      setupDailyReminderScheduler();
      render();
      initSupabaseAuthListener();

      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootCuanApp);
    } else {
      bootCuanApp();
    }
  </script>
